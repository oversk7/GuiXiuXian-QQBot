name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # 无需依赖的快速检查放最前，秒级失败
      - name: 语法检查（全量编译）
        run: python -m compileall -q plugins bot.py

      - name: 帮助文档一致性（新命令必须写帮助）
        run: python scripts/check_help_consistency.py

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      - name: 单元测试
        run: python -m pytest -q tests/
