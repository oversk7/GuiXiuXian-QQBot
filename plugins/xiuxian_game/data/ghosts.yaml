  - ghost_id: "se_gui"
    name: "色鬼"
    description: "色字头上一把刀，在淋浴上安装摄像头时，触电而死，特殊能力为霉运，能影响自己和周边之人的运气。"
    hp: 650
    attack: 100
    defense: 90
    agility: 95
    base_prestige_level: 1
