    description: "发出诡异呻吟声的怨灵，拖着破碎的身躯缓缓爬行。她的怨念源于被丈夫杀害的悲惨遭遇。"
    hp: 750
    attack: 110
    defense: 70
    agility: 85
    base_prestige_level: 2
    required_attribute: "mp"  # 理智
    attribute_per_level: 50
    fragment_item_id: "kayako_fragment"
