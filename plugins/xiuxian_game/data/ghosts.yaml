# 鬼怪配置文件
ghosts:
  - ghost_id: "sadako"
    name: "贞子"
    description: "从电视机中爬出的怨灵，长发遮面，散发着诅咒的气息。她的怨念来自于被推入井中的痛苦经历。"
    hp: 800
    attack: 120
    defense: 80
    agility: 90
    base_prestige_level: 2
    required_attribute: "mp"  # 理智
    attribute_per_level: 50
    fragment_item_id: "sadako_fragment"
    fragment_drop_rate: 0.3
    fragments_to_complete: 10
    rarity: "epic"
    special_abilities:
      curse_video: "有概率在战斗中播放诅咒录像，降低对手理智"
      well_emergence: "从井中爬出时获得额外攻击力加成"

  - ghost_id: "kayako"
