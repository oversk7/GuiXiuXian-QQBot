# 鬼怪配置文件
ghosts:
  - ghost_id: "insurance_man"
    name: "保险鬼"
    description: "一位通体漆黑的西装男子，强制要求你购买生存保险，即买保险的人必须活到到保单规定的时间，才能够领取保险金。假如买保险的人中途死亡，他就不能领回自己交的保险费，而保险公司许诺的保险金，也与他无关，谁让他活不到约定好的年龄呢。\n“买保险，嘻嘻嘻……我要买保险！”\n“我要买九十九年！”\n“我买一百年！”"
    hp: 600
    attack: 85
    defense: 120
    agility: 75
    base_prestige_level: 3
    required_attribute: "mp"
    attribute_per_level: 30
    fragment_item_id: "insurance_man_fragment"
    fragment_drop_rate: 0.3
    fragments_to_complete: 10
    rarity: "epic"

  - ghost_id: "black_dog"
    name: "黑犬"
    description: "其拥有九成狗的灵魂和一成人的灵魂，是在某种外力干预下形成的特殊厉鬼，特殊能力为狂犬。"
    hp: 550
    attack: 140
    defense: 60
    agility: 110
    base_prestige_level: 2
    required_attribute: "attack"
    attribute_per_level: 50
    fragment_item_id: "black_dog_fragment"
    fragment_drop_rate: 0.6
    fragments_to_complete: 10
    rarity: "common"

  - ghost_id: "wang_mei"
    name: "王梅"
    description: "她患有一种精神疾病，越是狭小的空间，越能带给她安全感。她的死因是个迷，警察在桌子下面一个木盒当中发现了她的尸体，没人知道她是怎么进去的，现场没有检测到除她之外第二个人的指纹，特殊能力为变形。"
    hp: 750
    attack: 70
    defense: 150
    agility: 60
    base_prestige_level: 1
    required_attribute: "defense"
    attribute_per_level: 50
    fragment_item_id: "wang_mei_fragment"
    fragment_drop_rate: 0.3
    fragments_to_complete: 10
    rarity: "rare"

  - ghost_id: "he_bei_bei"
    name: "何贝贝"
    description: "被小区里高空坠落的水杯砸中脑袋，不幸身亡，怨气很重，苦于无法找到杀害自己的元凶，只能躲在杯子下面，当人喝水时，她会从被子底部观察那人，特殊能力为透视。"
    hp: 500
