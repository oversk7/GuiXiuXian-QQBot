  - ghost_id: "geng_gui"
    name: "耿鬼"
    description: "他死时，嘴里还咬着那把剪刀。舌头被剪断，喉咙也开了。没人知道他是自残，还是与‘什么东西’争夺剪刀失败。死后，他喜欢剪——剪影子，剪指头，剪睡梦中人的嘴巴。被他盯上的人，早晨醒来时，会发现嘴角裂开两寸长，像被笑过头。他死时，嘴里还咬着那把剪刀。舌头被剪断，喉咙也开了。没人知道他是自残，还是和‘什么东西’争夺剪刀失败。死后，他喜欢剪——剪影子，剪指头，剪睡梦中人的嘴巴。被他盯上的人，早上醒来时，嘴角裂开两寸，像是被人硬生生剪出一个笑。‘咔哒……咔哒……张嘴。让我剪个满意的笑。’‘咔哒……咔哒……张嘴。让我剪个满意的笑。"
    hp: 580
    attack: 90
    defense: 80
    agility: 105
    base_prestige_level: 2
    required_attribute: "luck"
    attribute_per_level: 45
    fragment_item_id: "geng_gui_fragment"
    fragment_drop_rate: 0.5
    fragments_to_complete: 10
    rarity: "rare"  # 因其独特恐怖机制，提升为稀有