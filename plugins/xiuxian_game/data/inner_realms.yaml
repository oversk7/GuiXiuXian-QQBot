        obtain_method: "observe"
        obtain_scene: "kitchen_secret"
        description: "四张宣传广告倒过来看：女人不是从冰箱「取出」肉，而是把客人「塞进」冰箱"
        reveal: "老人的妻子在变异前就已经参与杀人"

      - id: "clue_8"
        name: "镇口告示牌背面"
        obtain_method: "observe"
        obtain_scene: "town_entrance_dusk"
        description: "告示牌背面用血写着：「他们不是在保护你，是在把猎物赶进笼子里」"
        reveal: "整个镇的规则就是一个陷阱——把活人逼进建筑里，方便各个杀手分食"

