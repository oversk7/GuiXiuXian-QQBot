        description: "你带着所有真相离开了裂隙。这座小镇不是被诡异入侵——镇上的每个人都是捕食者，旅馆是他们的猎场，「天黑别出门」是赶猎物入笼的规则。唯一的意外是老人的妻子变成了怪物，打破了他们的平衡。你是第一个看清全貌并活着离开的人"
