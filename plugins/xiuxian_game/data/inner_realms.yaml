# 里界系统配置文件
# 定义所有里界的基本信息、事件、NPC、线索和结局

# 全局设置
global:
  # 地图尺寸（25x25）
  map_size: 25
  # 每日刷新时间（0点）
  refresh_hour: 0
  # 操作冷却（秒）
  cooldowns:
    search: 15        # 搜刮冷却 15 秒
    intimidate: 15    # 威吓冷却 15 秒
    assassination: 20 # 处决冷却 20 秒
    move: 3           # 移动冷却 3 秒
    battle: 0         # 战斗无冷却
  # 理智系统
  sanity_system:
    max_sanity: 100       # 最大理智值
    initial_sanity: 100   # 初始理智值
    warning_threshold: 50 # 警告阈值
    danger_threshold: 30  # 危险阈值
    critical_threshold: 10 # 极度危险阈值

# 时间系统
time_system:
  # 白昼 (6:00-18:00)
  day:
    start_hour: 6
    end_hour: 18
    bonuses:
      search: 1  # 搜刮判定+1
      combat: 0
  # 黄昏 (18:00-22:00)
  dusk:
    start_hour: 18
    end_hour: 22
    bonuses:
      search: 0
      combat: 0
  # 深夜 (22:00-6:00)
  night:
    start_hour: 22
    end_hour: 6
    bonuses:
      search: 0
      combat: 1  # 战斗判定+1

# 认知篡改系统
cognition_tamper_system:
  # 篡改类型定义
  tamper_types:
    # 假象NPC - 看到不存在的NPC
    phantom_npc:
      name: "幻影"
      description: "你看到了一个人影，但当你靠近时..."
      trigger_chance: 0.15  # 理智<50时触发概率
      sanity_cost: -5
      effects:
        - "生成虚假NPC"
        - "攻击时发现是幻觉"
        - "理智-5"

    # 记忆篡改 - 篡改击杀记录
    memory_alteration:
      name: "记忆错乱"
      description: "你的记忆开始模糊..."
      trigger_chance: 0.10
      sanity_cost: -10
      effects:
        - "击杀数±1-3"
        - "坐标记忆偏移"
        - "理智-10"

    # 感官扭曲 - 看到错误的事件类型
    sensory_distortion:
      name: "感官扭曲"
      description: "你的眼前开始出现重影..."
      trigger_chance: 0.20
      sanity_cost: -3
      effects:
        - "EMPTY显示为NPC"
        - "LOOT显示为CLUE"
        - "理智-3"

    # 时间错觉 - 感觉时间流逝异常
    time_dilation:
      name: "时间错乱"
      description: "时钟的指针开始倒转..."
      trigger_chance: 0.08
      sanity_cost: -8
      effects:
        - "时间显示错误"
        - "冷却时间感知错误"
        - "理智-8"

    # 身份混淆 - 最恐怖的篡改
    identity_confusion:
      name: "我是谁？"
      description: "「等等...我来这里是为了什么？」"
      trigger_chance: 0.05  # 理智<30时才可能触发
      sanity_cost: -20
      effects:
        - "暂时忘记进入里界的目的"
        - "看到的NPC对话变成自己的独白"
        - "理智-20"
      critical: true  # 极度危险的篡改

    # 反转真相 - 真假颠倒
    truth_inversion:
      name: "真相反转"
      description: "也许...一切都反过来了？"
      trigger_chance: 0.03
      sanity_cost: -15
      effects:
        - "线索内容反转（受害者变成施暴者）"
        - "NPC台词含义反转"
        - "理智-15"
      critical: true

  # 理智损失触发器
  sanity_loss_triggers:
    witness_death:
      amount: -5
      description: "目睹死亡"

    read_disturbing_clue:
      amount: -8
      description: "阅读令人不安的线索"

    encounter_boss:
      amount: -15
      description: "遭遇核心诡异"

    critical_failure:
      amount: -10
      description: "判定大失败"

    kill_innocent:
      amount: -3
      description: "击杀无辜者"

    stay_too_long:
      amount: -2
      description: "在里界停留过久（每小时）"

  # 理智恢复方式
  sanity_recovery:
    rescue_survivor:
      amount: 5
      description: "救出幸存者"

    reveal_truth:
      amount: 10
      description: "揭示真相（收集线索）"

    leave_realm:
      amount: 20
      description: "离开里界"

    defeat_boss:
      amount: 15
      description: "击败核心诡异"

# 里界定义
realms:
  liwan_ghost_town:
    display_name: "荔湾鬼镇"
    description: "诡域深处的凝固时空，三十年前荔湾镇被吞噬的瞬间被永久定格"
    level_requirement: 50
    narrative_type: "survival"
    suppress_cultivation: true

    # 阶段机制
    phases:
      dusk:
        max_moves: 5
        outdoor_allowed: true
      night:
        outdoor_allowed: false

    # ==================== 场景节点 ====================
    scenes:
      # ---------- 黄昏·户外 ----------
      town_entrance_dusk:
        display_name: "镇口·黄昏"
        type: "main"
        outdoor: true
        description: "天色将暗，你踏入了这片凝固的时空。荔湾镇的轮廓在暮色中显现——歪斜的路灯、褪色的招牌、空无一人的街道。远处有建筑的灯光，但看不清是什么。一块残破的告示牌上写着：「天黑后，请勿在室外逗留。」"
        first_visit_text: "修为被一股无形的力量压制，你感到自己变得和凡人一样脆弱。这片凝固时空中的一切都是三十年前的残影——但危险是真实的。"
        connections: ["apartment_ground", "crossroads", "clinic", "convenience_store"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "bloodstained_room_card", qty: 2}], gold: 300}
          success: {items: [{id: "bloodstained_room_card", qty: 1}], gold: 150}
          normal: {gold: 100}
          failure: {}
        search_attribute: "luck"
        events: []
        clue_on_observe: "clue_8"
        observe_text: "你绕到告示牌背面。血迹已经干涸发黑，但字迹依然清晰：「他们不是在保护你，是在把猎物赶进笼子里。」"
        danger_level: "safe"

      crossroads:
        display_name: "十字路口"
        type: "branch"
        outdoor: true
        description: "四条街道在这里交汇。路口中央站着一个穿黑色斗篷的高瘦身影，面朝你缓缓招手。地上散落着几具尸体的随身物品——钱包、手表、证件。"
        first_visit_text: "那个身影没有脸。斗篷下空空如也，但你确信它在看着你。"
        connections: ["town_entrance_dusk"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "faceless_skin", qty: 1}], gold: 200}
          success: {items: [{id: "bloodstained_room_card", qty: 1}], gold: 200}
          normal: {gold: 100}
          failure: {sanity: -10, text: "你靠得太近了。死神的手指擦过你的额头，冰冷刺骨——"}
        search_attribute: "luck"
        events:
          - id: "death_approach"
            name: "靠近死神"
            description: "你被那个招手的身影吸引，不由自主地走近..."
            trigger: "auto_on_enter"
            dice_check: {attribute: "luck", difficulty: 10}
            success_text: "你在最后一刻停住了脚步。一股寒意从脚底升起，你的直觉在尖叫：不要再靠近了。"
            failure_text: "你的双腿不听使唤地往前走。死神的手搭上了你的肩膀，你感到灵魂被撕裂——"
            failure_sanity: -30
        danger_level: "high"

      clinic:
        display_name: "废弃诊所"
        type: "branch"
        outdoor: true
        description: "一栋两层小楼，褪色的招牌写着「荔湾社区诊所」。玻璃门碎了一半，里面传来孩子的笑声。几个孩子在走廊里跑来跑去，但他们的脚没有接触地面。"
        first_visit_text: "「来玩啊！」一个扎着双马尾的小女孩朝你招手，她的笑容天真无邪——但她的影子比她高两倍。"
        connections: ["town_entrance_dusk"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "expired_canned_food", qty: 2, is_key_item: true}]}
          success: {items: [{id: "expired_canned_food", qty: 1, is_key_item: true}, {id: "bloodstained_room_card", qty: 1}]}
          normal: {items: [{id: "expired_canned_food", qty: 1, is_key_item: true}]}
          failure: {text: "药柜突然倒下，发出巨大的声响。孩子们的笑声停了。它们齐刷刷地转过头来看着你——", sanity: -5}
        search_attribute: "intelligence"
        events:
          - id: "hide_and_seek"
            name: "捉迷藏"
            description: "「姐姐/哥哥，和我们一起玩捉迷藏好不好？」幽灵儿童们围着你，期待地看着你。"
            trigger: "on_talk"
            choices:
              - id: "play"
                label: "参与游戏"
                text: "你答应了。孩子们欢呼着散开。你闭上眼数到十，睁开眼时——诊所消失了，你站在一片无尽的黑暗中。孩子们的笑声从四面八方传来，越来越近..."
                result: "death"
              - id: "refuse"
                label: "拒绝"
                text: "「不了，谢谢。」孩子们的笑容凝固了一瞬，然后她们交换了一个你看不懂的眼神。「那...下次吧。」她们飘走了，但你觉得她们并没有走远。"
                sanity_change: -3
              - id: "ask_info"
                label: "问她们关于旅馆的事"
                text: "「旅馆？」小女孩歪着头，「那个老板叔叔很好的，他每天都给我们做蛋糕吃。不过...吃蛋糕的客人后来都不见了呢。」她说完就飘走了，留下一串银铃般的笑声。"
                sanity_change: -2
        danger_level: "medium"

      convenience_store:
        display_name: "便利店"
        type: "branch"
        outdoor: true
        description: "一家街角便利店，卷帘门半开着。货架东倒西歪，食物大多已经腐烂。收银台后面坐着一具干尸，手里还攥着找零的硬币。它的嘴巴大张着，像是死前在尖叫。"
        first_visit_text: "收银台上的计算器还亮着，显示屏上跳动着一串数字。你仔细看——那是今天的日期。"
        connections: ["town_entrance_dusk"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "bloodstained_room_card", qty: 2}, {id: "expired_canned_food", qty: 1, is_key_item: true}]}
          success: {items: [{id: "bloodstained_room_card", qty: 1}], gold: 100}
          normal: {gold: 50}
          failure: {}
        search_attribute: "luck"
        events: []
        danger_level: "safe"

      # ---------- 公寓区域 ----------
      apartment_ground:
        display_name: "小区楼下"
        type: "main"
        outdoor: true
        description: "一栋老旧的居民楼，外墙贴满了小广告。电梯门缓缓打开，一个穿黑色雨衣的男人走了出来。你看不清他的脸，但记住了他的身体特征——左手小指缺了一节，雨衣下摆沾着暗红色的东西。"
        first_visit_text: "雨衣男从你身边走过时，你闻到了铁锈的味道。他没有看你一眼。"
        connections: ["home", "town_entrance_dusk"]
        searchable: false
        events: []
        danger_level: "safe"

      home:
        display_name: "家中"
        type: "main"
        outdoor: false
        description: "打开家门，一股血腥味扑面而来。继父倒在客厅的血泊中，已经没有呼吸了。茶几上还放着没喝完的茶，电视机播放着雪花屏。"
        first_visit_text: "你注意到门锁没有被破坏的痕迹。继父是自己开的门。他认识凶手。"
        connections: ["bedroom", "apartment_ground"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "faceless_skin", qty: 1}, {id: "needle_thread", qty: 1, is_key_item: true}]}
          success: {items: [{id: "needle_thread", qty: 1, is_key_item: true}], gold: 100}
          normal: {items: [{id: "needle_thread", qty: 1, is_key_item: true}]}
          failure: {text: "你翻找的动作太大了。楼道里传来脚步声——有人在靠近。", sanity: -5}
        search_attribute: "luck"
        clue_on_observe: "clue_1"
        observe_text: "你蹲下来仔细观察继父的尸体。他的左手小指缺了一节——和电梯里那个雨衣男一模一样。身上有两处刀伤，但地上只有一把刀。等等...这意味着什么？"
        danger_level: "safe"

      bedroom:
        display_name: "卧室"
        type: "main"
        outdoor: false
        description: "你关上门，走进卫生间洗漱。抬头看了一眼镜子——镜子里没有你的影子。你慌忙退出来，在衣柜里找到了针线和布匹。此时墙壁传来「咚...咚...咚...」的声音，像是隔壁有人在用头撞墙。"
        first_visit_text: "你数了一下节奏。不是撞墙——是在敲。三短，三长，三短。SOS。"
        connections: ["hallway", "neighbor_room", "home"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "bloodstained_room_card", qty: 1}, {id: "cloth", qty: 1, is_key_item: true}]}
          success: {items: [{id: "cloth", qty: 1, is_key_item: true}]}
          normal: {}
          failure: {text: "镜子里出现了一张脸。不是你的脸。它在对你笑。", sanity: -15}
        search_attribute: "luck"
        events:
          - id: "mirror_event"
            name: "镜中人"
            trigger: "on_search_failure"
            dice_check: {attribute: "luck", difficulty: 8}
            success_text: "你移开了视线，不敢再看。镜子里传来轻轻的叹息声，然后归于寂静。"
            failure_text: "你盯着镜中的脸看了太久。它开始模仿你的表情——但总是慢半拍。当你试图转身离开时，它的手从镜面伸了出来。"
            failure_sanity: -15
        danger_level: "medium"

      neighbor_room:
        display_name: "隔壁房间"
        type: "branch"
        outdoor: false
        description: "你推开隔壁的门。房间里漆黑一片，窗帘被钉死在墙上。空气中弥漫着腐烂的甜腻味道。角落里挂着一件红色的连衣裙，裙摆还在微微晃动——但房间里没有风。"
        first_visit_text: "门在你身后缓缓关上了。锁芯发出「咔哒」一声。"
        connections: ["bedroom"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "faceless_skin", qty: 2}], gold: 300}
          success: {items: [{id: "faceless_skin", qty: 1}], gold: 150}
          normal: {gold: 100}
          failure: {text: "红衣裙动了。不是风吹的——里面有东西。它朝你飘过来。", result: "death"}
        search_attribute: "agility"
        events:
          - id: "red_dress_ghost"
            name: "红衣女鬼"
            trigger: "auto_on_enter"
            dice_check: {attribute: "agility", difficulty: 10}
            success_text: "你的直觉让你在最后一刻后退了一步。红裙从你面前掠过，带起一阵阴风。你转身冲出房间，猛地摔上门。"
            failure_text: "红裙裹住了你。一张苍白的脸从布料中浮现，嘴角裂到耳根。她用冰冷的手指捏住了你的下巴——"
            failure_result: "death"
        danger_level: "deadly"

      hallway:
        display_name: "楼道"
        type: "main"
        outdoor: false
        description: "你透过猫眼看到——雨衣男站在门外，手里握着尖刀。他在等你开门。从窗户望下去，楼下草丛里一个穿蓝色厂服的男人正在肢解一具尸体，动作熟练得像在处理鱼。"
        first_visit_text: "你得想办法离开这里。雨衣男不会一直等下去。"
        connections: ["hotel_lobby", "bushes", "bedroom"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "room_card_4", qty: 1, is_key_item: true}], gold: 200}
          success: {items: [{id: "room_card_4", qty: 1, is_key_item: true}]}
          normal: {}
          failure: {text: "雨衣男听到了动静。门开始剧烈晃动——他在撞门！", sanity: -10}
        search_attribute: "agility"
        events:
          - id: "lure_factory_man"
            name: "引诱厂服男"
            trigger: "on_use_item"
            required_item: "needle_thread"
            description: "你把一卷针线从窗户扔了下去。楼下厂服男被吸引了注意力，他目光上移，数着你的楼层。不一会儿，门外传来激烈的打斗声——厂服男和雨衣男厮打起来。声音渐行渐远。"
            result_text: "门前留下大量血迹。雨衣男的尸体倒在走廊里，厂服男似乎受了重伤离开了。你可以搜刮雨衣男的尸体获得房卡。"
            consume_item: true
            unlock_search: true
        npcs: ["raincoat_man"]
        clue_on_observe: "clue_2_trigger"
        danger_level: "high"

      bushes:
        display_name: "草丛"
        type: "branch"
        outdoor: true
        description: "楼下的灌木丛，空气中弥漫着血腥味。厂服男的「工作台」就在这里——一块塑料布上摆着各种工具，旁边堆着几个黑色垃圾袋。有些袋子的形状...不太对。"
        first_visit_text: "你踩到了什么软的东西。低头一看——是一只手。断口整齐，像是被锯子切的。"
        connections: ["hallway"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "faceless_skin", qty: 2}], gold: 300}
          success: {items: [{id: "faceless_skin", qty: 1}], gold: 150}
          normal: {gold: 100}
          failure: {text: "厂服男发现了你。他放下手里的骨锯，朝你走过来。", result: "death"}
        search_attribute: "agility"
        npcs: ["factory_man"]
        danger_level: "high"

      # ---------- 旅馆区域 ----------
      hotel_lobby:
        display_name: "旅馆大厅"
        type: "main"
        outdoor: false
        description: "你跑进了旅馆。身后的提头女鬼撞上了一层看不见的屏障，在门外发出无声的尖叫。旅馆老板面带微笑站在柜台后面。「每到晚上就有危险的客人。你有房卡吗？」他身后的墙上挂着一把猎枪，旁边贴着便签：「只剩一发了。」"
        first_visit_text: "老板的笑容让你想起了什么——但你想不起来是什么。"
        connections: ["room_4"]
        required_items: ["room_card_4"]
        searchable: false
        npcs: ["hotel_owner"]
        events:
          - id: "no_card"
            name: "没有房卡"
            trigger: "on_enter_without_item"
            missing_item: "room_card_4"
            text: "「没有房卡？」老板微微皱眉，但笑容没有消失。「那我给你安排一间吧。」他从柜台下面拿出一把钥匙——和一把菜刀。"
            result: "death"
        clue_on_observe: ""
        danger_level: "medium"

      room_4:
        display_name: "四号房"
        type: "main"
        outdoor: false
        description: "一间简陋但干净的房间。单人床、床头柜、一盏台灯。窗户对着后巷，能看到旅馆的后门。你刚坐下，就听到了猎枪走火的声音——从走廊方向传来。"
        first_visit_text: "床头柜的抽屉里有一本旅馆住客登记簿。最近一周的住客名字都被用墨水涂掉了，只剩下日期。每天都有人登记入住，但没有人退房。"
        connections: ["hotel_corridor"]
        searchable: false
        events:
          - id: "midnight_trigger"
            name: "宵夜时间"
            trigger: "on_observe_or_wait"
            description: "你在房间里等了一会儿。墙上的挂钟指向十二点。广播系统突然响了，传出厨师的声音：「各位客人，宵夜准备好了，请到大厅就座。」"
            auto_move_to: "lobby_midnight"
        rest_sanity: 5
        max_rest_count: 2
        danger_level: "safe"

      hotel_corridor:
        display_name: "旅馆走廊"
        type: "main"
        outdoor: false
        description: "昏暗的走廊，墙上的壁灯忽明忽灭。两侧各有几扇房门，门牌号依次排列。走廊尽头永远看不到墙壁，像是延伸到了无穷远处。"
        first_visit_text: "你经过电梯门时，里面传来「叮」一声。门开了，电梯里站着一个人，背对着你，一动不动。门关上了。你没有进去。"
        connections: ["room_2", "room_3", "room_5", "room_4"]
        searchable: false
        events:
          - id: "corridor_ghost"
            name: "电梯幽灵"
            trigger: "on_enter_repeat"
            repeat_threshold: 3
            dice_check: {attribute: "luck", difficulty: 7}
            success_text: "走廊的灯闪了一下。你加快脚步，什么也没发生。"
            failure_text: "电梯门又开了。这次里面的人转过了身——它没有脸。你狂奔回走廊尽头。"
            failure_sanity: -10
        danger_level: "medium"

      room_2:
        display_name: "二号房"
        type: "branch"
        outdoor: false
        description: "门半开着。房间角落里，一个只穿着内衣的女人蹲在行李箱前面挑选衣服。她的背影曼妙，长发垂到腰间。行李箱很大——大到可以装下一个人。"
        first_visit_text: "你看到她的影子映在墙上。影子有两个头。"
        connections: ["hotel_corridor"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "faceless_skin", qty: 2}]}
          success: {items: [{id: "faceless_skin", qty: 1}]}
          normal: {items: [{id: "bloodstained_room_card", qty: 1}]}
          failure: {text: "你靠得太近了。女人突然回头——那是一张没有脸皮的血淋淋的脸。行李箱里伸出一只手，抓住了你的脚踝——", result: "death"}
        search_attribute: "agility"
        events:
          - id: "faceless_woman"
            name: "无脸女人"
            trigger: "on_talk"
            text: "你开口想说话。女人缓缓回头——那张脸上没有皮肤，只有鲜红的肌肉和外露的牙齿。她歪着头看着你，从行李箱里抽出一把小刀。"
            result: "death"
        danger_level: "deadly"

      room_3:
        display_name: "三号房"
        type: "branch"
        outdoor: false
        description: "门开着，一个戴眼镜的男学生坐在床边，手里拿着一张全家福照片。看到你，他露出友善的笑容。「外面很危险，要不要进来坐坐？」"
        first_visit_text: "你刚才路过这间房时，隐约听到他在打电话，声音很小。你听到了几个词：哥哥、妈妈、藏尸、密室。"
        connections: ["hotel_corridor"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "bloodstained_room_card", qty: 2}]}
          success: {items: [{id: "bloodstained_room_card", qty: 1}]}
          normal: {}
          failure: {text: "学生皱起了眉头。「你在翻什么？」他站了起来，你注意到他手里不知何时多了一把水果刀。", sanity: -5}
        search_attribute: "intelligence"
        npcs: ["student"]
        clue_on_observe: "clue_4"
        observe_text: "你仔细看那张全家福。四口之家，两个男孩长得一模一样。但「哥哥」穿的衣服和眼前这个学生身上的一模一样——他说自己是弟弟。"
        events:
          - id: "student_invite"
            name: "学生邀请"
            trigger: "on_talk"
            dialogue_tree:
              - index: 0
                text: "「我虽然杀过人，但那是被迫的，我是这镇上唯一的好人。我还有个长得很像的哥哥，但我们性格不同。我内向懦弱，哥哥暴躁易怒。有次哥哥和父亲争吵，厮打中我失手刺中了哥哥...」"
              - index: 1
                text: "「母亲替我隐瞒了一切。她把所有罪推到了哥哥身上。这个小镇所有人都不干净，只有我是个例外。」他说着，手无意识地摸了摸水果刀的刀柄。"
              - index: 2
                text: "「你相信我吗？」学生看着你，眼神真挚。你注意到他的手指上有旧疤痕——不像是防御伤，更像是攻击时留下的。"
            choices:
              - id: "enter_room"
                label: "进入房间"
                text: "你走进房间。学生笑着关上了门。你再也没有出来。"
                result: "death"
              - id: "refuse"
                label: "识破谎言，离开"
                text: "你觉得这个学生在撒谎。他说自己是「内向懦弱」的弟弟，但他的疤痕和眼神都说明他就是那个暴躁的哥哥。你后退一步，离开了这里。"
                sanity_change: 0
        danger_level: "medium"

      room_5:
        display_name: "五号房"
        type: "branch"
        outdoor: false
        description: "门虚掩着，推开后看到一个穿警服的男人倒在血泊中。身上有弹孔——和刚才的枪声对上了。他的手里还攥着一个笔记本。"
        first_visit_text: "警服上的胸牌写着：「荔湾派出所·刑侦组」。他是来调查的。但他没能活着离开。"
        connections: ["hotel_corridor"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "headless_ghost_nail", qty: 1}], gold: 300}
          success: {gold: 200, items: [{id: "bloodstained_room_card", qty: 1}]}
          normal: {gold: 100}
          failure: {text: "你搜刮时发出了声响。身后传来脚步声——旅馆老板端着菜刀站在门口，笑眯眯地看着你。", sanity: -10}
        search_attribute: "luck"
        clue_on_observe: "clue_3"
        observe_text: "你翻开警察的笔记本。上面记录着：「接到匿名举报，荔湾镇旅馆涉嫌多起失踪案。嫌疑人：旅馆老板，男，45岁。独自前往调查。」最后一行字迹扭曲发抖：「枪被换了」"
        danger_level: "low"

      # ---------- 宵夜·决战 ----------
      lobby_midnight:
        display_name: "大厅·宵夜"
        type: "main"
        outdoor: false
        auto_trigger: true
        description: "大厅灯火通明。一个大胖厨师戴着厨师帽，将九块蛋糕摆在桌上。门外不断传来提头女鬼的敲门声。午夜凌晨，宵夜时间到了。房客陆续就坐——学生、无脸女人、老人、厨师、老板。"
        first_visit_text: "厨师把菜刀放在了桌上，和老板对视一眼，笑了。"
        connections: ["room_1"]
        searchable: false
        npcs: ["old_man", "chef", "hotel_owner", "student"]
        clue_on_observe: "clue_5"
        observe_text: "你偷偷瞄了一眼厨房方向。墙上贴着本周菜单。周一至周五每天一道「特色肉菜」，旁边用铅笔标注着房间号：「周一：5号，周二：3号...」你的胃翻涌了一下。"
        events:
          - id: "cake_puzzle"
            name: "蛋糕难题"
            trigger: "auto_on_enter"
            description: "厨师开口了：「各位客人，给你们出个难题——如何在只切一刀的情况下，平分这九块蛋糕？」话音刚落，老人已经伸手去拿菜刀了。"
            choices:
              - id: "sit_near_old_man"
                label: "坐在厨师和老人中间"
                text: "老人拿起菜刀，二话不说朝你砍来——你倒下去的时候才明白，只要让四个人变成三个人，就可以平分了。"
                result: "death"
              - id: "sit_between_woman_student"
                label: "坐在女人和学生中间"
                text: "老人挥刀砍向无脸女人，场面混乱，所有人厮打在一起。你被老板从背后开枪打中。"
                result: "death"
              - id: "sit_outside"
                label: "坐在桌子最外侧"
                text: "老人拿起菜刀砍向无脸女人，你退到最远处。趁着他们厮打，你偷偷打开大门，将提头女鬼放了进来。枪声、尖叫声、骨骼碎裂的声音交织在一起。你趁乱逃向一号房。"
                auto_move_to: "room_1"
        danger_level: "deadly"

      room_1:
        display_name: "一号房"
        type: "main"
        outdoor: false
        entry_from_event: true
        description: "老人的房间。墙上挂着他年轻时和一个女人的合照。你四处翻找，在抽屉里发现了一把锈迹斑斑的钥匙、很多牙齿和一本破旧的笔记本。"
        first_visit_text: "外面的惨叫声渐渐平息了。你不知道谁活了下来，也不想知道。"
        connections: ["kitchen_secret"]
        searchable: true
        loot_table:
          critical_success: {items: [{id: "human_tooth_collection", qty: 2}, {id: "old_diary", qty: 1, is_key_item: true}, {id: "teeth_key_item", qty: 1, is_key_item: true}]}
          success: {items: [{id: "human_tooth_collection", qty: 1}, {id: "old_diary", qty: 1, is_key_item: true}, {id: "teeth_key_item", qty: 1, is_key_item: true}]}
          normal: {items: [{id: "old_diary", qty: 1, is_key_item: true}]}
          failure: {text: "门外传来沉重的脚步声。满身是血的老人出现在门口——他还活着。", sanity: -10}
        search_attribute: "luck"
        clue_on_observe: "clue_6"
        observe_text: "你打开日记本。字迹从工整渐渐变得潦草。最后几页写着：「好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿好饿......」你合上了日记本。"
        events:
          - id: "read_diary"
            name: "阅读日记"
            trigger: "on_use_item"
            required_item: "old_diary"
            text: "三月一日，我丈夫疯了，他将我囚禁在厨房冰箱后面的密室里。四月二日，那个疯子拔掉了我的一颗牙齿。六月六日，他竟然想要拔掉我所有的牙齿。十一月一日，我恐怕再也吃不了肉了..."
            sanity_change: -5
            grant_clue: "clue_6"
        danger_level: "medium"

      kitchen_secret:
        display_name: "厨房密室"
        type: "main"
        outdoor: false
        description: "厨房冰箱旁有一扇暗门。推开后，密室里藏着一个四肢干瘦、肚子高高鼓起的怪物。它闭着眼睛，张大没有牙齿的嘴巴，等待着什么。冰箱上贴着四张宣传广告。"
        first_visit_text: "它曾经是一个女人。是老人的妻子。饥饿和囚禁让她变成了这副模样。"
        connections: ["town_entrance_dawn"]
        required_items: ["teeth_key_item"]
        searchable: false
        clue_on_observe: "clue_7"
        observe_text: "你仔细看冰箱上的四张广告。第一张：女人从冰箱取出大块的肉。第二张：女人在切肉。第三张：女人在清洗肉。第四张：女人将做好的蛋糕端给房客。倒过来看——她不是从冰箱「取出」肉，而是把客人「塞进」冰箱。"
        events:
          - id: "feed_teeth"
            name: "喂牙齿"
            trigger: "on_use_item"
            required_item: "teeth_key_item"
            description: "你将牙齿丢进怪物的嘴里。"
            choices:
              - id: "feed_now"
                label: "立刻喂"
                text: "怪物逐渐复苏，睁开眼睛。但门外传来脚步声——老板举着菜刀出现在密室入口。他看到苏醒的怪物，脸上的笑容终于消失了。怪物扑向老板，你趁机——但老板的猎枪对准了你。"
                result: "death"
              - id: "wait_then_feed"
                label: "等外面安静后再喂"
                text: "你等待着。外面的打斗声、惨叫声、骨骼碎裂的声音终于停了。旅馆安静下来。你将牙齿丢进怪物的嘴里——它复苏了，睁开混浊的眼睛。它闻到了提头女鬼的气息，咆哮着冲出密室。两个怪物在大厅厮杀，你趁机冲向出口。"
                auto_move_to: "town_entrance_dawn"
                grant_item: {id: "freezer_woman_flesh", qty: 1}
        danger_level: "high"

      town_entrance_dawn:
        display_name: "镇口·黎明"
        type: "main"
        outdoor: true
        description: "天色蒙蒙亮。你回头看了一眼——荔湾镇的轮廓在晨光中逐渐消散，像是从未存在过。凝固时空裂隙在你身后缓缓关闭。你的衣角沾着不属于这个时代的灰尘。"
        first_visit_text: "恭喜你在荔湾镇存活了一晚。修为恢复，但那一夜的记忆将永远刻在你的道心之中。"
        connections: []
        searchable: false
        events:
          - id: "auto_settle"
            name: "自动结算"
            trigger: "auto_on_enter"
            description: "到达黎明即触发结局结算"
        danger_level: "safe"

    # ==================== NPC配置 ====================
    npcs:
      - id: "raincoat_man"
        name: "雨衣男"
        type: "human_hostile"
        default_location: "hallway"
        can_talk: false
        can_intimidate: false
        can_execute: true
        execute_difficulty: 11
        execute_attribute: "agility"
        description: "穿着黑色雨衣的男人，看不清脸。左手小指缺了一节"
        death_loot:
          - {id: "room_card_4", qty: 1, is_key_item: true, probability: 1.0}
        dialogue: []

      - id: "factory_man"
        name: "厂服男"
        type: "human_hostile"
        default_location: "bushes"
        can_talk: false
        can_intimidate: false
        can_execute: false
        description: "穿蓝色厂服的男人，手持骨锯，动作熟练得可怕"
        dialogue: []

      - id: "hotel_owner"
        name: "旅馆老板"
        type: "human_hostile"
        default_location: "hotel_lobby"
        can_talk: true
        can_intimidate: false
        can_execute: true
        execute_difficulty: 10
        execute_attribute: "agility"
        description: "面带微笑的中年男人，笑容从不消失"
        death_loot:
          - {id: "bloodstained_room_card", qty: 3, probability: 1.0}
          - {id: "headless_ghost_nail", qty: 1, probability: 0.5}
        dialogue:
          - index: 0
            text: "「欢迎光临，住宿一晚只要一张房卡。」老板的笑容很标准，像是练习过无数次。"
          - index: 1
            text: "「我父亲年纪大了，住在一号房，请不要打扰他。」他说这话时眼神闪了一下。"
          - index: 2
            text: "「厨师的手艺很好，宵夜一定要来。他做的蛋糕...用料很实在。」老板舔了舔嘴唇。"

      - id: "student"
        name: "学生"
        type: "human_hostile"
        default_location: "room_3"
        can_talk: true
        can_intimidate: true
        intimidate_difficulty: 8
        intimidate_attribute: "attack"
        can_execute: true
        execute_difficulty: 7
        execute_attribute: "agility"
        description: "戴眼镜的男学生，手里拿着全家福照片"
        death_loot:
          - {id: "bloodstained_room_card", qty: 2, probability: 1.0}
        dialogue:
          - index: 0
            text: "「你也被困在这里了？这个镇子不太对劲。」他推了推眼镜，看起来很无辜。"
          - index: 1
            text: "「我哥哥以前也住在这个镇上。他...出了点事。」学生低下头，但你注意到他的嘴角微微上翘。"

      - id: "old_man"
        name: "老人"
        type: "human_hostile"
        default_location: "lobby_midnight"
        can_talk: true
        can_intimidate: true
        intimidate_difficulty: 9
        intimidate_attribute: "attack"
        can_execute: true
        execute_difficulty: 9
        execute_attribute: "agility"
        description: "沉默寡言的老人，手指上满是旧伤疤"
        death_loot:
          - {id: "human_tooth_collection", qty: 1, probability: 1.0}
        dialogue:
          - index: 0
            text: "老人看了你一眼，没有说话。他的手在桌子下面攥着什么东西。"
          - index: 1
            text: "「...我妻子...」老人喃喃自语，「她...还在等我...」他的目光移向厨房方向。"

      - id: "chef"
        name: "厨师"
        type: "human_hostile"
        default_location: "lobby_midnight"
        can_talk: true
        can_intimidate: false
        can_execute: true
        execute_difficulty: 9
        execute_attribute: "agility"
        description: "大胖厨师，戴着厨师帽，围裙上有可疑的暗色污渍"
        death_loot:
          - {id: "bloodstained_room_card", qty: 2, probability: 1.0}
        dialogue:
          - index: 0
            text: "「今晚的宵夜是特制蛋糕！」厨师拍拍手上的面粉，「用的都是最新鲜的...原材料。」"
          - index: 1
            text: "「你知道做蛋糕最重要的是什么吗？」厨师凑近你的耳朵，「是原材料的新鲜程度。最好是...还有体温的那种。」"

    # ==================== 线索配置 ====================
    clues:
      - id: "clue_1"
        name: "雨衣男的身份"
        obtain_method: "observe"
        obtain_scene: "home"
        description: "继父左手小指缺了一节——和电梯里那个雨衣男一模一样。继父身上有两处刀伤，但现场只有一把刀"
        reveal: "雨衣男和继父之间有某种关联"

      - id: "clue_2"
        name: "房卡上的字"
        obtain_method: "auto"
        obtain_trigger: "get_room_card_4"
        description: "房卡背面有指甲刮出的痕迹，拼出一个字：「逃」。这不像是房卡出厂时就有的"
        reveal: "上一个住客留下的警告——他没能逃出去"

      - id: "clue_3"
        name: "警察的遗物"
        obtain_method: "observe"
        obtain_scene: "room_5"
        description: "警察笔记本：「接到匿名举报，旅馆涉嫌多起失踪案。嫌疑人：旅馆老板。」最后一行：「枪被换了」"
        reveal: "老板提前知道警察要来，把猎枪的子弹方向换了"

      - id: "clue_4"
        name: "学生的全家福"
        obtain_method: "observe"
        obtain_scene: "room_3"
        description: "全家福里两个男孩长得一模一样。但「哥哥」穿的衣服和眼前这个学生身上的一模一样——他说自己是弟弟"
        reveal: "他就是那个暴躁的哥哥。弟弟才是被杀的那个"

      - id: "clue_5"
        name: "厨师的菜单"
        obtain_method: "observe"
        obtain_scene: "lobby_midnight"
        description: "本周菜单，每天一道「特色肉菜」，旁边用铅笔标注着房间号"
        reveal: "厨师用的「肉」来自住客"

      - id: "clue_6"
        name: "老人妻子的日记"
        obtain_method: "search_or_use"
        obtain_scene: "room_1"
        description: "记录了被囚禁、拔牙、饥饿的全过程。最后只剩下无数个「好饿」"
        reveal: "老人把妻子关在密室里，妻子最终被饥饿和绝望变成了怪物"

