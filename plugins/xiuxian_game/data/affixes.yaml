# 装备词缀配置
# T1: 数值型词缀 — 所有稀有度装备可出现，提供战斗属性固定百分比加成
# T2: 触发型词缀 — 仅蓝色及以上装备可出现，提供概率触发的战斗效果

# 词缀数量规则（按装备稀有度）
affix_count_rules:
  white:  {min: 0, max: 1, bonus_chance: 0.5}   # 50%概率带1条
  green:  {min: 1, max: 2, bonus_chance: 0.5}   # 50%概率2条
  blue:   {min: 2, max: 3, bonus_chance: 0.5}   # 50%概率3条
  purple: {min: 3, max: 4, bonus_chance: 0.5}   # 50%概率4条
  orange: {min: 4, max: 4, bonus_chance: 1.0}   # 必定4条

affixes:
  t1:
    - affix_id: "critical_rate"
      name: "锐利"
      description: "暴击率+{value}%"
      attribute: "critical_rate"
      ranges:
        white: [1.0, 2.0]
        green: [2.0, 4.0]
        blue: [3.0, 6.0]
        purple: [5.0, 8.0]
        orange: [7.0, 10.0]

    - affix_id: "combo_rate"
      name: "连斩"
      description: "连击率+{value}%"
      attribute: "combo_rate"
      ranges:
        white: [0.5, 1.5]
        green: [1.0, 3.0]
        blue: [2.0, 4.5]
        purple: [3.5, 6.0]
        orange: [5.0, 8.0]

    - affix_id: "dodge_rate"
      name: "灵巧"
      description: "闪避率+{value}%"
      attribute: "dodge_rate"
      ranges:
        white: [1.0, 2.0]
        green: [2.0, 4.0]
        blue: [3.0, 6.0]
        purple: [5.0, 8.0]
        orange: [7.0, 10.0]

    - affix_id: "counter_rate"
      name: "反击"
      description: "反击率+{value}%"
      attribute: "counter_rate"
      ranges:
        white: [0.5, 1.5]
        green: [1.0, 3.0]
        blue: [2.0, 5.0]
        purple: [4.0, 7.0]
        orange: [6.0, 9.0]

    - affix_id: "penetration_rate"
      name: "穿刺"
      description: "穿透率+{value}%"
      attribute: "penetration_rate"
      ranges:
        white: [0.5, 1.5]
        green: [1.0, 3.0]
        blue: [2.0, 5.0]
        purple: [4.0, 7.0]
        orange: [6.0, 10.0]

    - affix_id: "anti_crit_rate"
      name: "坚韧"
      description: "抗暴率+{value}%"
      attribute: "anti_crit_rate"
      ranges:
        white: [1.0, 2.0]
        green: [2.0, 4.0]
        blue: [3.0, 6.0]
        purple: [5.0, 8.0]
        orange: [7.0, 10.0]

    - affix_id: "lifesteal_rate"
      name: "嗜血"
      description: "吸血率+{value}%"
      attribute: "lifesteal_rate"
      ranges:
        white: [0.3, 0.8]
        green: [0.5, 1.5]
        blue: [1.0, 2.5]
        purple: [2.0, 4.0]
        orange: [3.0, 5.0]

    - affix_id: "accuracy_rate"
      name: "精准"
      description: "命中率+{value}%"
      attribute: "accuracy_rate"
      ranges:
        white: [1.0, 2.0]
        green: [2.0, 4.0]
        blue: [3.0, 6.0]
        purple: [5.0, 8.0]
        orange: [7.0, 10.0]

    - affix_id: "critical_power"
      name: "暴力"
      description: "暴击伤害+{value}"
      attribute: "critical_power"
      ranges:
        white: [1, 2]
        green: [2, 4]
        blue: [3, 6]
        purple: [5, 8]
        orange: [7, 10]

    - affix_id: "skill_crit_rate"
      name: "灵爆"
      description: "灵爆率+{value}%"
      attribute: "skill_crit_rate"
      ranges:
        white: [0.5, 1.5]
        green: [1.0, 3.0]
        blue: [2.0, 4.5]
        purple: [3.5, 6.0]
        orange: [5.0, 8.0]

    - affix_id: "immobilize_rate"
      name: "禁锢"
      description: "命中时+{value}%概率使敌人恐惧1回合"
      attribute: "immobilize_rate"
      ranges:
        white: [0.3, 0.8]
        green: [0.5, 1.5]
        blue: [1.0, 2.5]
        purple: [2.0, 3.5]
        orange: [3.0, 5.0]

    - affix_id: "regen_rate"
      name: "回春"
      description: "回复率+{value}%"
      attribute: "regen_rate"
      ranges:
        white: [0.3, 0.8]
        green: [0.5, 1.5]
        blue: [1.0, 2.5]
        purple: [2.0, 4.0]
        orange: [3.0, 5.0]

    # 以下5个T1词缀暂未接入战斗属性系统，等待后续版本实现后恢复：
    # first_strike_rate(先手), tenacity(韧性), mp_cost_reduction(节能),
    # ignore_defense(破甲), block_reduction(格挡)

    - affix_id: "skill_crit_boost"
      name: "灵威"
      description: "技能暴击率+{value}%"
      attribute: "skill_crit_rate"
      ranges:
        white: [0.5, 1.0]
        green: [1.0, 2.0]
        blue: [1.5, 3.5]
        purple: [3.0, 5.0]
        orange: [4.5, 7.0]

    - affix_id: "true_damage_rate"
      name: "真伤"
      description: "真实伤害率+{value}%"
      attribute: "true_damage_rate"
      ranges:
        white: [0.3, 0.8]
        green: [0.5, 1.5]
        blue: [1.0, 2.5]
        purple: [2.0, 3.5]
        orange: [3.0, 5.0]

  t2:
    - affix_id: "fear_strike"
      name: "恐惧之力"
      description: "攻击时{value}%概率使敌人恐惧{value2}回合"
      trigger: "on_attack"
      effect: "fear"
      chance_ranges:
        blue: [5, 8]
        purple: [8, 12]
        orange: [12, 15]
      duration_ranges:
        blue: [1, 1]
        purple: [1, 1]
        orange: [1, 2]

    - affix_id: "defense_pierce"
