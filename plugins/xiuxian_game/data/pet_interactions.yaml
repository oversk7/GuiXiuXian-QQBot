# ====================================================================
# 宠物互动文案与事件库
# ====================================================================
# 4 种互动动作各有独立基线、独立文案池：
#   - pat (摸摸)：偏好感
#   - headpat (摸头)：偏心情
#   - play (玩耍)：偏经验（消耗饱食）
#   - hug (抱抱)：偏亲密（好感+心情）
#
# 文案原则：白描、极简、不写心理戏、不预设具体身体部位（毛/耳/尾/爪等），
# 让冥犬、诡猫、鬼隼、噩梦狼、虚空蟒都不出戏。
# 化形后专属文案放 require_transformed: true，可以用人形细节。
#
# 每次互动按概率挑一条文案：
#   - normal: 默认基线效果
#   - special: 数值有 modifier 修正
#   - surprise: 掉落小奖励
# ====================================================================

# 4 种动作的基线效果
baselines:
  pat:           # 摸摸 - 偏好感
    affection: 5
    mood: 3
    exp: 2
    hunger_cost: 0
  headpat:       # 摸头 - 偏心情
    affection: 2
    mood: 8
    exp: 2
    hunger_cost: 0
  play:          # 玩耍 - 偏经验，消耗饱食
    affection: 3
    mood: 5
    exp: 10
    hunger_cost: 5
  hug:           # 抱抱 - 偏亲密
    affection: 7
    mood: 6
    exp: 1
    hunger_cost: 0

# 状态调味系数
state_modifiers:
  starving_hunger: 20
  starving_multiplier: 0.5
  grumpy_mood: 30
  intimate_affection: 500

weights:
  normal: 70
  special: 22
  surprise: 8

# 惊喜奖励池
surprise_rewards:
  - { name: "金币", item_id: "_gold", min_qty: 8, max_qty: 30, weight: 40 }
  - { name: "怨念", item_id: "_resentment", min_qty: 5, max_qty: 20, weight: 30 }
  - { name: "回春散", item_id: "heal_potion", min_qty: 1, max_qty: 1, weight: 15 }
  - { name: "凝神草", item_id: "spirit_herb", min_qty: 1, max_qty: 10, weight: 10 }
  - { name: "阴冥草", item_id: "yin_grass", min_qty: 1, max_qty: 5, weight: 5 }

# ────────────────────────────────────
# 摸摸
# ────────────────────────────────────
pat:
  normal:
    - text: "你伸手碰了碰{nickname}，它没动。"
    - text: "{nickname}凑过来让你摸。"
    - text: "你摸了摸{nickname}，它发出一声低低的回应。"
    - text: "{nickname}在你身边停了下来。"
    - text: "你的手刚碰上，{nickname}就往你这边挪了挪。"
    - text: "{nickname}安静地接受了你的触碰。"
    - text: "你摸了一下，{nickname}抬眼看了看你。"
  special:
    - text: "{nickname}主动往你手里凑了一下。"
      condition: { affection_min: 200 }
      modifier: { affection: 3, mood: 2 }
    - text: "{nickname}慢吞吞地接受了你的触碰。"
      condition: { mood_max: 50 }
      modifier: { affection: 1, mood: 1 }
    - text: "{nickname}发出一声满意的低鸣。"
      condition: { mood_min: 60 }
      modifier: { mood: 3 }
    - text: "{nickname}盯着你看了很久，然后才让你碰。"
      modifier: { affection: 1 }
    - text: "{display}在你伸手时安静了下来，没说话。"
      condition: { require_transformed: true, affection_min: 300 }
      modifier: { affection: 4, mood: 3 }
    - text: "{nickname}没有躲，但你也感觉不到它的反应。"
      condition: { affection_max: 100 }
      modifier: { affection: 0, mood: 0 }
  surprise:
    - text: "{nickname}叼来一样东西放在你脚边。"
    - text: "{nickname}从一旁推出一个小布袋。"
    - text: "你摸过去时，{nickname}吐出了藏着的东西。"

# ────────────────────────────────────
# 摸头
# ────────────────────────────────────
headpat:
  normal:
    - text: "你按了按{nickname}的头顶，它没反抗。"
    - text: "{nickname}低下头，让你的手停在那里。"
    - text: "你的手覆在{nickname}头上，它一动不动。"
    - text: "{nickname}发出一声短促的鼻息。"
    - text: "你拍了两下，{nickname}才慢慢抬起头。"
    - text: "{nickname}闭上眼，让你按了一会。"
  special:
    - text: "{nickname}主动顶了顶你的手，像在要你继续。"
      condition: { mood_min: 60 }
      modifier: { mood: 4, affection: 2 }
    - text: "{nickname}没等你收手，就钻开了。"
      modifier: { mood: 1 }
    - text: "{nickname}打了个长长的哈欠。"
      modifier: { mood: 2 }
    - text: "{nickname}稳稳地立着，没回头。"
      condition: { affection_min: 300 }
      modifier: { mood: 3, affection: 2 }
    - text: "{display}低着头没看你，沉默了一会才动。"
      condition: { require_transformed: true, affection_min: 300 }
      modifier: { mood: 5, affection: 3 }
    - text: "{nickname}还不太熟悉你，但没躲开。"
      condition: { affection_max: 100 }
      modifier: { affection: 1, mood: 0 }
  surprise:
    - text: "{nickname}从藏处推出一样东西到你面前。"
    - text: "你的手挪开时，发现{nickname}悄悄塞了点什么过来。"

# ────────────────────────────────────
# 玩耍
# ────────────────────────────────────
play:
  normal:
    - text: "你和{nickname}打闹了一会，它累得停下来。"
    - text: "{nickname}追着你扔出的东西跑了一圈。"
    - text: "你逗了{nickname}一会，它玩得很尽兴。"
    - text: "{nickname}和你你来我往地折腾了半天。"
    - text: "你设的小机关{nickname}很快就解开了。"
    - text: "{nickname}凑过来要和你接着玩。"
  special:
    - text: "{nickname}玩得太用力，把屋角撞翻了一样东西。"
      modifier: { exp: 4, mood: 3, affection: -1 }
    - text: "你和{nickname}配合得很默契，玩出了点新花样。"
      condition: { affection_min: 300 }
      modifier: { exp: 5, mood: 3, affection: 2 }
    - text: "{nickname}玩到一半就趴下了，喘得很厉害。"
      condition: { hunger_max: 50 }
      modifier: { exp: -2, mood: -1 }
    - text: "{nickname}主动来找你玩。"
      condition: { mood_min: 60 }
      modifier: { exp: 3, mood: 4, affection: 2 }
    - text: "{display}和你玩了一会就停下，扫了扫衣摆。"
      condition: { require_transformed: true }
      modifier: { exp: 4, mood: 3, affection: 2 }
  surprise:
    - text: "玩耍时{nickname}从角落叼出一个旧物。"
    - text: "{nickname}撞翻了什么东西，掉出几样小玩意。"
    - text: "{nickname}从藏点刨出一包东西，推到你面前。"

# ────────────────────────────────────
# 抱抱
# ────────────────────────────────────
hug:
  normal:
    - text: "你抱住{nickname}，它没挣开。"
    - text: "{nickname}让你抱了一会，然后自己退开了。"
    - text: "你揽过{nickname}，它在你怀里安静下来。"
    - text: "{nickname}在你身边贴了一会。"
    - text: "你抱了一下，{nickname}没出声。"
  special:
    - text: "{nickname}在你怀里待了很久，没有动。"
      condition: { mood_min: 60 }
      modifier: { mood: 4, affection: 3 }
    - text: "{nickname}被抱住时愣了一下，没躲开。"
      condition: { affection_max: 200 }
      modifier: { affection: 1, mood: 1 }
    - text: "{nickname}靠了过来，像是不打算离开。"
      condition: { affection_min: 400 }
      modifier: { affection: 4, mood: 3 }
    - text: "{display}没有看你，但也没有推开你。"
      condition: { require_transformed: true, affection_min: 300 }
      modifier: { affection: 5, mood: 4 }
    - text: "你抱着{nickname}的时候，它发出了一声很轻的回应。"
      condition: { affection_min: 500 }
      modifier: { affection: 4, mood: 4, exp: 2 }
  surprise:
    - text: "{nickname}从藏处把一样东西塞到你手里。"
    - text: "松开时你发现{nickname}留了点东西给你。"

# ────────────────────────────────────
# 状态触发文案
# ────────────────────────────────────
states:
  starving:
    text: "{nickname}没什么力气，对你的动作反应慢了一拍。"
    suggest: "饿了，先去【喂食】补一下"
  grumpy:
    text: "{nickname}今天有些蔫，但还是配合了你。"
    suggest: "心情低落，多陪陪它或喂点好东西"
