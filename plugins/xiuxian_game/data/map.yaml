      - "诡修亡魂"
      - "伥鬼"
    # 商人特产材料（高价值）
    merchant_materials:
      - "wanted_poster"    # 紫色特产
    # 材料格子只掉落基础材料
    basic_materials:
      - "grave_soil"       # 墓土
      - "bone_fragment"    # 骨片
      - "rotten_core"      # 腐坏的内丹
