# 无限重诡域诡域系统配置
# 每重诡域都是独立的10x10小地图，坐标范围-5到5
# 支持无限重扩展，适应等级无上限的玩家（300+级）
# 诡异等级逐重增长，需要逐重解锁

# 动态诡域生成规则
dungeon_generation_rules:
  # 基础配置
  base_mp_cost: 1                    # 基础理智消耗
  mp_cost_increment: 0.1             # 每重理智消耗增量（每10重+1）

  # 诡异等级计算规则
  monster_level_formula: "level * 5"  # 诡异等级 = 诡域深度 * 5
  monster_level_variance: 2           # 诡异等级随机波动范围

  # 诡异名称池（随机选择）
  monster_names:
    # 低阶诡异（1-20重）
    - "敲门的孩子"
    - "楼梯间的脚步声"
    - "镜中人"
    - "床底的呼吸"
    - "午夜电话"
    - "红衣女子"
    - "无头新娘"
    - "哭泣的娃娃"
    - "倒吊的影子"
    - "窗外的眼睛"
    - "走廊尽头的身影"
    - "消失的第13层"
    - "会动的照片"
    - "深夜敲窗声"

    # 伊藤润二风格诡异
    - "螺旋状的伤疤"
    - "无限延伸的脖子"
    - "密密麻麻的小孔"
    - "扭曲成麻花的身体"
    - "长满眼球的皮肤"
    - "倒立行走的人"
    - "拉长的笑容"
    - "钻进墙缝的女人"
    - "变成鱼的恋人"
    - "长出触手的头发"
    - "融化的面孔"
    - "分裂成两半的人"
    - "爬行的断头"
    - "蠕动的肉块"
    - "倒置的五官"
    - "无数张嘴的脸"
    - "螺旋形的眼珠"
    - "拉伸的四肢"
    - "内脏外露的躯体"
    - "变形的骨骼"
    - "蜘蛛腿的人类"
    - "黑洞般的瞳孔"
    - "扭曲的时空"
    - "重复的噩梦"
    - "无法愈合的伤口"
    - "永远流血的眼泪"
    - "倒长的指甲"
    - "蠕虫状的舌头"
    - "破碎的镜像自我"
    - "无限循环的走廊"

  # 材料配置（按诡域深度范围）
  material_tiers:
    1-20:     # 1-20重诡域
      merchant_materials: ["wanted_poster", "drowned_scale"]
      basic_materials: ["grave_soil", "bone_fragment", "rotten_core"]
    21-50:    # 21-50重诡域
      merchant_materials: ["medical_record", "corrupted_bandage"]
      basic_materials: ["ash_powder", "ghost_tears", "cursed_silk"]
    51-100:   # 51-100重诡域
      merchant_materials: ["soul_crystal", "cursed_mirror_shard"]
      basic_materials: ["iron_rust", "spirit_bone", "yin_essence"]
    101-200:  # 101-200重诡域
      merchant_materials: ["demon_heart", "world_fragment"]
      basic_materials: ["phantom_thread", "flesh_crystal", "nightmare_silk"]
    201-999:  # 201重以上诡域
      merchant_materials: ["god_tear", "void_essence"]
      basic_materials: ["spirit_stone", "strange_stone", "time_dust"]

# 保留原有regions配置以兼容现有代码，但标记为废弃
# 新系统将逐步迁移到dungeon_levels
regions:
  大都会:
    level_range: [1, 1]
    required_level: 1
    tier: 0
    mp_cost: 0
    monsters: []
    merchant_materials: []
    basic_materials: []