# 无限重诡域里世界系统配置
# 每重诡域都是独立的10x10小地图，坐标范围-5到5
# 支持无限重扩展，适应等级无上限的玩家（300+级）
# 怪物等级逐重增长，需要逐重解锁

# 动态里世界生成规则
dungeon_generation_rules:
  # 基础配置
  base_mp_cost: 1                    # 基础理智消耗
  mp_cost_increment: 0.1             # 每重理智消耗增量（每10重+1）

  # 怪物等级计算规则
  monster_level_formula: "level * 5"  # 怪物等级 = 里世界深度 * 5
  monster_level_variance: 2           # 怪物等级随机波动范围

  # 怪物名称池（随机选择）
  monster_names:
    - "诡修亡魂"
    - "伥鬼"
    - "水鬼"
    - "碎颅医生"
    - "无脸护士"
    - "笑面狗"
    - "血色触手"
    - "深渊守卫"
    - "噬魂蛛"
    - "虚空行者"
    - "梦魇使者"
    - "腐朽巨人"
    - "影子刺客"
    - "骨龙"
    - "恶魔领主"
    - "上古邪神"
    - "混沌之子"
    - "虚无吞噬者"
    - "时空裂隙"
    - "终极毁灭者"
    - "永恒守护者"
    - "无名恐惧"
    - "深渊霸主"
    - "末日使徒"
    - "禁忌存在"

  # 材料配置（按里世界深度范围）
  material_tiers:
    1-20:     # 1-20重里世界
      merchant_materials: ["wanted_poster", "drowned_scale"]
      basic_materials: ["grave_soil", "bone_fragment", "rotten_core"]
    21-50:    # 21-50重里世界
      merchant_materials: ["medical_record", "bloody_bandage"]
      basic_materials: ["ash_powder", "ghost_tears", "corrupted_essence"]
    51-100:   # 51-100重里世界
      merchant_materials: ["void_crystal", "nightmare_core"]
      basic_materials: ["shadow_dust", "void_fragment", "spirit_bone"]
    101-200:  # 101-200重里世界
      merchant_materials: ["demon_heart", "world_fragment"]
      basic_materials: ["cursed_silk", "iron_rust", "time_dust"]
    201-999:  # 201重以上里世界
      merchant_materials: ["god_tear", "chaos_essence"]
      basic_materials: ["divine_fragment", "eternal_dust", "void_essence"]

# 保留原有regions配置以兼容现有代码，但标记为废弃
# 新系统将逐步迁移到dungeon_levels
regions:
  大都会:
    level_range: [1, 1]
    required_level: 1
    tier: 0
    mp_cost: 0
    monsters: []
    merchant_materials: []
    basic_materials: []