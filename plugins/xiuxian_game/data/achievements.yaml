    condition_type: "equipment_obtained"
    condition_target: "any_equipment"
    condition_value: 1
    rewards:
      gold: 1500
      exp: 400
    flavor_text: "工欲善其事，必先利其器。"
    hidden: false

  # 5. 财富系列
  small_fortune:
    id: "small_fortune"
