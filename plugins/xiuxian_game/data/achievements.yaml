# 微成就系统配置文件
# 定义10个基础微成就，帮助新手获得成就感和引导

basic_achievements:
  # 1. 修炼系列
  first_cultivation:
    id: "first_cultivation"
    title: "初窥门径"
    description: "完成第一次修炼，开始感知体内怨炁的流动"
    icon: "🌟"
    condition_type: "command_count"
    condition_target: "修炼"
    condition_value: 1
    rewards:
      gold: 500
      exp: 100
    flavor_text: "千里之行，始于足下。驭鬼之路，从此开启。"
    hidden: false

  cultivation_adept:
    id: "cultivation_adept"
    title: "勤修不辍"
    description: "累计修炼10次，逐渐掌握怨炁运行的诀窍"
    icon: "✨"
    condition_type: "command_count"
    condition_target: "修炼"
    condition_value: 10
    rewards:
      gold: 2000
      exp: 500
    flavor_text: "修行无捷径，唯勤能补拙。"
    hidden: false

  # 2. 成长系列
  first_breakthrough:
    id: "first_breakthrough"
    title: "破茧成蝶"
    description: "突破至2级境界，体验蜕变带来的力量提升"
    icon: "🦋"
    condition_type: "level_up"
    condition_target: "level"
    condition_value: 2
    rewards:
      gold: 1000
      exp: 300
      attribute_points: 5
    flavor_text: "破茧之痛，化蝶之美。境界突破，实力飞跃。"
    hidden: false

  level_ten_warrior:
    id: "level_ten_warrior"
    title: "十级驭鬼者"
    description: "达到10级，正式踏入驭鬼者的行列"
    icon: "⚔️"
    condition_type: "level_reached"
    condition_target: "level"
    condition_value: 10
    rewards:
      gold: 5000
      exp: 1000
      attribute_points: 10
    flavor_text: "十级之境，已非凡人。驭鬼之道，渐入佳境。"
    hidden: false

  # 3. 战斗系列
  first_victory:
    id: "first_victory"
    title: "初战告捷"
    description: "取得第一场战斗的胜利，品尝胜利的滋味"
    icon: "🏆"
    condition_type: "battle_win"
    condition_target: "total_wins"
    condition_value: 1
    rewards:
      gold: 1000
      exp: 300
    flavor_text: "首胜之战，意义非凡。"
    hidden: false

  veteran_fighter:
    id: "veteran_fighter"
    title: "初入战场"
    description: "击败10个敌人，开始积累实战经验"
    icon: "🛡️"
    condition_type: "kill_count"
    condition_target: "total_kills"
    condition_value: 10
    rewards:
      gold: 3000
      exp: 800
    flavor_text: "十场战斗，初窥战场之残酷。"
    hidden: false

  # 4. 装备系列
  first_equipment:
    id: "first_equipment"
