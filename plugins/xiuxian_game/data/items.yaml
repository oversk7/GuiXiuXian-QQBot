items:
  consumables:  # 消耗品类
    - item_id: "teleport"
      name: "传送符"
      description: "传送到指定地点"
      type: "CONSUMABLE"
      effect_type: "TELEPORT"
      price: 100

    - item_id: "heal_potion"
      name: "回春散"
      description: "恢复少量生命值（+40HP）"
      type: "CONSUMABLE"
      effect_type: "RESTORE_HP"
      effect_params: {"value": 40}
      price: 100

    - item_id: "spirit_herb"
      name: "凝神草"
      description: "恢复少量理智值（+40MP）"
      type: "CONSUMABLE"
      effect_type: "RESTORE_MP"
      effect_params: {"value": 40}
      price: 100

    - item_id: "blood_pact"
      name: "血契丹"
      description: "以精血为引的丹药，恢复生命值（+100HP）"
      type: "CONSUMABLE"
      effect_type: "RESTORE_HP"
      effect_params: {"value": 100}
      price: 400
     
    - item_id: "yin_grass"
      name: "阴冥草"
      description: "生长在极阴之地的药草，服用后恢复理智值（+100MP）"
      type: "CONSUMABLE"
      effect_type: "RESTORE_MP"
      effect_params: {"value": 100}
      price: 400
      
    - item_id: "revive_potion"
      name: "还魂丹"
      description: "使用后可以立即原地复活。（复活率100%）"
      type: "CONSUMABLE"
      effect_type: "REVIVE"
      effect_params: {"rate": 1.0}
      price: 1000

    - item_id: "rename_card"
      name: "改名卡"
      description: "可修改一次角色名称 ✍️  使用方法：/改名 新名字"
      type: "CONSUMABLE"
      effect_type: "CHANGE_NAME"
      price: 500
    
    - item_id: "president_letter"
      name: "会长委任书"
      description: "当我走在黑夜当中，那我就是这座城市最恐怖的怪谈。"
      type: "CONSUMABLE"
      effect_type: "APPOINT_PRESIDENT"
      price: 100000

  materials:  # 材料类
    - item_id: "rotten_core"
      name: "腐坏的内丹"
      description: "从腐尸体内取出的浑浊内丹，散发着腐臭气息 🦠"
      type: "MATERIAL"
      price: 20
      grudge_value: 5

    - item_id: "ghost_tears"
      name: "鬼泪"
      description: "厉鬼哭泣时凝结的冰晶，触之刺骨 ❄️"
      type: "MATERIAL"
      price: 20
      grudge_value: 8

    - item_id: "cursed_silk"
      name: "诅咒丝线"
      description: "沾染怨念的红色丝线，隐约能听到哀嚎声 🧵"
      type: "MATERIAL"
      price: 20
      grudge_value: 10

    - item_id: "spirit_bone"
      name: "灵骨"
      description: "蕴含微弱灵力的兽骨，可用于炼制法器 💀"
      type: "MATERIAL"
      price: 50

    - item_id: "yin_essence"
      name: "阴煞精华"
      description: "极阴之地凝聚的黑色结晶，表面泛着幽光 🔮"
      type: "MATERIAL"
      price: 150
      grudge_value: 12

    - item_id: "nightmare_silk"
      name: "梦魇丝线"
      description: "从梦境中提取的透明丝线，触碰时会浮现幻象 🕸️"
      type: "MATERIAL"
      price: 300
      grudge_value: 15

    - item_id: "flesh_crystal"
      name: "血肉结晶"
      description: "不断搏动的红色晶石，内部似有生命在孕育 ❤️"
      type: "MATERIAL"
      price: 400
      grudge_value: 20
    
    - item_id: "wanted_poster"
      name: "寻人启事"
      description: "我每天都在寻找那个被自己杀死的人，我将她杀死了一遍又一遍，可她似乎总能找到我。每当天亮，我睁开双眼的时候，她的东西总会出现在我的床上。我明明把她砌进了墙里，可她却好像钻进了我的心里……"
      type: "MATERIAL"
      price: 5
      grudge_value: 100

    - item_id: "medical_record"
      name: "病例单"
      description: "我不明白自己为什么会变成这个样子，我那么认真的去迎合，明明只是想做个人而已。"
      type: "MATERIAL"
      price: 5
      grudge_value: 100

    # ---- 东岗水库特产 ----
    - item_id: "drowned_scale"
      name: "溺水者"
      description: "姐姐把石头绑在了我的腿上，身体在下沉，我看见水库里面有很多黑乎乎的水草"
      type: "MATERIAL"
      price: 220
      grudge_value: 8

  equipment:
    - item_id: "swim_coat"
      name: "溺水者外衣"
      description: "水下有东西，它们慢慢爬进了我的衣服，将我拖入深水当中。"
      type: "EQUIPMENT"
      price: 1000
      durability: 100
      attr_bonus: {"hp": 10}
      attr_ratio: {"hp": 0.2}
      recipe:
        materials:
          drowned_scale: 10
          cursed_silk: 5
          flesh_crystal: 3
        gold: 1500
      repair_cost: 10      # 可选：每 1 点耐久 10 金币

    - item_id: "self_awareness_key"
      name: "自知力钥匙"
      description: "精神病人大多存在不同程度的自知力缺陷，他们无法察觉自己精神状态的改变，对精神状态丧失判断，否认病情，拒绝治疗。当你出现类似的症状时，这把钥匙可以帮你一次。"
      type: "EQUIPMENT"
      price: 1000
      durability: 100
      attr_bonus: {"mp": 10}
      attr_ratio: {"mp": 0.1}
      recipe:
        materials:
          spirit_bone: 10
          flesh_crystal: 3
        gold: 1000
      repair_cost: 10

    # 不可锻造
    - item_id: "lucky_scissors"
      name: "幸运剪刀"
      description: "这把血迹斑斑的剪刀和幸运完全沾不上边，可它就是被命名为幸运。（开膛手套装）"
      type: "EQUIPMENT"
      price: 800
      durability: 100
      attr_bonus: {"luck": 10}
      attr_ratio: {"luck": 0.5}
      repair_cost: 8   # 不可锻造

    - item_id: "black_envelope"
      name: "黑色信封"
      description: "开膛手曾留下署名，将死者的器官装入信封，寄送给当地的报社。（开膛手套装）"
      type: "EQUIPMENT"
      price: 1000
      durability: 100
      attr_ratio: {"attack": 0.5}

    - item_id: "fog_coat"
      name: "雾都风衣"
      description: "这件风衣可以遮住你的面容，隐藏你的体型，掩盖你犯下的所有罪行。（开膛手套装）"
      type: "EQUIPMENT"
      price: 1000
      durability: 100
      attr_ratio: {"agility": 0.5}

      
