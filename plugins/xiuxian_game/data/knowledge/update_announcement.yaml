body: |
  📅 2026-07-07 · 诡域探索焕新
  ━━━━━━━━━━━━━
  **🎮 新玩法**
  • 无伤连杀：不死不休，每满5杀返还理智；死亡或返回现实即中断
  • 精英感知：进层即感知本重潜伏几股"强烈的恶意"，精英掉装备与铭文
  • 十重一境：湿雾巷、回音病房、无人婚宴…每10重一个境地，越深越不对劲
  ━━━━━━━━━━━━━
  **📜 体验优化**
  • 战报改版：经验、战利品、连杀一眼看清，不用再翻战斗日志
  • 诡域文案全线重写，同一个格子，每天讲不一样的故事
  • 理智归零不再无声无息——你会亲眼看着自己疯掉
  ━━━━━━━━━━━━━
  **🔧 修复**
  • 二区玩家传送/换层时格子错乱
  • 扫荡中疯狂身亡却"没死透"
  ━━━━━━━━━━━━━
  🕯️ 理智是你在诡域唯一的灯。【传送 1层诡域】 灯亮着的时候，多走几步。
