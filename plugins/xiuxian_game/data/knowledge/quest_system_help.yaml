body: |
  大都会缉邪司每日颁发退邪委托，以恶鬼身，行菩萨事
  ━━━━━━━━━━━━━
  **📋 指令**
  【每日委托】 今日委托，与 每日任务 同义；需30级开放
  【接取委托 编号】 | 【完成委托】 需击杀目标后在目标位置提交
  【刷新委托】 追加一个新委托（今日总数上限3个） | 【委托统计】
  ━━━━━━━━━━━━━
  **🏛️ 流程**
  【每日委托】 → 【接取委托 编号】 → 导航至任务坐标
  → 【观察】 找到鬼怪 → 【攻击 鬼怪名字】 → 【完成委托】
  ━━━━━━━━━━━━━
  **📖 规则**
  • 奖励：经验、金币、公会积分与经验
  • 类型：鬼怪消除、笔仙案件、邪修蛊惑等
  • 可与其他玩家合作击杀；每日至多接3个，次日过期
  • 重名NPC自动优先匹配你的任务目标，不会误伤他人委托
  ━━━━━━━━━━━━━
  > 【帮助】 返回
