body: |
  ✨ 委托系统帮助 ✨
  大都会缉邪司每日颁发退邪委托，以恶鬼身，行菩萨事
  ━━━━━━━━━━━━━
  📋 基础功能：
  【每日委托】 查看今日所有委托详情
  【接取委托 <编号>】 接取指定委托
  【完成委托】 在目标位置完成委托
  【刷新委托】 生成新委托（每日最多3个）
  【委托统计】 查看完成统计
  ━━━━━━━━━━━━━
  🏛️ 任务流程：
  1️⃣ 【每日委托】查看委托
  2️⃣ 【接取委托 编号】接取任务
  3️⃣ 导航到任务坐标位置
  4️⃣ 【观察】查看鬼怪NPC
  5️⃣ 【攻击 鬼怪名字】击杀目标
  6️⃣ 【完成委托】领取奖励
  ━━━━━━━━━━━━━
  💰 奖励：经验、金币、公会积分和经验
  🎭 任务类型：鬼怪消除、笔仙案件、邪修蛊惑等
  👻 可与其他玩家合作击杀鬼怪
  📅 每日最多接取3个委托，次日过期
  ━━━━━━━━━━━━━
  🎯 智能匹配（已优化）：
  • 遇到重名NPC时，系统自动优先匹配你的任务目标
  • 无需担心攻击到其他玩家的委托NPC
