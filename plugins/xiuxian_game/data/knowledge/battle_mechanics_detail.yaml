body: |
  战斗数值机制（供AI客服解答，均为当前实现的准确数值）
  **伤害计算**
  • 先数值减伤：减免 = 有效防御×0.2，但最多减掉原伤害的50%
  • 再比例减伤：减伤率 = 防御/(防御+300+30√防御)，硬上限60%（约2850防御封顶），伤害至少穿透40%
  • 有效防御 = 防御×(1-对方穿透率)，穿透率上限100%；只要原伤害>0，最终至少造成1点
  **命中与闪避**
  • 命中概率 = (攻方命中率-守方闪避率)/100，最低10%、最高100%；命中率可堆超100来抵消高闪避，两者上限各500
  **暴击**
  • 基础暴击倍率1.5倍，暴击力每点+0.1倍；有效暴击率 = 暴击率-对方抗暴率
  • 抗暴率双重作用：既降对方暴击概率，也等量削减对方暴击力
  **连击与反击**
  • 连击触发后共打2~4次，第二次起每段伤害为基础的85%；连击率上限60%，被对方抗连击率抵扣
  • 反击在被命中后或闪避后都可能触发，伤害=自身攻击×0.5（怪物反击×0.7），反击本身可被闪避、可暴击；连击/反击不会再嵌套触发
  **先手与回合**
  • 先手概率 = 己方敏捷/(双方敏捷之和)，限制在10%~90%之间随机判定，敏捷高更可能先手但非必定
  • 切磋/死斗最多30回合，打满未分胜负判平局
  **特殊词条**
  • 吸血：命中伤害×吸血率回血，暴击时吸血量×1.5
  • 普通反弹：按本次伤害的一定比例返还，多个来源共享单次上限=反弹者有效攻击×10；最多将攻击者扣至1HP，不能致死
  • 真伤率：按概率使该次攻击无视防御（绝魔体质可免疫一半）
  • 定身率：命中后按概率使对方1回合无法行动
  • 灵爆率：技能攻击专用暴击率，上限70%，技能出手时替代普通暴击率
  **切磋 vs 死斗**
  • 切磋纯模拟：不扣血、不掉落、不记战绩，任何区域可用
  • 死斗（荒野/诡域【攻击】）：败者真实扣血，掉落背包中部分非装备物品（消耗品/材料/商品/鬼碎片）；紫/橙/红材料、装备、金币、氪金道具永不掉落
  • 掉落量：随机抽10%~25%的堆叠，每堆掉20%~50%；同一败者60秒内不重复掉落（掉落保护）
  • 打满30回合平局：双方按实际伤害扣血，但无人掉落
  • 攻击无冷却无每日次数限制，但需距目标3格内；目标在其公会势力范围内受保护无法被死斗
  • 目标穿戴镜怨之衣或龙影闪时，攻击者会被直接反杀，跳过战斗
  **其他**
  • 战斗日志默认详细模式，【日志模式 简洁】可切换
