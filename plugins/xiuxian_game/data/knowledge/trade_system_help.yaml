body: |
  ✨ 交易系统帮助 ✨
  玩家间自由交易平台，支持物品、装备交易和金币转账
  ━━━━━━━━━━━━━
  💰 金币转账：
  【转账 <UID> <金额>】 向其他玩家转账（收取3%手续费）
  ━━━━━━━━━━━━━
  🎽 物品交易：
  【交易清单 [页数]】 查看所有在售与求购物品
  【查牌 <物品名> [页数]】 查看物品买卖价格与市场参考
  【挂牌 <出售/收购> <物品名> <单价> [数量]】 挂牌交易
  【我的挂牌 [页数]】 查看自己的挂牌订单
  【撤牌 <挂牌ID>】 撤回挂牌
  【挂牌详情 <订单ID>】 查看订单详情（装备交易时展示完整属性、词缀、铭文、宝石信息）
  【税率】 查看分段累进交易税率
  ━━━━━━━━━━━━━
  ⚔️ 装备交易：
  【估价 <编号/名称>】 查看装备价值评估
  【挂牌 出售 <编号/名称> <价格>】 出售装备实例
  ━━━━━━━━━━━━━
  🔄 撮合原理：
  • 买单匹配价格≤买价的卖单，按价格升序成交
  • 卖单匹配价格≥卖价的买单，按价格降序成交
  • 成交价格采用对手方价格（价格优先）
  • 相同价格按时间先后顺序成交
  ━━━━━━━━━━━━━
  💰 交易税收：
  • 5000以下：免税
  • 5001-50000：超出部分3%
  • 50001-200000：超出部分5%
  • 200000以上：超出部分8%
  ━━━━━━━━━━━━━
  ⚠️ 限制：最多挂6个订单，8小时内购买的物品不能出售
  💡 转账可用于玩家间金币交易，手续费3%
