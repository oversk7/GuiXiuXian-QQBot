body: |
  玩家间自由交易平台，支持物品、装备交易和金币转账
  ━━━━━━━━━━━━━
  **💰 金币转账**
  【转账 UID 金额】 向其他玩家转账（收取3%手续费）
  ━━━━━━━━━━━━━
  **🎽 物品交易（货架直购）**
  【交易清单 页数】 查看所有在售物品
  【查牌 物品名】 查看在售牌子与市场参考价
  【买牌 牌子ID 数量】 直接购买在售牌子（数量缺省为全部）
  【挂牌 出售 物品名 单价 数量】 上架出售
  【我的挂牌 页数】 查看自己的挂牌订单
  【撤牌 挂牌ID】 撤回挂牌
  【挂牌详情 订单ID】 查看订单详情（装备展示完整属性、词缀、铭文、宝石）
  【税率】 查看分段累进交易税率
  ━━━━━━━━━━━━━
  **⚔️ 装备交易**
  【估价 编号】 查看装备价值评估
  【挂牌 出售 编号 价格】 出售装备实例
  ━━━━━━━━━━━━━
  **🛒 交易流程**
  • 卖家【挂牌 出售】上架 → 买家【查牌】比价 → 【买牌 牌子ID】成交
  • 货款实时到账（税费由卖家承担），物品直接进背包
  • 求购挂牌已下线，想买直接买牌即可
  ━━━━━━━━━━━━━
  **💰 交易税收（向卖家征收）**
  • 5000以下：免税
  • 5001-20000：超出部分5%
  • 20001-50000：超出部分10%
  • 50001-100000：超出部分15%
  • 100000以上：超出部分20%
  ━━━━━━━━━━━━━
  ⚠️ 限制：最多挂6个订单，8小时内购买的物品不能出售
  💡 转账可用于玩家间金币交易，手续费3%
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
