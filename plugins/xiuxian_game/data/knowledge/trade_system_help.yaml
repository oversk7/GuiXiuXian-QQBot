body: |
  ━━━━━━━━━━━━━
  **💰 转账**
  【转账 UID 金额】 手续费3%
  ━━━━━━━━━━━━━
  **🎽 挂牌交易**
  【交易清单 页数】 在售与求购
  【查牌 物品名】 买卖价与市场参考
  【挂牌 出售 物品名 单价 数量】 也可挂牌 收购
  【我的挂牌 页数】 | 【撤牌 挂牌ID】
  【挂牌详情 订单ID】 装备订单展示完整属性、词缀、铭文、宝石
  【税率】 累进税率表
  ━━━━━━━━━━━━━
  **⚔️ 装备交易**
  【估价 编号】 装备估值
  【挂牌 出售 编号 价格】 按实例出售
  ━━━━━━━━━━━━━
  **🔄 撮合规则**
  • 买单匹配价格不高于买价的卖单，卖单同理，价格优先
  • 成交价取对手方价格；同价按挂牌时间先后
  ━━━━━━━━━━━━━
  **💰 交易税（累进）**
  5000以下免税 | 5001-5万部分3% | 5万-20万部分5% | 20万以上部分8%
  ━━━━━━━━━━━━━
  > 每人最多挂6单；买入8小时内的物品不能出售
  > 【帮助】 返回
