body: |
  签到与小游戏机制细节（供AI客服解答，均为当前实现的准确数值）
  **签到**
  • 金币 = 基础50-150×连签天数，上限3000；幸运值有概率翻倍
  • 官方群签到基础100-300，额外+10~50怨念
  • 每日送扫荡令×5；咒抗恢复到10（月卡15）；首次签到送改名卡；注册当日签到送新手礼包
  • 【签到日历】（别名【签到记录】）显示本月每天是否签到、本月签到天数和当前连签；记录从功能上线起保存，上线前只能补回当时正在连签的那几天
  **人机轮盘（限私聊）**
  • 入场费100~50万金币（消耗不退）；默认4血可选3-6
  • 赢后可加倍最多5次，倍率依次×2.0/×1.7/×1.5/×1.3/×1.2；输了恶魔币清零
  **猜拳（仅周六，限群聊）**
  • 下注1000~99,999,999；连续2次平局触发"镜中鬼替换"，损失30%金币（至少1000）
  **频率限制**
  • 所有游戏指令按平台账号共享5秒8次额度，超限提示每10秒最多一次
  • 抽签1小时3次；每日一言/驾考/热搜/答案之书等10分钟10次；起卦5分钟10次且间隔30秒；今天吃什么5分钟5次
