id: "explore_detail"
title: "探索移动机制细节（AI客服专用）"
keywords:
  - 移动速度公式
  - 走路太慢
  - 导航事件概率
  - 灵异事件
  - 保险鬼
  - 灵泉次数
  - 观察范围
  - 附近玩家范围
  - 网页大地图
body: |
  探索与移动机制细节（供AI客服解答，均为当前实现的准确数值）
  • 移动速度 = 0.1 + 0.04×√敏捷 格/秒（敏捷5约0.19格/秒，敏捷200约0.67格/秒）——嫌走路慢就堆敏捷
  • 导航事件：路程≥30格才触发，每30-80格一次，单程最多5个，到达时另有50%概率一个
  • 事件好坏比60%/40%：好事有金币100-500、灵草、经验、灵泉（恢复咒抗2-5点，每日限3次）；坏事有被抢50-200金币、损失5%-10%生命、野兽与保险鬼
  • 灵异事件「保险鬼」每次事件判定概率0.4%，每趟导航最多一次（幸存后本趟不再遇到），整趟遭遇概率不超过约2.4%，红字显示；遭遇后90%概率当场死亡（生命归零、诡域连杀清零），停在遭遇的现实坐标并立即中止导航；10%概率幸存并继续赶路
  • 灵异事件随导航进度结算，普通事件在到达时结算；死亡后不会领取到达事件的收益，复活后需重新导航
  • 【观察】只显示3格内的其他玩家；【附近玩家】显示同区域最近5人（不限距离）
  • 网页版大地图：https://oversky.online/map
