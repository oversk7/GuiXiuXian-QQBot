body: |
  自动选用最高阶丹炉；失败返还50%材料
  ━━━━━━━━━━━━━
  **📋 指令**
  【丹方 页数】 配方列表，可加页数或关键词搜索
  【炼丹 丹方名 数量】 开炉，支持丹方序号
  【炼丹状态】 | 【收获丹药】 领取成品
  ━━━━━━━━━━━━━
  **💊 丹药类型**
  经验丹：效果随等级提升
  治疗丹：百分比恢复，全程有效
  战斗丹：百分比临时增益，持续10-60分钟，buff未到期不能续用
  永久丹：固定值永久提升
  洗髓丹（归元系列）：转换永久丹加成为可分配点
  • 所有丹药均有每日服用上限，【查看 丹药名】可看今日剩余
  ━━━━━━━━━━━━━
  **🔄 洗髓**
  归元破力丹/化敏丹/散防丹/化体丹/凝神丹/化运丹：将对应属性"永久丹累计加成"的3%转为可分配点
  • 只洗永久丹加成部分，加点与升级属性不受影响；生命上限按3:1折算点数
  转换后用【加点 属性 点数】重新分配，适合调整流派；思路见 【加点帮助】
  ━━━━━━━━━━━━━
  **🔥 丹炉升阶**
  +0阶 成功率×1.0 耐久消耗5 | +2阶 ×1.2 耗4
  +5阶 ×1.5 耗3 | +8阶 ×1.8 耗2 | +10阶 ×2.0 耗2（满级）
  升阶方法见 【升阶帮助】
  ━━━━━━━━━━━━━
  > 【成长核心】 | 【帮助】 返回
