body: |
  消耗材料炼丹药，失败返还50%材料，自动用最高阶炉
  ━━━━━━━━━━━━━
  **📋 基本命令**
  【丹方 页数】 查看或搜索炼丹配方（可加页数/关键词）
  【炼丹状态】 查看炼丹状态
  【炼丹 丹方名 数量】 自动选择最高阶炉炼丹（支持丹方序号）
  【收获丹药】 收获炼制完成的丹药
  ━━━━━━━━━━━━━
  **💊 丹药类型**
  经验丹: 效果随等级提升（基础+等级加成）
  治疗丹: 百分比恢复，全程有效
  战斗丹: 百分比临时增益（15-30分钟）
  永久丹: 固定值永久提升，每日限量
  洗髓丹: 转换3%属性为可分配点数
  ━━━━━━━━━━━━━
  **🔄 洗髓系统**
  洗髓丹将3%指定属性转为可分配点
  例: 攻击100时，洗髓·力丹转换3点攻击
  转换后用【加点 属性 点数】重新分配，适合优化战斗流派
  用 【加点帮助】 查看分配指南
  ━━━━━━━━━━━━━
  **🔥 炼丹炉升阶效果**
  +0阶: 成功率x1.0 耐久消耗5
  +1阶: x1.1 耐久5 | +2阶: x1.2 耐久4
  +5阶: x1.5 耐久3 | +8阶: x1.8 耐久2
  +10阶: x2.0 耐久2（满级）
  炼丹炉可通过 【升阶帮助】 系统提升等级
  ━━━━━━━━━━━━━
  > 【成长核心】 更多指令 | 【帮助】 返回
