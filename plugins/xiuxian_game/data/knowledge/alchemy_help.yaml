body: |
  ✨ 炼丹系统帮助 ✨
  消耗材料，获得丹药，炼丹炉可通过升阶提升成功率
  炼丹失败时会返还50%材料，自动使用最高阶炼丹炉
  ━━━━━━━━━━━━━
  【丹方 [页数|关键词]】 查看或搜索炼丹配方
  【炼丹状态】 查看炼丹状态
  【炼丹 <丹方序号|名称> <数量>】 自动选择最高阶炼丹炉进行炼丹
  【收获丹药】 收获炼制完成的丹药
  ━━━━━━━━━━━━━
  💊 丹药类型说明：
  • 经验丹：效果随等级提升（基础+等级加成）
  • 治疗丹：百分比恢复，全程有效
  • 战斗丹：百分比临时增益，强而短（15-30分钟）
  • 永久丹：固定值永久提升，每日限量
  • 洗髓丹：转换3%属性为可分配点数
  ━━━━━━━━━━━━━
  🔄 洗髓系统：
  • 洗髓丹可将3%的指定属性转为可分配点
  • 例：攻击100时，洗髓·力丹转换3点攻击
  • 转换后使用【加点】指令重新分配
  • 适合调整属性分配，优化战斗流派
  ━━━━━━━━━━━━━
  🔥 炼丹炉升阶效果：
  • +0阶：成功率×1.0，耐久消耗5
  • +1阶：成功率×1.1，耐久消耗5
  • +2阶：成功率×1.2，耐久消耗4
  • +5阶：成功率×1.5，耐久消耗3
  • +8阶：成功率×1.8，耐久消耗2
  • +10阶：成功率×2.0，耐久消耗2（满级）
  💡 炼丹炉可通过【升阶】系统提升等级
