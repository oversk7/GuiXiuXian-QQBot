id: "mansion_detail"
title: "阴宅机制细节（AI客服专用）"
keywords:
  - 阴宅升级费用
  - 升级阴宅多少钱
  - 阴宅使用费
  - 阴宅扣费
  - 阴宅仓库容量
  - 远程仓库特权
  - 阴宅出售
  - 拆除阴宅
  - 阴宅位置限制
  - 洞府升级
body: |
  阴宅机制细节（供AI客服解答，均为当前实现的准确数值）
  **升级费用**
  • 升级费 = 1000万 × 1.5^当前等级：1→2级1500万，5→6级约7594万，10→11级约5.77亿，20→21级约332.5亿，29→30级约1.28万亿
  **使用费（他人付费用你的阴宅）**
  • 下限 = 1000+(等级-1)×500（1级1000，30级15500），上限500万；购买时默认1000，升级后低于新下限会自动上调
  • 扣费时机：他人每次【修炼】扣一次；闭关不扣，【出关】时按出关位置扣一次并结算加成
  • 费用实时转入宅主金币，宅主无需在线
  • 在他人阴宅享受加成需同时满足：宅主开放权限＋自己付费意愿开启＋金币够付；付款失败则本次无加成
  **仓库**
  • 容量：1~10级每级+5格，11~20级每级+15格，21~30级每级+30格（1级50格，30级545格）；1格=1个堆叠，每堆上限100个
  • 默认须在自己阴宅位置操作；赞助商店【购买远程仓库】特权后（月卡也含）可在任意位置存取
  • 取出需背包有空位
  **建造/迁移限制**
  • 一人仅一座；禁止建在原点(0,0)；距所有市集及缉邪司总部须21格以上（正好20格会失败）；同一坐标不能有两座阴宅
  • 阴宅不能出售、不能拆除、不退款，只能迁移（费用为当前等级升级费的50%）
  **灵田加成生效时机**
  • 种植瞬间按当时阴宅等级锁定成长/产量加成，已种下的作物不随阴宅升级变化；不要求在阴宅位置种植，有阴宅即全局生效
