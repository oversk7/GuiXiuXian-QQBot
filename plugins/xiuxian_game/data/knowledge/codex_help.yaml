body: |
  查物品、配方、地图、人物与玩法，直接发送图鉴命令，无需询问AI。
  ━━━━━━━━━━━━━
  【图鉴】 打开首页，查看分类
  【图鉴 <分类>】 浏览该类条目
  【图鉴 <分类> <页码>】 查看指定页
  【图鉴 <名称>】 查询详情；优先查找全名，记不全也可输入部分名称
  【图鉴 装备 蓝色 100级】 筛选等级要求不高于100级的蓝装；转生等穿戴条件请查看详情。
  列表中的名称可以点击；遇到同名条目，按候选说明选择。
  ━━━━━━━━━━━━━
  【图鉴 诡域 <深度>】 查询指定深度的产出，找材料时可先查这里。
  【图鉴 来源 <物品名>】 查询获取途径与用途；也可点击物品详情中的来源用途入口，继续查阅关联配方。
  来源与用途以当前收录内容为准。
  ━━━━━━━━━━━━━
  【图鉴帮助】 查看本页 | 【帮助】 返回帮助首页
