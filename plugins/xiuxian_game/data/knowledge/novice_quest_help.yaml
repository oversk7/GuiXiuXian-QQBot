id: "novice_quest_help"
title: "新手任务帮助"
help_command: "新手任务帮助"
keywords:
  - 新手任务帮助
  - 新手任务
  - 新手进度
  - 任务指引
  - 新手引导
body: |
  ━━━━━━━━━━━━━
  【接着走下一步】
  新手引导面向30级以下、尚未转生的角色；达到30级或转生后结束引导。
  发送【新手任务】或【新手进度】，查看当前目标、累计进度和下一条指令。
  任务进度会一直保留，不需要一天内做完；回来后再查看即可接着走。
  点击蓝字会填入指令，记得再发送。
  ━━━━━━━━━━━━━
  【出棺后的第一步】
  完成序章后，已有足够经验进行首次突破。
  【突破】 → 【加点 力 5】 → 【面板】，再跟随任务观察世界、学习导航和修炼。
  一区30级前、二区25级前突破必定成功；经验不会自动转成等级，需要发送【突破】。
  ━━━━━━━━━━━━━
  【三章引导】
  第一章：突破、加点、观察、导航、修炼、用药、委托预览与初入诡域。
  第二章：签到、打工、穿戴装备、锻造与闭关。
  第三章：市集、买卖、钓鱼、公会与切磋。
  ━━━━━━━━━━━━━
  【教学提示】
  修炼任务会显示累计次数，冷却期间重复发送不计数。
  用药教学中发送【使用 回春散】，满血时也能完成这一步，药会留在背包里。
  委托教学中发送【任务】即可查阅预览；达到30级后才能接取每日委托。
  今天已经签到过，也能完成签到教学。
