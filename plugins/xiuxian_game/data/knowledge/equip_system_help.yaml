body: |
  ✨ 装备系统帮助 ✨
  穿戴装备提升属性，锻造、升阶、镶嵌强化装备
  ━━━━━━━━━━━━━
  🎽 基础功能：
  【装备栏 [页码]】 查看装备（显示编号）
  【装备详情 <编号/名称>】 查看详细信息
  【装备 <编号/名称> [编号2 ...]】 穿戴装备（支持批量）
  【卸下 <编号/名称>】 卸下装备
  【一键卸下】 卸下全部装备
  【修理 <编号/名称> [金币:怨念]】 修理装备
  ━━━━━━━━━━━━━
  🛠️ 耐久与损坏：
  • 装备耐久降至0时会自动卸下且无法穿戴，需修理后恢复
  • 战斗/副本/扫荡均会消耗耐久
  ━━━━━━━━━━━━━
  ⚒️ 锻造系统：
  【锻造列表】 查看全部装备及可锻造城镇
  【配方 <装备名>】 查看锻造配方
  【锻造 <装备名>】 锻造装备（需在工坊≤3格，或位于建有铸器坊的公会基地）
  💡 诡域中无法锻造，需返回现实世界
  ━━━━━━━━━━━━━
  ⭐ 升阶系统：
  【升阶信息 <编号/名称>】 查看升阶需求和成功率
  【升阶 <编号/名称>】 装备合成升阶
  【升阶 <编号/名称> 稳定水晶】 提升成功率
  【一键升阶 <编号/名称> <目标阶数>】 自动连续升阶到目标
  【一键升阶 <编号/名称> <目标阶数> 稳定水晶】 带保护连续升阶
  【升阶列表】 查看可升阶装备
  💡 位于建有淬灵台的公会基地时，升阶会获得成功率和金币折扣加成
  💡 1-3阶成功率95%-85%，7-10阶60%-25%
  ━━━━━━━━━━━━━
  💎 镶嵌系统：
  【孔位 <编号/名称>】 查看孔位信息
  【镶嵌 <编号/名称> <孔位> <镶嵌物>】 镶嵌宝石/符文
  【拆卸 <编号/名称> <孔位>】 拆卸镶嵌物（有风险）
  【镶嵌物品】 查看可镶嵌物品列表
  【镶嵌物升级 <镶嵌物名>】 查看镶嵌物升级信息
  【合成镶嵌物 <镶嵌物名>】 升级合成镶嵌物
  【可升级镶嵌物】 查看所有可升级的镶嵌物
  ━━━━━━━━━━━━━
  🔮 词缀系统：
  • 击杀怪物有概率掉落带词缀的装备
  • T1词缀：提供暴击/闪避/穿透等战斗属性加成
  • T2词缀：触发恐惧/吸血/反伤等特殊效果
  • 词缀数量取决于装备稀有度（白0-1，绿1-2，蓝2-3，紫3-4，橙4）
  • 锻造产出为素装（无词缀），仅怪物掉落装备带词缀
  【装备详情 <编号/名称>】 可查看装备词缀
  ━━━━━━━━━━━━━
  📜 铭文系统：
  • 铭文分为基础铭文(单效果)和高级铭文(多效果)
  • 铭文有品阶：下品/中品/上品/极品/仙品
  • 来源：精英怪掉落(主要)、铭文碎片合成(基础)
  • 3000级+精英怪有极低概率触发仙品铭文
  【铭文列表】 查看背包中的铭文（支持翻页：铭文列表 2）
  【合成铭文】 消耗5个铭文碎片，60%概率合成随机基础铭文
  【合成铭文 稳定水晶】 额外消耗1个稳定水晶，100%成功
  【镶嵌 装备编号 孔位 铭文名】 镶嵌铭文
  【拆卸 装备编号 孔位】 拆卸铭文
  ━━━━━━━━━━━━━
  🔨 分解系统：
  • 销毁装备获得洗词石（按稀有度1~15个）
  • 带T2词缀装备分解有50%概率获得铭文碎片
  • 已穿戴/VIP装备不可分解
  【分解 装备编号/名称】 分解装备
  ━━━━━━━━━━━━━
  🔄 洗炼系统：
  • 消耗洗词石×1重新随机词缀数值
  • 词缀类型不变，数值在区间内重随机
  【洗炼 装备编号/名称 词缀序号】 预览洗炼
  【确认洗炼】 执行洗炼
  ━━━━━━━━━━━━━
  🏛️ 总部商店：
  【总部商店】北极风雪镇(-5,390)
  【总部兑换 <物品> [数量]】 用积分兑换材料
  ━━━━━━━━━━━━━
  ⚠️ 最多穿戴5件装备，不能重复穿戴
  💡 VIP定制装备持有者可发送【装备菜单】查看专属技能
