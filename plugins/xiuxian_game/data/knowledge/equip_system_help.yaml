body: |
  ━━━━━━━━━━━━━
  **🎽 基础**
  【装备栏 页码】 已有装备与编号
  【装备详情 编号】 详细属性，支持名称
  【装备 编号】 穿戴，支持批量。最多穿5件，不可重复
  【卸下 编号】 | 【一键卸下】 全部卸下
  【修理 编号】 可加 金币/怨念 指定支付方式
  【一键修理 [金币:怨念]】 修理全部，月卡免手续费，非月卡+20%
  【锁定装备 编号】 防分解、升阶消耗、挂牌 | 【解锁装备 编号】
  • 耐久归0自动卸下且无法穿戴，战斗/副本/扫荡均耗耐久
  ━━━━━━━━━━━━━
  **⚒️ 锻造**
  【锻造列表】 全部装备及可锻造城镇
  【配方 装备名】 所需材料
  【锻造 装备名】 需在工坊3格内或公会铸器坊；诡域中不可锻造
  ━━━━━━━━━━━━━
  **⭐ 升阶**
  【升阶信息 编号】 需求与成功率 | 【升阶列表】 可升阶装备
  【升阶 编号】 合成升阶 | 【升阶 编号 稳定水晶】 提升成功率
  【一键升阶 编号 目标阶数】 自动连续升阶，可加 稳定水晶
  • 成功率1-3阶95%-85%，7-10阶60%-25%
  • 公会淬灵台提供成功率与金币折扣加成
  ━━━━━━━━━━━━━
  **💎 镶嵌**
  【孔位 编号】 孔位详情 | 【镶嵌物品】 可镶嵌物清单
  【镶嵌 编号 孔位 镶嵌物】 镶嵌宝石/符文
  【拆卸 编号 孔位】 拆卸，有失败风险
  【镶嵌物升级 镶嵌物名】 升级所需 | 【可升级镶嵌物】 可升级清单
  【合成镶嵌物 镶嵌物名】 升级合成
  【一键合成镶嵌物 镶嵌物名 目标等级】 连续合成，可加 稳定水晶
  ━━━━━━━━━━━━━
  **🔮 词缀**
  • 仅怪物掉落装备带词缀，锻造产出为素装
  • T1：暴击/闪避/穿透等战斗属性；T2：恐惧/吸血/反伤等特效
  • 词缀数量随稀有度：白0-1，绿1-2，蓝2-3，紫3-4，橙4
  • 词缀详情见【装备详情 编号】
  ━━━━━━━━━━━━━
  **📜 铭文**
  • 基础铭文单效果，高级铭文多效果；品阶下品至仙品
  • 主要出自精英怪，3000级以上精英怪有极低概率出仙品
  【铭文列表 页码】 背包铭文
  【合成铭文】 消耗5碎片，60%成功 | 【合成铭文 稳定水晶】 必成
  【镶嵌 装备编号 孔位 铭文编号】 | 【拆卸 编号 孔位】
  ━━━━━━━━━━━━━
  **🔨 分解与洗炼**
  【分解 编号】 销毁换洗词石，按稀有度1~15个；带T2词缀装备50%出铭文碎片
  • 已穿戴与VIP装备不可分解
  【洗炼 编号 词缀序号】 预览 → 【确认洗炼】 耗洗词石掷新值
  → 【选择新值】 或 【保留旧值】
  • 词缀类型不变，仅在区间内重随机数值
  ━━━━━━━━━━━━━
  **🏛️ 总部商店**
  【总部商店】 位于北极风雪镇(-5,390) | 【总部兑换 物品 数量】 积分换材料
  ━━━━━━━━━━━━━
  **🧩 套装**
  • 同套装多件齐穿激活额外属性，2件起效
  • 现有6套：雾都猎手、凌晨3:33、云岭幽魂、疯人院惨剧、金陵魇、崩塌纪元
  【套装信息】 全部套装、部件与激活状态
  ━━━━━━━━━━━━━
  > VIP定制装备与定制者绑定，不可交易、转移、拍卖
  > VIP定制装备持有者可发【装备菜单】查看专属技能
  > 【帮助】 返回
