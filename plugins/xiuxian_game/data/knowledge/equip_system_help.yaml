body: |
  穿戴装备提升属性，锻造、升阶、镶嵌强化装备
  ━━━━━━━━━━━━━
  **🎽 基础功能**
  【装备栏 页码】 查看装备（显示编号）
  【装备详情 编号】 查看详细信息（支持名称）
  【装备 编号】 穿戴装备（支持批量）
  【卸下 编号】 卸下装备 | 【一键卸下】 全部卸下（卸下全部装备）
  【修理 编号】 修理单件装备（可加 金币/怨念）
  【一键修理 [金币:怨念]】 修理所有装备（月卡免手续费，非月卡+20%）
  【锁定装备 编号】 保护装备不被分解/升阶消耗/挂牌
  【解锁装备 编号】 取消锁定保护
  ━━━━━━━━━━━━━
  **🛠️ 耐久与损坏**
  • 耐久降至0自动卸下且无法穿戴，需修理恢复
  • 战斗/副本/扫荡均会消耗耐久
  ━━━━━━━━━━━━━
  **⚒️ 锻造系统**
  【锻造列表】 查看全部装备及可锻造城镇
  【配方 装备名】 查看锻造配方
  【锻造 装备名】 锻造装备（工坊≤3格或公会基地铸器坊）
  💡 诡域中无法锻造，需返回现实世界
  ━━━━━━━━━━━━━
  **⭐ 升阶系统**
  【升阶信息 编号】 查看升阶需求和成功率
  【升阶 编号】 装备合成升阶
  【升阶 编号 稳定水晶】 提升成功率
  【一键升阶 编号 目标阶数】 自动连续升阶（可加 稳定水晶）
  【升阶列表】 查看可升阶装备
  💡 在公会基地使用淬灵台可获得升阶成功率和金币折扣加成
  💡 1-3阶成功率95%-85%，7-10阶60%-25%
  ━━━━━━━━━━━━━
  **💎 镶嵌系统**
  【孔位 编号】 查看孔位信息
  【镶嵌 编号 孔位 镶嵌物】 镶嵌宝石/符文
  【拆卸 编号 孔位】 拆卸镶嵌物（有风险）
  【镶嵌物品】 可镶嵌物品列表
  【镶嵌物升级 镶嵌物名】 查看升级信息
  【合成镶嵌物 镶嵌物名】 升级合成
  【一键合成镶嵌物 镶嵌物名 目标等级】 自动连续合成到目标等级（可加 稳定水晶；别名：一键合成宝石/一键合成佛珠）
  【可升级镶嵌物】 查看所有可升级的镶嵌物
  ━━━━━━━━━━━━━
  **🔮 词缀系统**
  • 击杀怪物有概率掉落带词缀的装备
  • T1词缀：暴击/闪避/穿透等战斗属性加成
  • T2词缀：恐惧/吸血/反伤等特殊效果
  • 词缀数量取决于稀有度（白0-1，绿1-2，蓝2-3，紫3-4，橙4）
  • 锻造产出为素装（无词缀），仅怪物掉落带词缀
  【装备详情 编号】 可查看装备词缀
  ━━━━━━━━━━━━━
  **📜 铭文系统**
  • 铭文分为基础铭文（单效果）和高级铭文（多效果）
  • 品阶：下品/中品/上品/极品/仙品
  • 来源：精英怪掉落（主要）、铭文碎片合成（基础）
  • 3000级+精英怪有极低概率触发仙品铭文
  【铭文列表】 查看背包中的铭文（支持翻页：铭文列表 2）
  【合成铭文】 消耗5碎片，60%概率合成随机铭文
  【合成铭文 稳定水晶】 额外消耗1稳定水晶，100%成功
  【镶嵌 装备编号 孔位 铭文编号】 镶嵌铭文（编号见铭文列表）
  【拆卸 编号 孔位】 拆卸铭文
  ━━━━━━━━━━━━━
  **🔨 分解系统**
  • 销毁装备获得洗词石（按稀有度1~15个）
  • 带T2词缀装备分解有50%概率获得铭文碎片
  • 已穿戴/VIP装备不可分解
  【分解 编号】 分解装备（支持名称）
  ━━━━━━━━━━━━━
  **🔄 洗炼系统**
  • 消耗洗词石x1重新随机词缀数值
  • 词缀类型不变，数值在区间内重随机
  • 洗炼后可择优选择保留新值或旧值
  【洗炼 编号 词缀序号】 预览洗炼
  【确认洗炼】 消耗洗词石，掷出新值
  【选择新值】 采用新词缀 | 【保留旧值】 保留原值
  ━━━━━━━━━━━━━
  **🏛️ 总部商店**
  【总部商店】 北极风雪镇(-5,390)
  【总部兑换 物品 数量】 用积分兑换材料
  ━━━━━━━━━━━━━
  **🧩 套装系统**
  • 穿戴同套装多件装备可激活额外属性和效果
  • 雾都猎手：雾都风衣+幸运剪刀+黑色信封（2/3件激活）
  【套装信息】 查看所有套装和激活状态
  ━━━━━━━━━━━━━
  ⚠️ 最多穿戴5件装备，不能重复穿戴
  💡 VIP定制装备持有者可发送【装备菜单】查看专属技能
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
