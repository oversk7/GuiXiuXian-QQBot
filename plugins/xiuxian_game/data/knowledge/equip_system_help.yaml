body: |
  ✨ 装备系统帮助 ✨
  穿戴装备提升属性，锻造、升阶、镶嵌强化装备
  ━━━━━━━━━━━━━
  🎽 基础功能：
  【装备栏 [页码]】 查看装备（显示编号）
  【装备详情 <编号/名称>】 查看详细信息
  【装备 <编号/名称> [编号2 ...]】 穿戴装备（支持批量）
  【卸下 <编号/名称>】 卸下装备
  【一键卸下】 卸下全部装备
  【修理 <编号/名称> [金币:怨念]】 修理装备
  ━━━━━━━━━━━━━
  🛠️ 耐久与损坏：
  • 装备耐久降至0时会自动卸下且无法穿戴，需修理后恢复
  • 战斗/副本/扫荡均会消耗耐久
  ━━━━━━━━━━━━━
  ⚒️ 锻造系统：
  【锻造列表】 查看全部装备及可锻造城镇
  【配方 <装备名>】 查看锻造配方
  【锻造 <装备名>】 锻造装备（需在工坊≤3格）
  💡 诡域中无法锻造，需返回现实世界
  ━━━━━━━━━━━━━
  ⭐ 升阶系统：
  【升阶信息 <编号/名称>】 查看升阶需求和成功率
  【升阶 <编号/名称>】 装备合成升阶
  【升阶 <编号/名称> 稳定水晶】 提升成功率
  【一键升阶 <编号/名称> <目标阶数>】 自动连续升阶到目标
  【一键升阶 <编号/名称> <目标阶数> 稳定水晶】 带保护连续升阶
  【升阶列表】 查看可升阶装备
  💡 1-3阶成功率95%-85%，7-10阶60%-25%
  ━━━━━━━━━━━━━
  💎 镶嵌系统：
  【孔位 <编号/名称>】 查看孔位信息
  【镶嵌 <编号/名称> <孔位> <镶嵌物>】 镶嵌宝石/符文
  【拆卸 <编号/名称> <孔位>】 拆卸镶嵌物（有风险）
  【镶嵌物品】 查看可镶嵌物品列表
  【镶嵌物升级 <镶嵌物名>】 查看镶嵌物升级信息
  【合成镶嵌物 <镶嵌物名>】 升级合成镶嵌物
  【可升级镶嵌物】 查看所有可升级的镶嵌物
  ━━━━━━━━━━━━━
  🏛️ 总部商店：
  【总部商店】北极风雪镇(-5,390)
  【总部兑换 <物品> [数量]】 用积分兑换材料
  ━━━━━━━━━━━━━
  ⚠️ 最多穿戴5件装备，不能重复穿戴
  💡 VIP定制装备持有者可发送【装备菜单】查看专属技能
