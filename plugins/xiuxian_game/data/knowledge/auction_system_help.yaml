body: |
  稀有物品限时竞价，价高者得
  ━━━━━━━━━━━━━
  **📋 指令**
  【拍卖行 页码】 进行中的拍卖
  【上架拍卖 物品名 起拍价 时长】 可加 一口价 宣传语
  【出价 拍卖编号 金额】 竞价
  【拍卖详情 拍卖编号】 竞价历史
  【我的拍卖】 | 【撤拍 拍卖编号】 仅无人出价时可撤
  ━━━━━━━━━━━━━
  **📦 上架规则**
  • 除跑商商品外均可上架；装备连同宝石按实例拍卖
  • 每人同时最多3件；时长1~72小时
  • 起拍价不低于系统估价；一口价须高于起拍价
  • 宣传语最多32字，展示在拍卖列表；上架后向留言板广播
  ━━━━━━━━━━━━━
  **💰 出价规则**
  • 每次加价至少5%；出价即冻结金币，被超价自动退还
  • 出到一口价立即成交
  • 不能对自己的拍品出价
  ━━━━━━━━━━━━━
  **🏆 结算**
  • 竞得：物品归买家，卖家收款并按挂牌市场同档累进税扣税
  • 流拍：物品退回卖家
  • 到期由系统每5分钟检查结算，到账可能延迟几分钟
  ━━━━━━━━━━━━━
  **✏️ 示例**
  上架拍卖 碎颅制服 50000 12
  上架拍卖 碎颅制服 50000 24 200000 全服最强防具
  出价 5 88000
  ━━━━━━━━━━━━━
  > 【交易系统】 挂牌市场 | 【帮助】 返回
