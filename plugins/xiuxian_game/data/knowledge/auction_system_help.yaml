body: |
  稀有高价值物品限时竞价，价高者得
  ━━━━━━━━━━━━━
  **📋 基本命令**
  【拍卖行 页码】 查看当前所有进行中的拍卖
  【上架拍卖 物品名 起拍价 时长】 发起拍卖（可加 一口价 宣传语）
  【出价 拍卖编号 金额】 参与竞价
  【拍卖详情 拍卖编号】 查看竞价历史（出价人、金额、时间）
  【我的拍卖】 查看自己发起的拍卖
  【撤拍 拍卖编号】 撤回拍卖（仅无人出价时可用）
  ━━━━━━━━━━━━━
  **🎮 快速上手（3步）**
  1. 【拍卖行】 浏览当前竞价物品
  2. 【出价 编号 金额】 参与竞价，金币会被冻结
  3. 拍卖结束后自动结算，被超价则自动退还金币
  ━━━━━━━━━━━━━
  **📦 上架规则**
  • 除跑商商品外，所有物品均可上架
  • 装备（含镶嵌宝石）以实例形式拍卖
  • 每人同时最多上架 3 件物品
  • 时长范围：1~72 小时
  • 起拍价最低：物品系统估价（装备含升阶/宝石加成）
  • 一口价（可选）：必须高于起拍价
  • 宣传语（可选）：最多32字，展示在拍卖列表中
  • 上架成功后会向留言板广播
  ━━━━━━━━━━━━━
  **💰 出价规则**
  • 每次出价至少高于当前价的 5%
  • 出价后金币立即冻结，被超价后自动退还
  • 出价达到一口价，立即成交并获得物品
  • 不能对自己上架的物品出价
  ━━━━━━━━━━━━━
  **🏆 结算机制**
  • 有人竞得：物品转移给买家，卖家获得金币（扣税）
  • 无人竞价（流拍）：物品退回卖家
  • 税率：与挂牌市场相同的分段累进税率
  • 拍卖结束前30分钟会广播提醒
  ━━━━━━━━━━━━━
  **💡 示例**
  上架拍卖 碎颅制服 50000 12
  上架拍卖 碎颅制服 50000 24 200000（带一口价）
  上架拍卖 碎颅制服 50000 24 200000 全服最强防具（带一口价+宣传语）
  出价 5 88000
  ━━━━━━━━━━━━━
  💡 发送 【交易系统】 查看挂牌市场帮助
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
