body: |
  ✨ 管理员系统帮助 ✨
  超级管理员专用指令
  ━━━━━━━━━━━━━
  🔧 物品管理：
  【发物品 <UID> <物品名> [数量]】 给玩家发放物品
  【发装备 <UID> <装备名> [数量]】 给玩家发放装备
  【发诡烛 <UID> <数量>】 给玩家发放诡烛(氪金货币)
  【转移物品 <UID1> <UID2> <物品名> <数量>】 转移物品
  ━━━━━━━━━━━━━
  🎁 抽奖系统：
  【发起抽奖 <物品名/金币> <中奖人数> <每人数量> [最低等级 [最高等级]]】 发起抽奖活动
  【开奖 <抽奖ID>】 进行开奖（仅发起人）
  【抽奖详情 <抽奖ID>】 查看抽奖详情
  【取消抽奖 <抽奖ID>】 取消抽奖并退还奖品
  ━━━━━━━━━━━━━
  📊 数据统计：
  【材料统计】 查看全服材料分布统计
  【材料详情 <材料名>】 查看指定材料详细分布
  ━━━━━━━━━━━━━
  🔍 日志管理：
  【查看报错 [数量]】 查看最近的报错日志（默认10条）
  【最近报错】 查看最近的报错日志
  【报错日志】 查看最近的报错日志
  【最近活动 [数量]】 查看全服最近活动（默认10条，最多50条）
  ━━━━━━━━━━━━━
  💾 备份管理：
  【手动备份】 立即创建MySQL数据库备份（mysqldump全量备份+gzip压缩）
  【备份状态】 查看备份文件列表和大小
    • 备份保存在 backups/ 目录，最多保留10个
  ━━━━━━━━━━━━━
  🖼️ 物品图片管理：
  【设置物品图片 <物品名> <图片URL>】 设置/覆盖物品图片
    • 如物品已有图片，仅管理员可覆盖
  【删除物品图片 <物品名>】 删除物品图片配置
  【物品图片列表】 查看所有已配置的物品图片
  💡 配置图片后，玩家使用【图鉴 物品名】可查看带配图的图鉴
  💡 普通玩家请使用【提交物品图片】为没有图片的物品提供图片
  ━━━━━━━━━━━━━
  🛠️ 工坊维护：
  【刷新工坊清单】 覆盖更新所有城镇的锻造清单（超级用户）
  ━━━━━━━━━━━━━
  💹 气运系统管理：
  【初始化气运】 初始化气运系统（超级用户）
  【更新气运价格】 手动刷新所有气运价格（超级用户）
  【触发黑天鹅】 手动触发黑天鹅事件检查（超级用户）
  ━━━━━━━━━━━━━
  🚫 封禁管理：
  【禁言 <UID> [原因] [时长]】 禁言玩家（禁止留言板发言）
  【解禁 <UID>】 解除禁言
  【黑名单】 查看当前黑名单
  【删除留言 <留言ID>】 删除恶意留言
  【封禁 <UID> [原因] [时长]】 全局封禁玩家（禁止所有游戏操作）
  【解封 <UID>】 解除全局封禁
  【封禁列表】 查看所有被封禁的玩家
  【封禁信息 <UID>】 查看玩家封禁详情
  💡 时长格式：3d（3天）、24h（24小时）、永久
  ⚠️ 全局封禁将禁止玩家执行所有游戏指令！
  ━━━━━━━━━━━━━
  🏰 公会管理：
  【删除公会 <公会ID或名称>】 全面删除公会及其所有数据
  ⚠️ 删除公会操作不可逆，将清空所有成员数据并删除所有相关记录！
  ━━━━━━━━━━━━━
  🧩 数据迁移 / 修复：
  【迁移加体比例 [预览|执行|执行 不备份]】 按新规则(1:3)迁移max_hp，并清零装备持久化max_hp，加装后生效
  ━━━━━━━━━━━━━
  🎆 活动管理：
  【开启活动 [小时数]】 开启除夕叩门活动（默认48小时）
  【关闭活动】 关闭除夕叩门活动
  ━━━━━━━━━━━━━
  🤖 AI数据库操作：
  【管理员要求 <需求描述>】 用自然语言查询/修改数据库
    示例：【管理员要求 查看等级前10的玩家】
    示例：【管理员要求 把UID1001的金币改为50000】
    别名：管理员请求、管理员查询
    ⚠️ 支持SELECT和UPDATE，禁止DELETE/DROP等危险操作
