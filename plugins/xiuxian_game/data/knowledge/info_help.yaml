body: |
  📖 图鉴记录 📖
  查看数据、排行榜、收集图鉴
  ━━━━━━━━━━━━━
  📚 物品图鉴：
  【图鉴 物品名】 查看物品详细信息
  【钓鱼图鉴】 查看鱼类图鉴
  ━━━━━━━━━━━━━
  🏆 排行榜：
  【排行榜】 查看所有排行榜
  【财富榜】【修为榜】【幸运榜】
  【探索榜】【敏捷榜】【魅力榜】
  【钓鱼排行】【BOSS排行】
  ━━━━━━━━━━━━━
  🎯 成就系统：
  【成就】 查看所有成就
  【成就 成就名】 查看成就详情
    自动触发，达成条件即解锁
  ━━━━━━━━━━━━━
  📊 个人记录：
  【面板】 查看角色面板
  【完整面板】 查看详细面板
  【打工记录】【钓鱼记录】【投资记录】
  【委托统计】【打工统计】
  ━━━━━━━━━━━━━
  💡 发送【玩家系统】看更多指令
