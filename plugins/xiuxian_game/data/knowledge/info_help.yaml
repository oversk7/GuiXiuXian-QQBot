body: |
  图鉴记录：图鉴、排行榜、成就、个人数据
  ━━━━━━━━━━━━━
  📚 图鉴：
  【图鉴 物品名】 物品详情 | 【钓鱼图鉴】 鱼类收集
  ━━━━━━━━━━━━━
  🏆 排行榜：
  【排行榜】 总览
  【财富榜】【修为榜】【幸运榜】【探索榜】
  【敏捷榜】【魅力榜】【钓鱼排行】【BOSS排行】
  ━━━━━━━━━━━━━
  🎯 成就：
  【成就】 全部成就 | 【成就 成就名】 详情
  达成自动解锁
  ━━━━━━━━━━━━━
  📊 个人记录：
  【面板】 | 【完整面板】 详细数据
  【打工记录】【钓鱼记录】【投资记录】【委托统计】【打工统计】
  ━━━━━━━━━━━━━
  更多指令见【玩家系统】
