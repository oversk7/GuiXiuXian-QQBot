body: |
  图鉴记录：图鉴、排行榜、成就、个人数据
  ━━━━━━━━━━━━━
  📚 图鉴：
  【图鉴 物品名】 物品详情，全量百科无需拥有 | 【钓鱼图鉴】 钓鱼玩法说明
  ━━━━━━━━━━━━━
  🏆 排行榜：
  【排行榜】 总览（数据5分钟刷新一次）
  【财富榜】【修为榜】【幸运榜】【探索榜】
  【敏捷榜】【魅力榜】【钓鱼排行】【BOSS排行】
  【小游戏榜】【恶魔币榜】【存款榜】【公会列表】
  ━━━━━━━━━━━━━
  🎯 成就：
  【成就】 全部成就（可加页码翻页） | 【成就 成就名】 详情
  达成自动解锁并发放奖励
  ━━━━━━━━━━━━━
  📊 个人记录：
  【面板】 | 【完整面板】 详细数据
  【打工记录】【钓鱼记录】【投资记录】【委托统计】【打工统计】
  ━━━━━━━━━━━━━
  更多指令见【玩家系统】
