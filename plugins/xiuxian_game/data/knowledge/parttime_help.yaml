body: |
  赚钱、练熟练度、捡道具，一举三得
  ━━━━━━━━━━━━━
  **📍 基本流程**
  1. 前往工作地点坐标（用【移动 x y】）
  2. 【打工】 查看可用工作
  3. 【打工 工作名称】 开始工作
  4. 【收工】 获得奖励（含评级+掉落）
  ━━━━━━━━━━━━━
  **📊 评级系统**
  收工时随机评级，倍率影响收入：
  🏆S(x3) ⭐A(x2) ✅B(x1.5) 📋C(x1) 💤D(x0.7)
  熟练度和运气越高，高评级概率越大
  ━━━━━━━━━━━━━
  **🔰 熟练度系统**
  同一工作做多了会升级，收入加成提升：
  🔰学徒(0次) → ⭐熟手(5次+15%) → 🌟专家(15次+35%) → 👑大师(30次+60%)
  ━━━━━━━━━━━━━
  **🎒 道具掉落**
  收工有概率获得材料、丹药、铭文碎片等
  熟练度越高，掉落率越高，稀有物品越多
  ━━━━━━━━━━━━━
  **🏢 工作地点（共15个）**
  上京商业中心 【移动 0 0】 服务业
  荔湾镇工业区 【移动 250 -1350】 体力工作
  郸城娱乐街区 【移动 150 -130】 轻松工作
  天海卫物流中心 【移动 250 -50】 物流工作
  石关农贸集散地 【移动 -200 -150】 农贸
  金陵文化商街 【移动 450 -480】 文旅
  云岭采矿区 【移动 -850 -1150】 采矿
  摩配镇修配街 【移动 80 140】 维修
  风雪镇哨站 【移动 150 1200】 巡逻
  舟山渔业码头 【移动 700 -600】 渔业
  大昌市商贸区 【移动 -600 -800】 商贸
  长安武馆 【移动 -500 -280】 武馆杂役
  汴梁集市 【移动 -100 -450】 集市帮工
  玉门驿站 【移动 -1200 100】 驿站服务
  鹏城码头 【移动 350 -1450】 码头工作
  ━━━━━━━━━━━━━
  **📋 相关命令**
  【打工】 查看当前位置工作
  【打工 工作名】 开始工作
  【收工】 完成工作获得奖励
  【工作状态】 查看当前工作状态
  【工作地点】 查看所有工作地点
  【打工记录】 查看打工历史
  【打工统计】 查看打工数据+熟练度
  ━━━━━━━━━━━━━
  💰 收入 = (基础+等级+熟练度)x运气x评级 + 连续奖励 + 特殊事件
  工时2-3分钟 | 工资90-350金币/次（评级S可达1050）
  ━━━━━━━━━━━━━
  > 【经济系统】 更多赚钱方式 | 【帮助】 返回
