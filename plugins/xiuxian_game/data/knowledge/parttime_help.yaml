body: |
  ━━━━━━━━━━━━━
  **📍 流程**
  到工作地点 → 【打工】 看可选工作 → 【打工 工作名称】 上工 → 【收工】 领奖励
  ━━━━━━━━━━━━━
  **📋 指令**
  【打工】 当前位置的工作 | 【工作地点】 全部地点
  【工作状态】 进行中的工作 | 【打工记录】 历史 | 【打工统计】 数据与熟练度
  ━━━━━━━━━━━━━
  **📊 评级**
  收工随机评级定倍率：S×3 | A×2 | B×1.5 | C×1 | D×0.7
  熟练度和运气越高，高评级越容易
  ━━━━━━━━━━━━━
  **🔰 熟练度**
  同一工作做得多，收入加成越高：
  学徒 → 熟手(5次+15%) → 专家(15次+35%) → 大师(30次+60%)
  掉落率也随熟练度提升，收工有机会获得材料、丹药、铭文碎片
  ━━━━━━━━━━━━━
  **🏢 工作地点（15个）**
  上京商业中心 【移动 0 0】 服务业
  荔湾镇工业区 【移动 250 -1350】 体力
  郸城娱乐街区 【移动 150 -130】 轻松
  天海卫物流中心 【移动 250 -50】 物流
  石关农贸集散地 【移动 -200 -150】 农贸
  金陵文化商街 【移动 450 -480】 文旅
  云岭采矿区 【移动 -850 -1150】 采矿
  摩配镇修配街 【移动 80 140】 维修
  风雪镇哨站 【移动 150 1200】 巡逻
  舟山渔业码头 【移动 700 -600】 渔业
  大昌市商贸区 【移动 -600 -800】 商贸
  长安武馆 【移动 -500 -280】 武馆杂役
  汴梁集市 【移动 -100 -450】 集市帮工
  玉门驿站 【移动 -1200 100】 驿站服务
  鹏城码头 【移动 350 -1450】 码头
  ━━━━━━━━━━━━━
  > 收入 = (基础+等级+熟练度)×运气×评级，另有连续奖励与特殊事件
  > 工时2-3分钟，单次90-350金币，S评级可达1050
  > 【经济系统】 更多赚钱方式 | 【帮助】 返回
