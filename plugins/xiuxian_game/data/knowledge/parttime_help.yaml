body: |
  ✨ 打工系统帮助 ✨
  赚钱、练熟练度、捡道具，一举三得
  ━━━━━━━━━━━━━
  📍 基本流程：
  1. 前往工作地点坐标
  2. 【打工】查看可用工作
  3. 【打工 工作名称】开始工作
  4. 【收工】获得奖励(含评级+掉落)
  ━━━━━━━━━━━━━
  📊 评级系统：
  收工时随机评级，倍率影响收入：
  🏆S(×3) ⭐A(×2) ✅B(×1.5) 📋C(×1) 💤D(×0.7)
  熟练度和运气越高，高评级概率越大
  ━━━━━━━━━━━━━
  🔰 熟练度系统：
  同一工作做多了会升级，收入加成提升：
  🔰学徒(0次) → ⭐熟手(5次+15%) → 🌟专家(15次+35%) → 👑大师(30次+60%)
  ━━━━━━━━━━━━━
  🎒 道具掉落：
  收工有概率获得材料、丹药、铭文碎片等
  熟练度越高，掉落率越高，稀有物品越多
  ━━━━━━━━━━━━━
  🏢 工作地点（共11个）：
  • 上京商业中心 (0,0) - 服务业
  • 荔湾镇工业区 (120,200) - 体力工作
  • 郸城娱乐街区 (120,120) - 轻松工作
  • 东郊物流中心 (390,50) - 物流工作
  • 北郊农贸集散地 (100,460) - 农贸
  • 金陵文化商街 (220,-350) - 文旅
  • 云岭采矿区 (-250,490) - 采矿
  • 摩配镇修配街 (80,140) - 维修
  • 风雪镇哨站 (-5,390) - 巡逻
  • 舟山渔业码头 (200,-200) - 渔业
  • 大昌市商贸区 (-400,-240) - 商贸
  ━━━━━━━━━━━━━
  📋 相关命令：
  【打工】 查看当前位置工作
  【打工 <工作名>】 开始工作
  【收工】 完成工作获得奖励
  【工作状态】 查看当前工作状态
  【工作地点】 查看所有工作地点
  【打工记录】 查看打工历史
  【打工统计】 查看打工数据+熟练度
  ━━━━━━━━━━━━━
  💰 收入 = (基础+等级+熟练度)×运气×评级 + 连续奖励 + 特殊事件
  💰 工资：90-350金币/次（评级S可达1050）
  ⏰ 工时：2-3分钟
