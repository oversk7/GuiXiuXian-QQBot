body: |
  ✨ 打工系统帮助 ✨
  新手赚钱玩法，快节奏高回报
  ━━━━━━━━━━━━━
  📍 基本流程：
  1. 前往工作地点坐标
  2. 【打工】查看可用工作
  3. 【打工 工作名称】开始工作
  4. 【收工】获得奖励
  ━━━━━━━━━━━━━
  🏢 工作地点：
  • 上京商业中心 (0,0) - 服务业
  • 荔湾镇工业区 (120,200) - 体力工作
  • 郸城娱乐街区 (120,120) - 轻松工作
  • 东郊物流中心 (390,50) - 物流工作
  ━━━━━━━━━━━━━
  📋 相关命令：
  【打工】 查看当前位置工作
  【打工 <工作名>】 开始工作
  【收工】 完成工作获得奖励
  【工作状态】 查看当前工作状态
  【工作地点】 查看所有工作地点
  【打工记录】 查看打工历史
  【打工统计】 查看打工数据
  ━━━━━━━━━━━━━
  💰 工作时长：2-3分钟
  💰 工资：60-180金币/次 + 特殊事件奖励
  ⏰ 限制：每小时最多10次，每次间隔1分钟
  💡 连续打工可获得额外奖励，运气值影响收入
