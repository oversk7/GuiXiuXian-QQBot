body: |
  🎲 福利娱乐 🎲
  签到、小游戏、休闲玩法
  ━━━━━━━━━━━━━
  🎯 每日福利：
  【签到】 每日签到领奖
  【月卡】 查看月卡状态和权益
  【邀请码】 邀请好友获奖励
  ━━━━━━━━━━━━━
  🎮 小游戏：
  【抽签 你的问题】 观音灵签占卜
  【答案之书 你的问题】 宇宙智慧
  【驾考题目】 随机驾考题
  【恶魔轮盘帮助】 PVP博弈游戏/人机对战
  【猜拳 石头/剪刀/布 金额】 猜拳鬼（仅限周六）
  【试炼列表】 互动剧情
  【已通关试炼】 查看已通关的试炼记录
  ━━━━━━━━━━━━━
  🎉 休闲功能：
  【每日一言】 励志名言
  【今天吃什么】 随机食谱
  【微博热搜】 实时热搜
  【吃掉 QQ号】 趣味GIF
  ━━━━━━━━━━━━━
  🎁 抽奖：
  【参与抽奖 ID】 参与抽奖
  【我的抽奖】 查看抽奖记录
  ━━━━━━━━━━━━━
  🏰 天灾玩法：
  【降临】 降临下位世界，成为第四天灾
  【镇守】 查看山寨状态
  【迎战】 与来犯英雄战斗
  【侦查】 消耗10天灾点查看英雄属性
  【天灾商店】 查看天灾点兑换福利
  ━━━━━━━━━━━━━
  💡 这些玩法不影响成长，纯粹娱乐
  💡 发送【娱乐系统】【抽奖系统】【天灾系统】看详细帮助
  💡 发送【赞助】查看月卡购买方式
