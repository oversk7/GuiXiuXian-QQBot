body: |
  福利娱乐：签到、小游戏、休闲玩法
  ━━━━━━━━━━━━━
  🎯 每日福利：
  【签到】 | 【签到日历】 本月记录 | 【月卡】 权益状态 | 【邀请码】 邀请好友
  ━━━━━━━━━━━━━
  🎮 小游戏：
  【抽签 你的问题】 观音灵签
  【起卦 你的问题】 六爻占卜，500金币；别名 六爻、卜卦
  【答案之书 你的问题】 | 【驾考题目】
  【恶魔轮盘帮助】 PVP博弈，也可人机
  【斗兽棋】 双人棋局带押注，税3%
    常用：斗兽棋 创建 / 加入 / 筹码 金币数 / 开始 / 走 虎 上 / 状态 / 规则
    旁观：斗兽棋下注 玩家名 金币数
  【猜拳 石头/剪刀/布 金额】 猜拳鬼，仅周六
  【试炼列表】 互动剧情 | 【已通关试炼】
  【随机人生】 人生重开，随机天赋生成人生图片；别名 人生重开、remake
  【人生选择】 自选天赋属性版
  【今日小猪】 抽今日猪格，每日结果固定
  ━━━━━━━━━━━━━
  🎉 休闲：
  【每日一言】 | 【今天吃什么】 | 【微博热搜】 | 【吃掉 QQ号】 趣味GIF
  ━━━━━━━━━━━━━
  🎁 抽奖：
  【参与抽奖 ID】 | 【我的抽奖】
  ━━━━━━━━━━━━━
  🏰 天灾：
  【降临】 降临下位世界 | 【镇守】 山寨状态 | 【迎战】 迎击英雄
  【侦查】 10天灾点看英雄属性 | 【天灾商店】 兑换福利
  ━━━━━━━━━━━━━
  以上玩法不产出修为；轮盘/斗兽棋/猜拳真金白银进出，量力而行
  详细帮助见【娱乐系统】【抽奖系统】【天灾系统】，月卡购买见【赞助】
