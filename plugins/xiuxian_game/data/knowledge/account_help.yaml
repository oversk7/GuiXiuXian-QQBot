body: |
  ✨ 账号管理系统 ✨
  支持多账号切换和管理
  ━━━━━━━━━━━━━
  📋 账号查看：
  【我的账号】 查看拥有的所有游戏账号
  【账号列表】 同上
  ━━━━━━━━━━━━━
  🔄 账号切换：
  【切换账号 <UID>】 切换到指定的游戏账号
  • 只能切换到自己拥有的账号
  • 每次只能激活一个账号
  • 切换后所有命令自动使用激活账号
  ━━━━━━━━━━━━━
  ✏️ 账号管理：
  【重命名账号 <UID> <新名称>】 设置账号备注名
  • 备注名最长32字符
  • 方便识别多个账号（如'主号'、'小号'）
  【购买绑定小号 <UID>】 使用赞助服务绑定一个小号（200诡烛/个）
  【确认绑定小号 <验证码>】 目标小号当前拥有者确认绑定
  • 主号发起后不会立刻扣费，确认通过后才扣除主号诡烛
  • 目标小号必须由当前拥有者确认，不能直接输入别人的UID绑定
  ━━━━━━━━━━━━━
  📊 历史记录：
  【转让历史】 查看账号买入/卖出历史
  【账号交易历史】 同上
  ━━━━━━━━━━━━━
  🔑 账号买卖（仅管理员）：
  如需买卖账号，请联系管理员操作
  管理员可使用以下命令：
  • 【生成转让密钥 <UID>】
  • 【接收账号 <转让密钥>】
  • 【取消转让 <UID>】
  ━━━━━━━━━━━━━
  💡 使用场景：
  • 多号管理：在一个QQ号下管理多个游戏角色
  • 快速切换：无需退出登录即可切换角色
