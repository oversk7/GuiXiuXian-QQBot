body: |
  一个QQ号下管理多个游戏角色，随时切换
  ━━━━━━━━━━━━━
  **📋 查看与切换**
  【我的账号】 我拥有的账号，与【账号列表】同义
  【切换账号 UID】 每次只激活一个，切换后所有指令走该账号
  ━━━━━━━━━━━━━
  **✏️ 管理**
  【重命名账号 UID 新名称】 备注名32字内，便于区分主号小号（改游戏内道号请用改名卡【改名】）
  【购买绑定小号 UID】 200诡烛/个
  【确认绑定小号 验证码】 由小号当前拥有者确认，通过后才扣费
  ━━━━━━━━━━━━━
  **🤝 借号（代肝授权）**
  【申请借号 UID】 借用人发起申请
  【同意借号 验证码】 号主确认；首次开通或换借用人扣500诡烛（从被借账号扣）
  【收回账号 UID】 号主随时强制收回，无需对方同意
  【归还账号 UID】 借用人主动归还
  ⚠️ 借出期间对方可自由处置账号资产，风险自担
  ━━━━━━━━━━━━━
  **📊 记录**
  【转让历史】 买入卖出历史，与 账号交易历史 同义
  ━━━━━━━━━━━━━
  > 账号转移只能通过【购买绑定小号】完成 | 【帮助】 返回
