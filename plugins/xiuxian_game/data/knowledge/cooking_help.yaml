body: |
  ✨ 烹饪与餐厅系统 ✨
  当老板开餐厅，雇佣厨师NPC自动经营赚钱
  ━━━━━━━━━━━━━
  🏪 餐厅管理：
  【创建餐厅】 开启你的美食帝国（初始免费）
  【餐厅】 查看餐厅状态和经营数据
  【餐厅升级】 提升餐厅等级（解锁更多功能）
  【扩张餐厅】 扩大面积（+5席位，提升客流上限）
  【升级厨房】 提升厨房等级（解锁高级食谱）
  【开店】 开始营业（每小时自动结算）
  【打烊】 暂停营业（节省食材和工资）
  ━━━━━━━━━━━━━
  👨‍🍳 厨师招募：
  【招募厨师】 随机生成4个候选（500金起，4小时冷却）
    ⏰ 冷却: 4小时(基础月卡-1h，高级月卡-2h)
    💰 费用递增: 当日首次500 → 第2次1000 → 第3次2000 → 第4次+5000
    ⌛ 候选有效期: 24小时后自动清除
    📍 招募受餐厅等级限制（Lv.1-2学徒，Lv.3-4帮厨...）
  【雇佣 编号】 雇佣选中的厨师
  【解雇 厨师名】 解雇厨师（不退签约费）
  【我的厨师】 查看已雇佣的厨师列表（含经验进度）
  【培训厨师 厨师名】 经验满后培训升级厨师
  ━━━━━━━━━━━━━
  🍳 烹饪制作：
  【烹饪 菜名 数量】 手动制作菜肴（需对应厨房等级）
  【食谱】 查看已学会的食谱
  【食谱图鉴】 查看所有食谱（含未解锁）
  【吃 食物名 数量】 食用食物（部分可恢复理智）
  ━━━━━━━━━━━━━
  📖 食谱获取方式：
  🟢 绿色食谱 - 香火商店（80香火/个）
  🔵 蓝色食谱 - 香火商店（250-300香火/个）
  🟣 紫色食谱 - 香火商店（800-1000香火/个）
  🟠 橙色食谱 - 香火商店（3000-4000香火/个）
  🌿 灵蔬食谱 - 食材来自灵田种植
  💡 香火商店：【交互 师徒使者 香火商店】查看
  💡 购买食谱：【交互 师徒使者 买食谱 食谱名】
  💡 使用食谱：【使用 食谱·菜名】学习烹饪
  ━━━━━━━━━━━━━
  📦 仓库与菜单管理：
  【补货 食材名 数量】 从背包转移食材到餐厅仓库
  【取货 食材名 数量】 从餐厅仓库取出食材到背包
  【餐厅仓库】 查看仓库中的食材（分类显示）
  【升级仓库】 扩大仓库容量（Lv.1-5，需对应餐厅等级）
    Lv.1→2: 50→100 | 餐厅Lv.2 | 5000金
    Lv.2→3: 100→180 | 餐厅Lv.4 | 20000金
    Lv.3→4: 180→300 | 餐厅Lv.6 | 80000金
    Lv.4→5: 300→500 | 餐厅Lv.8 | 200000金
  【设置菜单 菜名1 菜名2】 设置营业菜单（最多设置多个）
  【设置招牌菜 菜名】 设置招牌菜（营业售价+30%）
  【菜单】 查看当前营业菜单（显示售价和所需食材）
  ━━━━━━━━━━━━━
  📊 经营报表：
  【经营报表】 查看最近24小时收支统计
  【经营日志】 查看最近一次的详细经营日志（含随机事件）
  【餐厅排行】 查看餐厅声望排行榜
  ━━━━━━━━━━━━━
  🌟 菜肴品质：
  💀 黑暗料理 - 失败产物（吃了扣2理智）
  🍽️ 普通 - 售价1.0倍
  ✨ 精致 - 售价1.5倍
  🌟 完美 - 售价2.5倍（紫/橙菜肴附带buff）
  ━━━━━━━━━━━━━
  📈 厨师成长：
  厨师在营业中做菜可积累经验，经验满后可培训升级
    学徒→帮厨: 500经验 + 1000金
    帮厨→厨师: 1500经验 + 5000金
    厨师→大厨: 4000经验 + 20000金
    大厨→特级: 10000经验 + 80000金
  每次做菜: 成功+10经验 完美+25经验 失败+3经验
  ━━━━━━━━━━━━━
  💰 餐厅升级消耗金币和材料
  ━━━━━━━━━━━━━
  🎮 经营玩法：
  1️⃣ 【创建餐厅】学会5个家常菜食谱
  2️⃣ 【招募厨师】并【雇佣 编号】（建议先雇1个试试水）
  3️⃣ 准备食材：【钓鱼】获得鱼类，商店购买调料
  4️⃣ 【补货 鱼名 数量】将食材转移到餐厅仓库
  5️⃣ 【设置菜单 菜名1 菜名2】设定营业菜品
  6️⃣ 【开店】开始营业，每小时自动结算收入
  7️⃣ 定期【补货】保证食材充足，查看【经营报表】
  8️⃣ 赚钱后升级餐厅和厨房，解锁更多功能
  ━━━━━━━━━━━━━
  ⚠️ 重要提示：
  • 营业需要食材：从钓鱼、跑商、诡域获取
  • 必须设置菜单：厨师才知道做什么菜
  • 仓库有容量限制：初始50，可升级扩容
  • 厨师有工资：每小时自动扣除，打烊可节省
  • 声望影响客流：完美菜肴+5声望，缺货-2~5声望
  • 每小时自动结算：无需手动操作，挂机赚钱
  ━━━━━━━━━━━━━
  💡 新手快速入门：
  • 先用【钓鱼】获得鲤鱼、鲫鱼、草鱼等食材
  • 去系统商店购买基础调料（盐、酱油等）
  • 招募一个学徒厨师即可开始（成本低）
  • 【补货】转移食材，【取货】可取回未用食材
  • 【设置菜单】选择菜品，初期建议做白色家常菜
  • 积累资金后再升级餐厅和雇佣高级厨师
  • 用【餐厅仓库】和【菜单】查看当前状态
  ━━━━━━━━━━━━━
