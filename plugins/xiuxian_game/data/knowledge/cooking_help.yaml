body: |
  当老板开餐厅，雇佣厨师NPC自动经营赚钱
  ━━━━━━━━━━━━━
  **🏪 餐厅管理**
  【创建餐厅】 开启美食帝国（初始免费）
  【餐厅】 查看餐厅状态和经营数据
  【餐厅升级】 提升等级 | 【扩张餐厅】 扩大面积（+5席位）
  【升级厨房】 解锁高级食谱
  【开店】 开始营业 | 【打烊】 暂停营业（节省食材和工资）
  ━━━━━━━━━━━━━
  **👨‍🍳 厨师招募**
  【招募厨师】 随机4个候选（500金起，4h冷却，基础月卡-1h/高级月卡-2h）
  费用递增: 首次500 > 1000 > 2000 > +5000
  候选有效期24h | 招募受餐厅等级限制（Lv.1-2学徒，Lv.3-4帮厨...）
  【雇佣 编号】 雇佣厨师 | 【解雇 厨师名】 解雇厨师（不退签约费）
  【我的厨师】 厨师列表（含经验进度） | 【培训厨师 厨师名】 升级厨师
  ━━━━━━━━━━━━━
  **🍳 烹饪制作**
  【烹饪 菜名 数量】 手动制作菜肴（需对应厨房等级）
  【食谱】 已学食谱 | 【食谱图鉴】 所有食谱（含未解锁）
  【吃 食物名 数量】 食用食物（部分可恢复理智）
  ━━━━━━━━━━━━━
  **📖 食谱获取**
  白色（80-110香火） | 绿色（80香火） | 蓝色（250-300香火）
  紫色（800-1000香火） | 橙色（3000-4000香火） | 灵蔬（灵田种植）
  【交互 师徒使者 香火商店】 查看商店
  【交互 师徒使者 买食谱 食谱名】 购买
  【使用 食谱名】 学习烹饪
  ━━━━━━━━━━━━━
  **📦 仓库与菜单**
  【补货 食材名 数量】 背包转入仓库
  【取货 食材名 数量】 从餐厅仓库取出食材到背包
  【餐厅仓库】 查看食材 | 【升级仓库】 扩大容量（Lv.1-5）
  仓库容量: 50→100→180→300→500格（需对应餐厅等级）
  【设置菜单 菜名1 菜名2】 设置营业菜单
  【设置招牌菜 菜名】 招牌菜售价+30%
  【菜单】 查看当前营业菜单
  ━━━━━━━━━━━━━
  **📊 经营报表**
  【经营报表】 24h收支 | 【经营日志】 详细日志 | 【餐厅排行】 声望排行
  【菜品利润】 查看各菜品利润率和适合客群
  ━━━━━━━━━━━━━
  **🌟 菜肴品质**
  黑暗料理（失败，吃了扣2理智） | 普通（1.0x） | 精致（1.5x） | 完美（2.5x+buff）
  ━━━━━━━━━━━━━
  **👥 客流分层**
  普通食客（60%）只点白/绿菜 | 富商（30%）点绿/蓝/紫菜 | 贵宾（10%）只点紫/橙菜
  声望越高，富商和贵宾比例越大（最高各40%/20%）
  菜单需混搭覆盖各层客群，全上最贵的菜反而会亏
  客人吃不到菜扣声望：富商-5，普通食客-3，贵宾-2
  ━━━━━━━━━━━━━
  **📈 厨师成长**
  学徒>帮厨: 500经验+1000金 | 帮厨>厨师: 1500经验+5000金
  厨师>大厨: 4000经验+20000金 | 大厨>特级: 10000经验+80000金
  做菜经验: 成功+10 完美+25 失败+3
  ━━━━━━━━━━━━━
  **🎮 快速入门**
  1. 【创建餐厅】 学会5个家常菜食谱
  2. 【招募厨师】 并 【雇佣 编号】（先雇1个）
  3. 【钓鱼】 获得鱼类食材，去系统商店购买基础调料
  4. 【补货 鱼名 数量】 转移食材到仓库
  5. 【设置菜单 菜名】 设定菜品（初期建议做白色家常菜）
  6. 【开店】 营业，每小时自动结算
  赚钱后升级餐厅和厨房，解锁更多功能
  ━━━━━━━━━━━━━
  营业需食材（钓鱼/跑商/诡域） | 必须设置菜单
  仓库初始50可升级 | 厨师有工资（打烊可省）
  声望影响客流 | 每小时自动结算挂机赚钱
  ━━━━━━━━━━━━━
  > 【钓鱼系统】 获取食材 | 【帮助】 返回
