body: |
  雇厨师NPC经营餐厅，每小时自动结算，挂机赚钱
  ━━━━━━━━━━━━━
  **🏪 餐厅**
  【创建餐厅】 免费开店 | 【餐厅】 状态与经营数据
  【餐厅升级】 | 【扩张餐厅】 席位+5 | 【升级厨房】 解锁高级食谱
  【开店】 营业 | 【打烊】 停业省食材和工资
  ━━━━━━━━━━━━━
  **👨‍🍳 厨师**
  【招募厨师】 随机4个候选，有效期24小时；冷却4小时，基础月卡-1、高级月卡-2
  • 费用递增：500 → 1000 → 2000 → 5000起步
  • 候选档次受餐厅等级限制：Lv.1-2出学徒，Lv.3-4出帮厨…
  【雇佣 编号】 | 【解雇 厨师名】 签约费不退
  【我的厨师】 列表与经验 | 【培训厨师 厨师名】 升级
  • 晋升：学徒→帮厨 500经验+1000金；帮厨→厨师 1500+5000；
    厨师→大厨 4000+2万；大厨→特级 10000+8万
  • 做菜经验：成功+10，完美+25，失败+3
  ━━━━━━━━━━━━━
  **🍳 烹饪**
  【烹饪 菜名 数量】 手动做菜，需相应厨房等级
  • 手动烹饪固定70%成功率（厨师不参与），失败只耗50%食材
  【食谱】 已学 | 【食谱图鉴】 全部含未解锁
  【吃 食物名 数量】 部分食物可恢复理智
  • 品质：黑暗料理（失败，食用扣2理智） | 普通×1.0 | 精致×1.5 | 完美×2.5加buff
  ━━━━━━━━━━━━━
  **📖 食谱购买**
  白80-110香火 | 绿80 | 蓝250-300 | 紫800-1000 | 橙3000-4000 | 灵蔬菜谱同在香火商店
  【交互 师徒使者 香火商店】 → 【交互 师徒使者 买食谱 食谱名】 → 【使用 食谱名】 学会
  ━━━━━━━━━━━━━
  **📦 仓库与菜单**
  【补货 食材名 数量】 背包入仓 | 【取货 食材名 数量】 出仓
  【餐厅仓库】 | 【升级仓库】 容量50→100→180→300→500，需对应餐厅等级
  【设置菜单 菜名1 菜名2】 | 【菜单】 当前菜单
  【设置招牌菜 菜名】 售价+30%
  ━━━━━━━━━━━━━
  **👥 客流**
  普通食客65%点白/绿菜 | 富商28%点绿/蓝/紫 | 贵宾7%只点紫/橙（基础档）
  • 声望越高，富商贵宾占比越大，上限40%/20%
  • 菜单要混搭覆盖各层，全上贵菜反而亏
  • 客人点不到菜扣声望：富商-5，普通-3，贵宾-2
  ━━━━━━━━━━━━━
  **📊 报表**
  【经营报表】 24小时收支 | 【经营日志】 | 【餐厅排行】 声望榜
  【菜品利润】 利润率与适配客群
  ━━━━━━━━━━━━━
  **🎮 入门**
  【创建餐厅】 自带8个白色菜谱 → 【招募厨师】+【雇佣 编号】 先雇1个
  → 【钓鱼】 攒食材，食材铺买调料 → 【补货 鱼名 数量】
  → 【设置菜单 菜名】 先做白色家常菜 → 【开店】
  ━━━━━━━━━━━━━
  > 【钓鱼系统】 食材来源 | 【帮助】 返回
