body: |
  打工机制细节（供AI客服解答，均为当前实现的准确数值）
  **收入公式**
  • 收入 = (基础报酬 + 等级加成 + 熟练度加成) × 运气 × 评级倍率 + 连续奖励 + 特殊事件
  • 等级加成每级+3%；运气加成最多+50%；连续打工奖励=连续天数×10金，上限200
  • 评级倍率：S×3 / A×2 / B×1.5 / C×1 / D×0.7；熟练度越高越容易出S
  **岗位与门槛**
  • 岗位等级要求：安全屋建造/仓库/渔船/导游3级，咖啡店/配送/矿工/修车/采药5级，质检/镖局护卫8级，雪山巡逻10级
  • 部分地点也有等级门槛：云岭采矿区/长安武馆3级，风雪镇哨站/玉门驿站5级
  • 只能在大都会的15个固定打工点打工（诡域不可）；同时只能做一份工；工时2-3分钟
  **掉落**
  • 道具掉落率 = 12% + 熟练度等级×4% + 运气加成(至多8%)
  • 回生丹/凝魂丹需"专家"（15次）熟练度才进掉落池，升灵丹需"大师"（30次）
  • 各岗位有独立特殊事件表，含少量负收益事件（如收银出错-30金）
