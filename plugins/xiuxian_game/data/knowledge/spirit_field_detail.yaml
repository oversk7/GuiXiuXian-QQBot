id: "spirit_field_detail"
title: "灵田机制细节（AI客服专用）"
keywords:
  - 灵田细节
  - 灵田升级费用
  - 作物解锁
  - 作物生长时间
  - 偷菜罚金
  - 菜价时段
  - 浇水重置
body: |
  灵田机制细节（供AI客服解答，均为当前实现的准确数值）
  **升级与解锁**
  • 升级费：2级5000金 → 逐级上涨 → 9级250万金
  • 品质解锁：绿色作物需灵田3级、蓝5级、紫7级、橙9级
  • 作物生长时间：白2-3小时、绿4-5、蓝6-8、紫10-12、橙18-20
  **浇水**
  • 每次剩余时间-15%（乘法叠加，3次合计约-38.6%）；每日00:05重置次数
  **偷菜与守田**
  • 守田诡兽拦截率：冥犬30%/诡猫45%/鬼隼60%/噩梦狼75%/虚空蟒85%；拦截按每块独立判定
  • 罚金逐块递减100%/70%/40%/10%，总额不超过偷菜者身上金币；冥犬档罚金约1000
  • 守田判饥饿看宠物饱食度（<20拦截减半）
  **菜市场**
  • 每小时全服同价；时段倍率约0-6点×0.90 → 晚市18-22点×1.12最高；品质越高波动越大（橙0.45-1.90倍）
  **其他**
  • 收菜10%概率返1颗种子；一键种植 = min(空地数, 种子数)
  • 产量与加速在种植瞬间按阴宅等级锁定，种后升阴宅不影响本茬
  • 买种子单次上限99，买诡兽单次上限10
