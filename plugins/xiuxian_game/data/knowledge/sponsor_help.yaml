body: |
  ✨ 赞助系统 ✨
  支持游戏发展，获得作者的回馈
  ━━━━━━━━━━━━━
  💳 赞助类型：
  🔸 88诡烛 - 基础月卡（30天）
     • 修炼闭关效率+20%
     • 闭关上限增加至9小时，突破失败损失减少5%
     • 背包扩容+5格
     • 签到获得月卡宝箱*1，咒抗+5
     • 一键献祭、一键修复装备
  🔸 288诡烛 - 高级月卡（30天）
     • 修炼闭关效率+50%
     • 闭关上限增加至12小时，突破失败损失减少10%
     • 背包扩容+20格
     • 副本自动采集、装备一键修理、一键献祭
     • 签到获得月卡宝箱*3，咒抗+5
  🔸 10诡烛 - 背包永久扩容1格
  🔸 50诡烛 - 棺材钉
     • 持有者增加0.5%修炼效率，上限50%
  🔸 20诡烛 - 哭坟帽
     • 使用后直接获得1w怨念值
  🔸 改名卡 10诡烛 | 自定义称号 500诡烛
  🔸 绑定小号 200诡烛/个（需目标小号当前拥有者确认）
  🔸 1000诡烛 - 重启符
     • 重置所有已分配属性点，可重新分配
     • 装备加成、丹药加成、VIP加成均保留
  ━━━━━━━━━━━━━
  🐾 宠物饰品（诡烛专属）：
  🔸 150诡烛 - 虚空锁链/诡纹和服（紫色饰品）
  🔸 300诡烛 - 星辰发冠/银铃璎珞/流光羽衣（橙色饰品）
  💡 购买：【买饰品 <名称>】
  ━━━━━━━━━━━━━
  🕯️ 赞助特权（180诡烛/月≈18元）：
  🔸 闭关无上限 - 【购买闭关特权】
  🔸 远程仓库 - 【购买远程仓库】随地存取阴宅仓库
  🔸 鱼竿特权 - 【购买鱼竿特权】每次多钓2条
  🔸 全视之眼 - 【购买全视之眼】俯瞰显示诡域全图
  ━━━━━━━━━━━━━
  🕯️ 诡烛兑换比例1:10，【赞助商店】购买服务
  🔗 小号绑定流程：
  【购买绑定小号 <UID>】 主号发起申请，不立即扣费
  【确认绑定小号 <验证码>】 目标小号当前拥有者确认，确认后主号扣200诡烛并绑定
  📝 注意：支付时请备注UID + 联系方式（可选）
  💡 发送【月卡】查看当前权益
  ━━━━━━━━━━━━━
  🙏 感谢您对游戏的支持！
