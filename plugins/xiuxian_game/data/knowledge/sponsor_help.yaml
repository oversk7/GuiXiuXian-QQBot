body: |
  ✨ 赞助系统 ✨
  支持游戏发展，获得作者的回馈
  ━━━━━━━━━━━━━
  💳 赞助类型：
  🔸 88诡烛 - 基础月卡（30天）
     • 修炼闭关效率+20%
     • 闭关上限增加至9小时，突破失败损失减少5%
     • 背包扩容+5格
     • 签到获得月卡宝箱*1，咒抗+5
     • 一键献祭、一键修复装备
  🔸 288诡烛 - 高级月卡（30天）
     • 修炼闭关效率+50%
     • 闭关上限增加至12小时，突破失败损失减少10%
     • 背包扩容+20格
     • 副本自动采集、装备一键修理、一键献祭
     • 签到获得月卡宝箱*3，咒抗+5
  🔸 10诡烛 - 背包永久扩容1格
  🔸 50诡烛 - 棺材钉
     • 持有者增加0.5%修炼效率，上限50%
  🔸 20诡烛 - 哭坟帽
     • 使用后直接获得1w怨念值
  🔸 改名卡 10诡烛 | 自定义称号 500诡烛
  🔸 1000诡烛 - 重启符
     • 重置所有已分配属性点，可重新分配
     • 装备加成、丹药加成、VIP加成均保留
  ━━━━━━━━━━━━━
  🕯️ 诡烛兑换比例1:10，【赞助商店】购买服务
  📝 注意：支付时请备注UID + 联系方式（可选）
  💡 发送【月卡】查看当前权益
  ━━━━━━━━━━━━━
  🙏 感谢您对游戏的支持！
