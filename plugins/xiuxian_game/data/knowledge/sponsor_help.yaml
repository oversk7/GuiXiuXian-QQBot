body: |
  ━━━━━━━━━━━━━
  💳 月卡：
  · 基础月卡 88诡烛/30天
    修炼闭关效率+20%，闭关上限9小时
    突破失败保留75%修为（无月卡70%），背包+5格
    签到得月卡宝箱×1，咒抗+5
    一键献祭；一键修复免手续费（一键修复本身人人可用）
  · 高级月卡 288诡烛/30天
    修炼闭关效率+50%，闭关上限12小时
    突破失败保留80%修为，背包+20格
    签到得月卡宝箱×3，咒抗+5
    副本自动采集、一键献祭；一键修复免手续费
  ━━━━━━━━━━━━━
  🕯️ 道具：
  · 背包永久扩容1格 10诡烛
  · 棺材钉 50诡烛（修炼效率+0.5%/枚，上限50%）
  · 哭坟帽 20诡烛（使用得1w怨念）
  · 改名卡 10诡烛 | 自定义称号 500诡烛
  · 重启符 1000诡烛（重置属性点重新分配，装备/丹药/VIP加成保留）
  · 绑定小号 200诡烛/个 | 公会改名 200诡烛（需会长）
  · 圣诞裂隙 30诡烛/个
  ━━━━━━━━━━━━━
  🐾 宠物饰品，购买发【买饰品 <名称>】：
  · 紫色 150诡烛：虚空锁链/诡纹和服
  · 橙色 300诡烛：星辰发冠/银铃璎珞/流光羽衣
  ━━━━━━━━━━━━━
  ✨ 特权 180诡烛/月：
  · 闭关无上限 【购买闭关特权】
  · 远程仓库 【购买远程仓库】随地存取阴宅仓库
  · 鱼竿特权 【购买鱼竿特权】每次多钓2条不占次数，当日钓满50次保底1条传说鱼
  · 全视之眼 【购买全视之眼】俯瞰诡域全图
  ━━━━━━━━━━━━━
  🔗 小号绑定流程：
  【购买绑定小号 <UID>】 主号发起，不立即扣费
  【确认绑定小号 <验证码>】 小号当前拥有者确认，通过后主号扣200诡烛
  ━━━━━━━━━━━━━
  兑换比例 1元=10诡烛，服务在【赞助商店】购买
  诡烛仅通过赞助获得，游戏内不产出
  支付时请备注UID（联系方式可选）；当前权益发【月卡】查询
