body: |
  ━━━━━━━━━━━━━
  **🎁 礼物**
  【礼物商店】 礼物列表与今日剩余额度
  【买礼物 礼物名 数量】 品质越高越贵：白色日限20，红色日限1
  【赠礼 UID 礼物名 数量】 远程赠送，礼物消耗后转化为好感度和魅力
  • 同一人每天至多得500好感度；好感度上限10000，满5000可结婚结义
  【转移 UID 物品名 数量】 当面转移，须同一地点
  • 可转材料、装备、礼物（转移不消耗）；跑商商品走市场交易
  • 多件同名装备会列表供选择
  【送礼记录】 | 【收礼记录】 | 【好感度 UID】 不带UID看全部
  【魅力榜】 全服排行 | 【社交统计】
  ━━━━━━━━━━━━━
  **📋 关系查询**
  【师徒信息】 | 【婚姻信息】 | 【结义信息】
  ━━━━━━━━━━━━━
  **💒 结婚 · 月老（临安580,-650）或各集群社交代理**
  【交互 月老 求婚 UID】 | 【交互 月老 求婚申请】 收到的申请
  【交互 月老 同意求婚 UID】 | 【交互 月老 拒绝求婚 UID】 对方24小时冷却
  【交互 月老 撤销求婚 UID】 | 【交互 月老 离婚】 单方面，10万金币
  • 双方好感度5000且同一地点；申请7天未处理过期
  ━━━━━━━━━━━━━
  **🤝 结义 · 结义使者（长安-500,-280）或各集群社交代理**
  【交互 结义使者 结义 UID】 两人结义 | 【交互 结义使者 结义申请】
  【交互 结义使者 同意结义 UID】 | 【交互 结义使者 拒绝结义 UID】 对方24小时冷却
  【交互 结义使者 断义】 解除全部结义
  • 3-4人结义：全员在场立即结成，两两之间均需5000好感度
  ━━━━━━━━━━━━━
  **👨‍🏫 师徒 · 师徒使者（金陵450,-480）或各集群社交代理**
  【交互 师徒使者 拜师 UID】 需注册满24小时，对方高你50级或转数更高
  【交互 师徒使者 拜师申请】 | 【交互 师徒使者 同意拜师 UID】
  【交互 师徒使者 出师 UID】 3天冷却 | 【交互 师徒使者 逐出 UID】 3天冷却
  【交互 师徒使者 叛师】 有属性惩罚，7天冷却
  【交互 师徒使者 购买徒弟位】 500香火加1位 | 【交互 师徒使者 查询】
  • 徒弟升级师父得香火；每个徒弟使修炼效率-1%；申请7天过期
  ━━━━━━━━━━━━━
  **💬 NPC对话**
  【交互 NPC名字】 对话 | 【对话历史 NPC名字】 | 【观察】 本地NPC
  ━━━━━━━━━━━━━
  **💬 消息**
  【发消息 内容】 世界频道 | 【发消息 公会 内容】 | 【私信 UID 内容】
  【消息】 世界 | 【消息 私信】 | 【消息 公会】
  • 10级起可发言
  ━━━━━━━━━━━━━
  **🧧 红包**
  【发红包 金额 份数】 可加留言 | 【抢红包】 | 【红包记录】
  • 每群同时只有一个红包，不能抢自己的；10分钟过期退还
  • 金额随机分配；大额收累进散财税
  ━━━━━━━━━━━━━
  > 【帮助】 返回
