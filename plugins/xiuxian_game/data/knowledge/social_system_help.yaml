body: |
  送礼传情，结伴江湖，建立深厚的羁绊
  ━━━━━━━━━━━━━
  **🎁 礼物系统**
  【礼物商店】 查看可购买的礼物列表和剩余购买次数
  【买礼物 礼物名 数量】 购买好感度礼物
  • 礼物品质不同，价格和好感度加成不同
  • 每种礼物每日有购买数量限制：白色便宜（日限20），红色效果最强（日限1）
  【赠礼 UID 礼物名 数量】 赠送好感度礼物（远程，消耗型）
  • 好感度礼物消耗后转化为好感度和魅力值
  • 每人对另一人每天最多获得500好感度
  • 好感度上限10000，达到5000即可结婚/结义
  【转移 UID 物品名 数量】 当面转移物品
  • 必须在同一地点，物品实际转移到对方背包
  • 不能转移跑商商品（请使用市场交易）
  • 可转移材料、装备、好感度礼物（礼物不消耗）
  • 转移装备时如有多件同名装备，会显示列表供选择
  【送礼记录】 查看送礼历史
  【收礼记录】 查看收礼历史
  【好感度 UID】 查看好感度记录（不带参数查看全部）
  【魅力榜】 查看全服魅力值排行榜
  【社交统计】 查看社交系统统计信息
  ━━━━━━━━━━━━━
  **📋 查询指令（随时随地）**
  【师徒信息】 查看师徒关系
  【婚姻信息】 查看婚姻状态
  【结义信息】 查看结义关系
  ━━━━━━━━━━━━━
  **💒 结婚系统 - 找月老（临安580,-650）或各集群社交代理**
  【交互 月老 求婚 UID】 发起求婚申请
  【交互 月老 求婚申请】 查看收到的求婚申请
  【交互 月老 同意求婚 UID】 同意求婚
  【交互 月老 拒绝求婚 UID】 拒绝申请（对方24小时冷却）
  【交互 月老 撤销求婚 UID】 撤销申请
  【交互 月老 离婚】 单方面离婚（10万金币）
  • 需要双方好感度5000且在同一地点
  • 申请7天未处理自动过期
  ━━━━━━━━━━━━━
  **🤝 结义系统 - 找结义使者（长安-500,-280）或各集群社交代理**
  【交互 结义使者 结义 UID】 发起结义申请（2人）
  【交互 结义使者 结义申请】 查看结义申请
  【交互 结义使者 同意结义 UID】 同意结义
  【交互 结义使者 拒绝结义 UID】 拒绝申请（对方24小时冷却）
  【交互 结义使者 断义】 解除所有结义关系
  • 3-4人结义：所有人在场立即建立（每两人之间需5000好感度）
  ━━━━━━━━━━━━━
  **👨‍🏫 师徒系统 - 找师徒使者（金陵450,-480）或各集群社交代理**
  【交互 师徒使者 拜师 UID】 发起拜师申请
  • 需注册满24小时，对方需境界高于你50级或转数更高
  【交互 师徒使者 拜师申请】 查看拜师申请
  【交互 师徒使者 同意拜师 UID】 同意拜师
  【交互 师徒使者 出师 UID】 让徒弟出师（3天冷却）
  【交互 师徒使者 逐出 UID】 将徒弟逐出师门（3天冷却）
  【交互 师徒使者 叛师】 主动叛离师门（属性惩罚，7天冷却）
  【交互 师徒使者 购买徒弟位】 500香火扩展1个徒弟位
  【交互 师徒使者 查询】 查看师徒状况
  • 香火获取：徒弟升级时师父获得香火
  • 每个徒弟使修炼效率-1%，拜师申请7天后自动过期
  ━━━━━━━━━━━━━
  **💬 NPC对话系统**
  【交互 NPC名字】 与NPC进行对话
  【对话历史 NPC名字】 查看与NPC的对话历史
  【观察】 查看当前位置的所有NPC
  ━━━━━━━━━━━━━
  **💬 消息系统**
  【发消息 内容】 发布世界消息
  【发消息 公会 内容】 发送公会消息
  【私信 UID 内容】 给指定玩家发送私信
  【消息】 查看世界频道
  【消息 私信】 查看私信箱
  【消息 公会】 查看公会频道
  💡 需要达到10级才能发言
  ━━━━━━━━━━━━━
  **🧧 红包系统**
  【发红包 金额 份数】 发送金币红包（可加留言）
  【抢红包】 抢当前群的红包
  【红包记录】 查看本群最近红包记录
  • 每群同时只有一个活跃红包，不能抢自己的红包
  • 红包10分钟过期自动退还
  • 大额红包收取散财税（累进税率），金额随机分配
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
