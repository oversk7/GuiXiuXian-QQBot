body: |
  ✨ 社交系统帮助 ✨
  送礼传情，结伴江湖，建立深厚的羁绊
  ━━━━━━━━━━━━━
  🎁 礼物系统：
  【礼物商店】 查看可购买的礼物列表和剩余购买次数
  【买礼物 <礼物名> [数量]】 购买好感度礼物
    示例: 买礼物 红玫瑰 10
    • 礼物有不同品质,价格和好感度加成不同
    • 白色品质便宜(日限20),红色品质效果最强(日限1)
    • 每种礼物每日有购买数量限制,品质越高限制越严格
    • 商店会显示每种礼物的今日剩余购买次数
  【赠礼 UID 礼物名 [数量]】 赠送好感度礼物(远程,消耗型)
    示例: 赠礼 123 红玫瑰 10
    • 好感度礼物会被消耗,转化为好感度和魅力值
    • 每人对另一人每天最多获得500好感度
    • 好感度上限10000,达到5000即可结婚/结义
  【转移 UID 物品名 [数量]】 当面转移物品
    示例: 转移 456 回春散 5
    示例: 转移 123 白骨护甲 1
    • 必须在同一地点,物品实际转移到对方背包
    • 不能转移跑商商品(请使用市场交易)
    • 可以转移材料、装备、好感度礼物(礼物不消耗)
    • 转移装备时如有多件同名装备,会显示列表供选择
    • 装备显示升阶、耐久、宝石等详细属性,确保转移正确装备
  【送礼记录】 查看送礼历史
  【收礼记录】 查看收礼历史
  【好感度 [UID]】 查看与指定玩家的好感度
  【好感度】 不带参数查看所有好感度记录
  【魅力榜】 查看全服魅力值排行榜
  【社交统计】 查看社交系统统计信息

  ━━━━━━━━━━━━━
  == 查询指令(随时随地) ==
  【师徒信息】 查看师徒关系
  【婚姻信息】 查看婚姻状态
  【结义信息】 查看结义关系
  【好感度 UID】 查看与某人的好感度

  == 变更操作 ==
  💡 月老在临安(580,-650)，结义使者在长安(-500,-280)，师徒使者在金陵(450,-480)
  💡 各集群主城均有【社交代理】可代办所有社交事务

  💒 结婚系统 - 找月老(临安)或社交代理
  【求婚申请流程】
  【交互 月老 求婚 UID】 向心爱的人发起求婚申请
    • 需要双方好感度5000
    • 双方必须在同一地点
  【交互 月老 求婚申请】 查看收到的求婚申请列表
  【交互 月老 同意求婚 UID】 同意对方的求婚申请
  【交互 月老 拒绝求婚 UID】 拒绝申请(对方24小时冷却)
  【交互 月老 撤销求婚 UID】 撤销自己发出的申请
  【交互 月老 离婚】 单方面离婚(10万金币)
    • 申请7天未处理自动过期
    • 被拒绝后24小时内不能再次申请

  🤝 结义系统 - 找结义使者(长安)或社交代理
  【2人结义申请流程】
  【交互 结义使者 结义 UID】 向兄弟发起2人结义申请
    • 需要双方好感度5000
    • 双方必须在同一地点
    • 对方同意后才能结为结义兄弟
  【交互 结义使者 结义申请】 查看收到的结义申请列表
  【交互 结义使者 同意结义 UID】 同意对方的结义申请
  【交互 结义使者 拒绝结义 UID】 拒绝申请(对方24小时冷却)
  【交互 结义使者 撤销结义 UID】 撤销自己发出的申请

  【3-4人结义(所有人在场立即建立)】
  【交互 结义使者 结义 UID1 UID2...】 与多位兄弟结义(3-4人)
    • 每两人之间需要5000好感度
    • 所有人必须在同一地点
    • 立即建立结义关系,无需等待确认
  【交互 结义使者 断义】 解除所有结义关系
    • 申请7天未处理自动过期
    • 被拒绝后24小时内不能再次申请

  👨‍🏫 师徒系统 - 找师徒使者(金陵)或社交代理
  【拜师申请流程】
  【交互 师徒使者 拜师 UID】 向某玩家发起拜师申请
    • 徒弟主动申请,师父确认收徒
    • 需注册满24小时,对方需境界高于你50级或转数更高
  【交互 师徒使者 拜师申请】 查看收到的拜师申请列表
  【交互 师徒使者 同意拜师 UID】 同意某人的拜师申请
  【交互 师徒使者 拒绝拜师 UID】 拒绝申请(对方24小时冷却)
  【交互 师徒使者 撤销拜师 UID】 撤销自己发出的申请

  【师父功能】
  【交互 师徒使者 出师 UID】 让徒弟正常出师(3天冷却)
  【交互 师徒使者 逐出 UID】 将徒弟逐出师门(3天冷却)

  【徒弟功能】
  【交互 师徒使者 叛师】 主动叛离师门(属性惩罚,7天冷却)

  【其他】
  【交互 师徒使者 购买徒弟位】 500香火扩展1个徒弟位
  【交互 师徒使者 查询】 查看师徒状况
  香火获取：徒弟升级时师父获得香火
  ⚠️ 徒弟一转后每级贡献固定少量香火（建议出师收新徒）
  注意：每个徒弟使修炼效率-1%
  注意：拜师申请7天后自动过期

  💝 好感度提升
  【赠礼 UID 礼物名】 送礼增加好感度
    • 每天对同一人上限500好感度

  ━━━━━━━━━━━━━
  💬 NPC对话系统：
  【交互 <NPC名字> [对话内容]】 与NPC进行对话
  【对话历史 <NPC名字>】 查看与NPC的对话历史
  【观察】 查看当前位置的所有NPC

  💬 消息系统：
  【发消息 <内容>】 发布世界消息
  【发消息 公会 <内容>】 发送公会消息
  【私信 <UID> <内容>】 给指定玩家发送私信
  【消息】 查看世界频道
  【消息 私信】 查看私信箱
  【消息 公会】 查看公会频道
  💡 需要达到10级才能发言（防止恶意刷屏）

  🏆 排行榜：
  【魅力榜】 查看全服魅力值排行榜
  【社交统计】 查看社交系统统计信息

  🧧 红包系统：
  【发红包 <金额> <份数>】 发送金币红包
  【发红包 <金额> <份数> <留言>】 带留言的红包
  【抢红包】 抢当前群的红包
  【红包记录】 查看本群最近红包记录
    • 每群同时只有一个活跃红包
    • 不能抢自己的红包
    • 红包10分钟过期自动退还
    • 大额红包收取散财税（累进税率）
    • 金额随机分配，手气决定一切
