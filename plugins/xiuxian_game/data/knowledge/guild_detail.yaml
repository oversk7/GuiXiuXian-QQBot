body: |
  公会机制细节（供AI客服解答，均为当前实现的准确数值）
  **捐献与升级**
  • 捐献1000金=1积分，每日上限100积分（10万金封顶）；积分同时1:1转公会经验（吃经验神龛倍率）
  • 升级：经验=1000×5^(级-1)（≤5级），6级起=62.5万+25万×(级-5)（级指当前等级，5升6需62.5万、6升7需87.5万）；另耗资金5万×当前等级；仅会长可升
  • 资金库有上限：基础10万，资金金库1-5级提升至50万/100万/200万/500万/1000万，超出部分捐献直接蒸发
  **人数与职位**
  • 人数上限 = 10+(等级-1)×5；副会长最多3人，核心成员最多为上限的50%
  **建筑等级效果（满级值）**
  • 训练场修为+5%~50%（1-10级）；丹房日产4~20、品质随级提升；传送阵范围50~500格、每日1~2次
  • 公会仓库30~800格（每格堆100）；铸器坊折扣2%~16%；淬灵台成功率/折扣各1%~8%；经验神龛1.1x~2.0x
  • 全局上限：锻造折扣25%、升阶成功率+15%、升阶折扣20%
  • 公会10级后建筑可破限升到公会等级；11级起追加蓝/紫材料，16级起要橙材料
  **基地与势力范围**
  • 基地只能设在大都会、坐标±2000内、不可与他会重叠、一经设置不可更改
  • 势力范围默认3×3，用公会扩张令（仅会长）扩张，上限20×20
  **任务与丹房**
  • 日常：签到100积分/捐献30/诡域探索20格50/诡域10胜100；周常各300；任务积分同时计入个人贡献
  • 兑换丹药积分价 = max(1, 丹药商店价÷100)；高级丹池有跨池产出概率
  **不活跃清理**
  • 会长30天未登录自动由他人继承；全员不活跃公会解散
