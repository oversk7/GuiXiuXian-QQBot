body: |
  斗法天梯机制细节（供AI客服解答，均为当前实现的准确数值）
  **积分（凶名）计算**
  • ELO制：前30场定位赛K=40波动大，常规K=24，道君段（≥2350）K=16
  • 守方是对称扣分：残魂被打输了，掉的分与攻方涨的分等量——"下线也会掉分"是正常机制，可【斗法天梯 关闭】隐匿残魂减少被匹配
  • 守方胜利同样得100魂晶，也能触发自己的每日首胜+200
  **匹配规则**
  • 先找±150分内对手，找不到扩到±300；排除道侣/结义/师徒关系户；30天未活跃玩家不进匹配池
  • "同一对手6小时冷却"是软限制：池子空了会回退匹配到冷却中的对手
  • 全服第一无人可匹配时直接白给胜场奖励（不涨分）
  **商店与结算**
  • 斗法令每日限购5张、单次最多5张；灵气补给单次上限20；洗词石单次上限10
  • 本赛季至少打过1场才计入排行与结算；排行榜只显示前50、限同区服
  • 赛季奖励按区服独立排名发放；称号带赛季后缀（如「诡道煞君·第3赛季」）
