body: |
  🔰 新手上路 🔰
  注册角色，迈出修仙第一步
  ━━━━━━━━━━━━━
  👤 注册与角色：
  【注册 男/女】 创建角色（系统自动生成道号）
  【面板】 查看自己的状态
  【改名 新名字】 改名（需改名卡）
  【改性别 男/女】 修改性别
  ━━━━━━━━━━━━━
  🧘 修炼成长：
  【修炼】 获取经验（5分钟冷却）
  【闭关】 离线挂机修炼
  【出关】 结束闭关
  【突破】 经验满后升级境界
  【突破 镇厄】 消耗怨念确保突破成功
  ━━━━━━━━━━━━━
  📊 属性加点：
  【加点 属性 点数】 分配属性点
    属性：力/体/敏/智/运/防
  【加点帮助】 查看详细加点推荐
  ━━━━━━━━━━━━━
  🎯 每日必做：
  【签到】 每日签到领奖励
  【修炼】 保持修炼不断提升
  【闭关】 睡前闭关不浪费时间
  ━━━━━━━━━━━━━
  💡 新手任务会引导你完成基础操作
  💡 30级前突破100%成功，大胆突破！
  💡 发送【新手指引】查看完整成长路线
