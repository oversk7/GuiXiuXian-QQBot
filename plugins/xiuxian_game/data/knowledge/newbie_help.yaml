body: |
  ━━━━━━━━━━━━━
  👤 注册与角色：
  【注册】 创建角色，点蓝字选区服和性别，道号自动生成
  【面板】 角色状态
  【改名 新名字】 需改名卡 | 【改性别 男/女】
  ━━━━━━━━━━━━━
  🗺️ 先学会走路：
  这个世界靠坐标移动，走到地方才能做事
  【观察】 你在哪，周围有什么
  【附近地点】 附近100格内可去的地方
  【前往 地点名】 自动导航 | 【地图】 重要地点坐标
  ━━━━━━━━━━━━━
  🧘 修炼：
  【修炼】 获取经验，5分钟冷却
  【闭关】 离线挂机 → 【出关】 结算收益
  【突破】 提升境界，30级前必定成功
  【突破 镇厄】 消耗怨念，确保成功
  ━━━━━━━━━━━━━
  📊 加点：
  【加点 属性 点数】 力/体/敏/智/运/防
  【加点帮助】 加点推荐
  ━━━━━━━━━━━━━
  🎯 每日：
  【签到】 → 【修炼】 → 睡前【闭关】
  ━━━━━━━━━━━━━
  新手任务会引导基础操作；完整成长路线见【新手指引】
