body: |
  ━━━━━━━━━━━━━
  ⚰️ 出棺之后：
  完成序章就已攒够首次突破经验。
  【突破】 → 【加点 力 5】 → 【面板】，先看见自己的成长，再去【观察】周围。
  【新手任务】（别名【新手进度】）随时查看当前目标和下一条指令，离开后也能接着做。
  点击蓝字会填入指令，记得再发送。
  ━━━━━━━━━━━━━
  👤 注册与角色：
  【注册】 创建角色，点蓝字选区服和性别，道号自动生成
  注册后发送【睁开眼】进入序章剧情，【反抗】或【装死】应对遭遇，通关送白骨护甲和首次突破经验
  【面板】 角色状态
  【改名 新名字】 需改名卡 | 【改性别 男/女】
  ━━━━━━━━━━━━━
  🗺️ 行走世界：
  这个世界靠坐标移动，走到地方才能做事
  【观察】 你在哪，周围有什么
  【附近地点】 附近300格内可去的地方（限大都会）
  【前往 地点名】 自动导航 | 【地图】 重要地点坐标
  ━━━━━━━━━━━━━
  🧘 修炼：
  【修炼】 获取经验，5分钟冷却
  【闭关】 离线挂机 → 【出关】 结算收益
  【突破】 提升境界，一区30级前必定成功（二区25级）；失败不清零且有保底
  【突破 镇厄】 消耗怨念，确保成功
  ━━━━━━━━━━━━━
  📊 加点：
  【加点 属性 点数】 力/体/敏/智/运/防
  【加点帮助】 加点推荐
  ━━━━━━━━━━━━━
  🎯 每日：
  【签到】 → 【修炼】 → 睡前【闭关】（无月卡上限7小时）
  首次签到送改名卡；30级以下加错点可【免费洗点】
  ━━━━━━━━━━━━━
  【新手任务帮助】 查看引导说明；完整成长路线见【新手指引】
