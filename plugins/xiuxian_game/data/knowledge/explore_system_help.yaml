body: |
  依赖敏捷进行坐标移动，探索世界，与NPC交互
  ━━━━━━━━━━━━━
  **🗺️ 地图导航**
  【地图】 查看所有重要地点坐标
  【可视化地图】 生成地图图片
  【附近地点】 查看附近300格内的地点和阴宅
  【导航 地点名】 快速导航到指定地点
  【导航 x y】 坐标导航
  💡 长途导航途中可能遭遇随机事件（奇遇/伏击等）
  【查找 NPC名】 查询NPC位置
  【中断导航】 取消当前导航
  ━━━━━━━━━━━━━
  **🏛️ 地点和NPC**
  【观察】 查看当前位置信息（NPC、玩家、阴宅）
  【地点详情】 查看当前地点的详细信息
  【交互 NPC名称】 与NPC交互（支持关键词）
  【NPC列表】 查看当前位置的所有NPC
  💡 每城都有**驿丞**（查城市信息）和**情报贩子**（查物价行情）
  💡 **社交代理**（求婚/结义/拜师）在各集群主城均有
  ━━━━━━━━━━━━━
  **⚒️ 工坊锻造**
  【锻造列表】 查看全部装备及可锻造城镇
  【配方 装备名】 查看锻造配方
  【锻造 装备名】 在工坊附近（≤3格）或公会基地铸器坊锻造
  【工匠配方一览 城市名】 远程查看城市配方
  ━━━━━━━━━━━━━
  **👥 社交功能**
  【最近活动 UID】 查看指定玩家的最近上线时间
  【附近玩家】 查看附近玩家
  【发消息 内容】 发送到世界频道
  【发消息 公会 内容】 发送到公会频道
  【私信 UID 内容】 给指定修士发送私信
  【消息 频道】 查看对应频道（世界/私信/系统/公会，可加页码）
  ━━━━━━━━━━━━━
  **🔍 其他**
  【本周主题】 查看本周都市怪谈主题
  ━━━━━━━━━━━━━
  💡 敏捷属性影响移动速度和导航效率
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
