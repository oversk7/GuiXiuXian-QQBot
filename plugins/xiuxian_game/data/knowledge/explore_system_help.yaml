body: |
  ━━━━━━━━━━━━━
  **🗺️ 地图与导航**
  【地图】 地图图片与重要地点坐标（【可视化地图】同义）
  【附近地点】 300格内的地点和阴宅（限大都会）
  【导航 地点名】 或 【导航 x y】 前往目标 | 【中断导航】
  【查找 NPC名】 NPC位置
  • 敏捷决定移动速度；长途导航可能触发奇遇、伏击等随机事件
  • 途中罕见红字灵异事件「保险鬼」，每趟导航最多一次；遭遇后九成概率当场死亡，停在遇险处并中止导航
  ━━━━━━━━━━━━━
  **🏛️ 地点与NPC**
  【观察】 当前位置的NPC、玩家、阴宅
  【地点详情】 当前地点详情 | 【NPC列表】 本地NPC
  【交互 NPC名称】 与NPC交互，支持关键词
  • 每城有驿丞（城市信息）和情报贩子（物价行情）
  • 求婚/结义/拜师找各集群主城的社交代理
  ━━━━━━━━━━━━━
  **⚒️ 工坊锻造**
  【锻造列表】 全部装备及可锻造城镇 | 【配方 装备名】
  【锻造 装备名】 需在工坊3格内或公会铸器坊
  【工匠配方一览 城市名】 远程查看
  ━━━━━━━━━━━━━
  **👥 社交**
  【附近玩家】 | 【最近活动 UID】 玩家最近上线时间
  【发消息 内容】 世界频道 | 【发消息 公会 内容】 公会频道
  【私信 UID 内容】 | 【消息 频道】 世界/私信/系统/公会，可加页码
  ━━━━━━━━━━━━━
  **🔍 其他**
  【休息】 现实世界恢复生命法力，每小时限10次；诡域内需在驿站格且仅恢复生命
  【本周主题】 本周都市怪谈主题
  ━━━━━━━━━━━━━
  > 【帮助】 返回
