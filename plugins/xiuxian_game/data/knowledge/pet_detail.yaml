body: |
  宠物机制细节（供AI客服解答，均为当前实现的准确数值）
  **获取与数量**
  • 种子商店价格：冥犬3000金、诡猫1万金、鬼隼3万金（【买诡兽 名称】）；噩梦狼、虚空蟒不出售，仅诡域宝箱极低概率掉落
  • 每人最多10只；昵称最长12字；第一只自动设为当前伙伴；守田中的宠物不能放生，须先召回
  **等级与进化**
  • 等级上限100，升满累计需150万经验
  • 进化门槛：白→绿 Lv10+诡兽精魄×3+怨念20万；绿→蓝 Lv20+×5+50万；蓝→紫 Lv35+×8+120万；紫→橙 Lv50+×12+300万
  • 进化100%成功无失败；进化后已升等级按新稀有度成长值整体重算
  • 每级成长（攻/防/血）：白2/1/10，绿3/2/15，蓝5/3/25，紫8/5/40，橙12/8/60
  **加成机制**
  • 只有"当前伙伴"提供被动加成；总加成 = 等级累积属性 × 心情倍率
  • 心情倍率：心情0/20/40/60/80/100 → ×0.5/0.7/0.85/1.0/1.1/1.2；饰品加成是固定值不吃心情倍率
  **状态衰减（为什么掉好感）**
  • 每小时饱食-2、心情-1；饱食<20时心情3倍速下降；饱食=0时每小时好感-2，心情<20再额外-1
  **喂食与互动收益**
  • 怨念喂食：+30饱食，前99次每次+5经验+3心情；菜肴：+50饱食，心情/经验+10×品质系数（白1~橙5），不计每日次数
  • 单次喂食数量上限99
  • 化形前【对话】也+1好感+2心情；化形后AI按对话情绪加减好感(+2~-1)与心情(+4~-6)，骂宠物会扣
  • 宠物每日最多主动赠礼1次
  **好感度**
  • 上限1000；等级：0陌生/50熟悉/150信赖/300亲密/500羁绊/800心意相通；化形需等级50+好感100
  **饰品**
  • 白/绿/蓝饰品用金币，紫/橙饰品用诡烛；同槽位换装旧饰品自动回背包
  **守田**
  • 需先有灵田，同时只能1只守田；拦截率按种族：冥犬30%/诡猫45%/鬼隼60%/噩梦狼75%/虚空蟒85%
