body: |
  ━━━━━━━━━━━━━
  **👤 面板**
  【面板 UID】 玩家面板，UID可省略
  【完整面板 UID】 含区服、战力、注册时间
  【战力】 完整属性 | 【战力说明】 属性作用 | 【加点帮助】
  ━━━━━━━━━━━━━
  **🏆 排行榜**
  【排行榜】 总览
  【财富榜】 现金+存款+投资 | 【修为榜】 | 【幸运榜】 | 【探索榜】
  【敏捷榜】 | 【小游戏榜】 | 【魅力榜】 收礼积累
  ━━━━━━━━━━━━━
  **🎯 成就**
  【成就】 第1页（【成就列表】同义） | 【成就 页码】 每页15个
  【成就 成就名】 详情
  • 涵盖修炼/成长/战斗/装备/财富/探索/忠诚系列
  • 奖励金币、怨炁、属性点，随难度递增
  • 达成自动解锁，诡域击杀也计入
  ━━━━━━━━━━━━━
  **📝 注册与改名**
  【注册】 创建角色，点蓝字选区服和性别，道号自动生成
  • 也可直接发【注册 2区 男】一步完成
  【改名 新名字】 需改名卡，首次签到获得
  【改性别 男】 修改性别
  【邀请码】 我的邀请码与奖励规则 | 【绑定邀请码 码】 | 【邀请状态】 奖励发放进度
  ━━━━━━━━━━━━━
  **🔒 隐私**
  【隐藏活动】 隐藏活动记录 | 【显示活动】 恢复公开
  ━━━━━━━━━━━━━
  > 【帮助】 返回
