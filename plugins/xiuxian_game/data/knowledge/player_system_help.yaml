body: |
  查看玩家信息、排行榜，注册角色和改名
  ━━━━━━━━━━━━━
  **👤 玩家面板**
  【面板 UID】 查看玩家面板（可加UID）
  【完整面板 UID】 完整面板（含区服+战力+注册时间）
  【战力】 查看完整属性 | 【战力说明】 属性作用
  【加点帮助】 查看加点指南
  ━━━━━━━━━━━━━
  **🏆 排行榜**
  【排行榜】 所有排行榜总览
  【财富榜】 财富榜（含现金+存款+投资） | 【修为榜】 | 【幸运榜】 | 【探索榜】
  【敏捷榜】 | 【小游戏榜】 | 【魅力榜】 魅力（收礼获得）
  ━━━━━━━━━━━━━
  **🎯 成就系统**
  【成就】 查看所有成就（第1页，【成就列表】 同义）
  【成就 页码】 指定页（每页15个）
  【成就 成就名】 查看成就详情
  ━━━━━━━━━━━━━
  **🏅 成就类型**
  基础成就: 修炼、战斗、探索等新手引导
  高难度成就: 百战不殆、千人斩、财富自由等
  特殊成就: 周年纪念、终身成就等限定
  ━━━━━━━━━━━━━
  **📊 成就分类**
  修炼/成长/战斗/装备/财富/探索/忠诚系列
  奖励: 金币、怨炁（经验）、属性点，随成就难度递增
  自动触发，达成即解锁，诡域击杀也计入
  ━━━━━━━━━━━━━
  **📝 注册与改名**
  【注册】 创建角色，点蓝字选区服和性别（道号自动生成）
  💡 也可直接发送【注册 2区 男】一步完成
  【改名 新名字】 改名（需改名卡，首次签到获得）
  【改性别 男】 修改角色性别
  【邀请码】 查看我的邀请码和分级奖励说明 | 【绑定邀请码 码】 绑定
  【邀请状态】 查看邀请奖励发放状态
  ━━━━━━━━━━━━━
  **🔒 隐私设置**
  【隐藏活动】 隐藏活动记录 | 【显示活动】 恢复公开
  ━━━━━━━━━━━━━
  > 【签到】 首次获改名卡 | 【帮助】 返回
