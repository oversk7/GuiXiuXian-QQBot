body: |
  ✨ 玩家系统帮助 ✨
  查看玩家信息、排行榜，注册角色和改名
  ━━━━━━━━━━━━━
  【面板 [UID]】 查看指定玩家面板
  【完整面板 [UID]】 查看完整面板（含战力+注册时间）
  【排行榜】 查看所有排行榜总览
  【财富榜】 查看财富榜（含现金+存款+投资）
  【修为榜】 查看修为榜
  【幸运榜】 查看幸运榜
  【探索榜】 查看探索榜
  【敏捷榜】 查看敏捷榜
  【小游戏榜】 查看小游戏积分排行
  【魅力榜】 查看魅力值排行(通过收礼获得)
  【战力】 查看自身完整属性
  【战力说明】 查看各项战斗属性的作用
  【加点帮助】 查看基本属性加点指南
  ━━━━━━━━━━━━━
  🏆 成就系统：
  【成就】或【成就列表】 查看所有成就（第1页）
  【成就 <页码>】 查看指定页成就（每页15个）
  【成就 <成就名>】 查看成就详情
  ━━━━━━━━━━━━━
  🎯 成就类型：
  • 基础成就：修炼、战斗、探索等新手引导成就
  • 高难度成就：百战不殆、千人斩、财富自由等挑战性成就
  • 特殊成就：周年纪念、终身成就等限定成就
  ━━━━━━━━━━━━━
  📊 成就分类：
  • 修炼系列：修炼次数相关成就
  • 成长系列：等级提升相关成就
  • 战斗系列：战斗胜利和击杀数相关成就
  • 装备系列：装备获取和强化相关成就
  • 财富系列：金币累计相关成就
  • 探索系列：地点探索相关成就
  • 忠诚系列：登录天数相关成就
  ━━━━━━━━━━━━━
  💰 成就奖励：
  • 金币：直接获得金币奖励
  • 怨炁：获得大量经验值
  • 属性点：自由分配的属性点
  • 奖励随成就难度递增，高难度成就奖励丰厚
  ━━━━━━━━━━━━━
  ✨ 自动触发：
  • 修炼、战斗、探索等行为自动记录统计
  • 达成条件后自动解锁并发放奖励
  • 在诡域击杀怪物也会计入成就统计
  • 🎂 老玩家专属周年成就等你解锁！
  ━━━━━━━━━━━━━
  【注册 男/女】 注册角色（系统自动生成道号）
  【改名 <新名字>】 改名（需消耗改名卡，首次签到可获得）
  【改性别 <男/女>】 修改角色性别
  【邀请码】 查看我的邀请码和分级奖励说明
  【绑定邀请码 <邀请码>】 绑定好友邀请码获得奖励
  【邀请状态】 查看邀请奖励发放状态
  ━━━━━━━━━━━━━
  🔒 隐私设置：
  【隐藏活动】 隐藏自己的活动记录，不被他人查询
  【显示活动】 恢复公开活动记录
  ━━━━━━━━━━━━━
  💡 快速注册：发送【注册 男】或【注册 女】，系统自动生成道号
  💡 分步注册：发送【注册】，按提示选择性别即可
  💡 首次签到可获得改名卡，用【改名 新名字】修改道号
  💡 不知道怎么加点？发送【加点帮助】查看详细指南
