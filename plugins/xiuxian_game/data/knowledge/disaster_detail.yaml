body: |
  天灾系统（下位世界）机制细节（供AI客服解答，均为当前实现的准确数值）
  **天灾点奖励**
  • 1-5波每波5点，6-10波10点，11-20波20点，21波以上30点；失败不扣天灾点，只封印+波次-3
  **英雄强度**
  • 英雄等级 = 玩家等级×(0.6+波次×0.03)，20波时约为玩家1.2倍，21波后增长放缓
  • 11波起换成八系勇者（剑/盾/枪/弓/棍/炮/书/镰），带暴击/连击/反击/吸血/穿透等特殊属性
  • 21波以上附加1个强化词缀，31波以上2个
  **商店细节**
  • 修炼加速（2小时）50点：修炼效率+50%
  • 战意加持30点：下一场全属性+10%，10分钟内有效、迎战后消耗、不可叠加
  • 称号「第四天灾」200点，一次性购买
  **封印与侦查**
  • 封印期间不能侦查；解封（40点解封令）后下一波英雄2小时后才到，不是立即开战
  • 英雄未到时侦查是"推演预览"，仍扣10点且数值仅供参考
