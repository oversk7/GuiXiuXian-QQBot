body: |
  管理员发起，玩家参与
  ━━━━━━━━━━━━━
  **👥 玩家指令**
  【参与抽奖 抽奖ID】 参与指定抽奖活动
  【抽奖详情 抽奖ID】 查看抽奖详情和中奖名单
  【我的抽奖】 查看我参与的抽奖记录
  ━━━━━━━━━━━━━
  **🔧 管理员指令**
  【发起抽奖 物品名 中奖人数 每人数量】 发起抽奖活动（可加等级范围和-描述）
  【开奖 抽奖ID】 进行开奖并发放奖品
  【取消抽奖 抽奖ID】 取消抽奖并退还奖品
  ━━━━━━━━━━━━━
  **📝 说明**
  • 发起抽奖时会从管理员背包扣除奖品
  • 可设置最低/最高等级要求，防止小号参与
  • 可添加活动描述，用 - 开头（如：-新年特别活动）
  • 参与人数少于中奖人数时，全部参与者中奖
  • 参与人数多于中奖人数时，随机抽取中奖者
  • 发起人不能参与自己发起的抽奖
  ━━━━━━━━━━━━━
  **💡 示例**
  发起抽奖 棺材钉 10 10
  发起抽奖 金币 5 1000 50 120
  发起抽奖 棺材钉 5 20 -新年福利活动
  参与抽奖 1
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
