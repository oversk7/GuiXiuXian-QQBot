id: "lottery_system_help"
title: "抽奖系统"
help_command: "抽奖系统"
help_aliases:
  - 抽奖帮助
keywords:
  - 抽奖系统
  - 参与抽奖
  - 抽奖详情
  - 我的抽奖
  - 发起抽奖
  - 开奖
  - 取消抽奖
  - 中奖人数
  - 最低等级
  - 活动描述
  - 管理员
  - 奖品
body: |
  管理员发起，玩家参与
  ━━━━━━━━━━━━━
  **👥 玩家**
  【参与抽奖 抽奖ID】 | 【抽奖详情 抽奖ID】 详情与中奖名单
  【我的抽奖】 参与记录
  ━━━━━━━━━━━━━
  **🔧 管理员**
  【发起抽奖 物品名 中奖人数 每人数量】 可加等级范围和 -描述
  【开奖 抽奖ID】 开奖发奖 | 【取消抽奖 抽奖ID】 取消并退奖品
  ━━━━━━━━━━━━━
  **📝 规则**
  • 奖品从发起人背包扣除；发起人不能参与自己的抽奖
  • 可限最低/最高等级，防小号
  • 参与人数不足中奖人数时全员中奖，超出则随机抽取
  ━━━━━━━━━━━━━
  **✏️ 示例**
  发起抽奖 棺材钉 10 10
  发起抽奖 金币 5 1000 50 120
  发起抽奖 棺材钉 5 20 -新年福利活动
  参与抽奖 1
  ━━━━━━━━━━━━━
  > 【帮助】 返回
