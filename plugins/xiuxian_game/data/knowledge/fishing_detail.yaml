body: |
  钓鱼机制细节（供AI客服解答，均为当前实现的准确数值）
  • 钓点判定：距六城商人坐标8格内算该城钓点
  • 钓点稀有度加成：绿×1.25、蓝×1.5、紫/橙×2.0（白鱼不加成）；钓出精品时30%概率替换为该城专属鱼
  • 运气加成：稀有度越高受运气影响越大（橙系数3.0/紫2.0/蓝1.0/绿0.5），60幸运附近收益最明显
  • 数量：白鱼1-3条、绿鱼1-2条、蓝及以上固定1条（紫/橙永不加量）
  • 打捞杂物概率8%，消耗一次钓鱼次数；部分杂物可【献祭】换怨念
  • 鱼价：白40-70金 → 橙2500-4500金，六城专属鱼约450金；商人收购价为当日售价75%-85%，每日±30%波动
  • 桂鱼/黄花鱼/三文鱼/金枪鱼/石斑鱼/龙鱼等是食谱材料，开餐厅的别急着卖
  • 鱼竿特权（赞助180诡烛/月）：每次多钓2条不占次数，当日钓满50次保底送1条橙鱼
