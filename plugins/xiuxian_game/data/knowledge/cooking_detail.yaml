body: |
  餐厅经营机制细节（供AI客服解答，均为当前实现的准确数值）
  **厨师五档数值**
  • 成功率：学徒70% / 帮厨80% / 厨师88% / 大厨94% / 特级98%；速度2-6道/时；时薪20-800金；签约费500-10万
  • 招募抽中权重60/25/10/4/1（档次越高越难抽）；擅长菜系匹配时+10%成功率、+15%完美率
  • 一次招募只能雇1人，雇后其余候选清空；招募费递增次日重置回500
  **客流与收入**
  • 客流 = min(席位, (5+2×餐厅等级)×(1+声望/2000))±10%；收入另乘(1+声望/5000)
  • 客群比例随声望升档：基础65/28/7，声望满档最高40/40/20（富商上限40%、贵宾20%）
  • 每小时25%概率触发随机经营事件（共9种，有正有负）
  **声望（上限10000）**
  • 满意+1/+3/+8（按客群），完美菜+5，黑暗料理-2；点不到菜扣声望：普通-3/富商-5/贵宾-2
  **升级费用**
  • 厨房升级：2万/8万/30万/80万金（需餐厅Lv3/5/7/9）
  • 餐厅升级5万起，Lv9→10需600万+材料；扩张席位2000金起每次翻倍，席位上限50
  • 厨师数量上限 = 1 + 餐厅等级÷2
  **食用效果**
  • 完美菜带buff可回理智；橙菜有永久加成（如金龙盛宴幸运+5）；凤凰涅槃鱼+200气血60分钟
  • 手动烹饪固定70%成功率、完美率仅2%；单次烹饪/吃上限99
