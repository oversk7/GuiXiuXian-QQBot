body: |
  每重诡域是独立的11x11空间，无限向深处重叠
  ━━━━━━━━━━━━━
  **🌀 机制**
  • 从第1重起逐重解锁：击败当前重的诡异，才能进下一重
  • 诡异等级约为深度×5，上下浮动2级
  • 换层/传送消耗理智，每10重+1点（格内移动不耗）；**理智归零当场疯狂身亡**
  ━━━━━━━━━━━━━
  **🚪 操作**
  【传送 N层诡域】（或【进入】） 进入指定深度，耗1咒抗；域内跳转免咒抗
  【诡域】 探索进度与可达深度
  【上】【下】【左】【右】 移动 | 【上一层】【下一层】 切换相邻层
  【探索】 触发当前格子事件
  【一键嗑药】 自动服药回满生命理智
  【返回】 回表世界，恢复满状态
  ━━━━━━━━━━━━━
  **🎯 收益**
  • 材料分层：深度越深掉落品质越高
  • 无伤连杀：每满5杀返还理智，受伤、死亡或返回现实清零
  • 进层自动感知本重精英数量（精英掉装备与铭文）
  • 每10层一个宝箱：【探索宝箱】 待领清单 | 【领取宝箱】 一键领取
  • 200级后诡异带暴击、连击、反击、抗暴
  ━━━━━━━━━━━━━
  **🔍 其他**
  【俯瞰 N层诡域】 完整小地图
  【使用 扫荡令】 扫荡当前诡域，得经验和材料
  ━━━━━━━━━━━━━
  > 【帮助】 返回
