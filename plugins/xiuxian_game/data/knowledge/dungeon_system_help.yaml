body: |
  ✨ 无限诡域探索系统帮助 ✨
  探索无限重叠的诡域，每重都是独立的10x10空间
  ━━━━━━━━━━━━━
  🌀 诡域机制：
  • 无限重叠：支持无限重扩展，适应任何等级
  • 逐重解锁：击败当前重诡异解锁更深诡域
  • 诡异等级：深度×5（±2波动）
  • 理智消耗：每10重+1点
  ━━━━━━━━━━━━━
  🚪 基础操作：
  【进入 N层诡域】 进入指定深度（需逐重解锁）
  【诡域】 查看探索进度和可访问深度
  【上|下|左|右】 在诡域内移动
  【上一层|下一层】 快速切换相邻层级
  【传送 N层诡域】 诡域内跳转到已解锁层（免咒抗）
  【返回】 穿越回表世界并满状态
  【探索】 探索当前格子的事件
  ━━━━━━━━━━━━━
  🎯 诡域特色：
  • 🔓 逐重解锁：只能进入已探索深度+1
  • 🚀 自由跳转：诡域内可直接跳转到已打过的任意层
  • 🎲 材料分层：不同深度掉落不同品质材料
  • 🔥 特殊属性：200级后诡异拥有暴击、连击、反击、抗暴
  • 🎁 宝箱奖励：每10、20、30...层可领取宝箱
  ━━━━━━━━━━━━━
  🔍 其他功能：
  【俯瞰 N层诡域】 查看诡域完整小地图
  【使用 扫荡令】 扫荡当前诡域获得经验和材料
  【探索宝箱】 查看可领取的宝箱
  【领取宝箱】 一键领取所有宝箱
  ━━━━━━━━━━━━━
  💡 从第1重开始，逐重击败诡异解锁更深诡域
