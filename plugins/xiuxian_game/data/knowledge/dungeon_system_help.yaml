body: |
  每重诡域是独立的10x10空间，无限向深处重叠
  ━━━━━━━━━━━━━
  **🌀 机制**
  • 从第1重起逐重解锁：击败当前重的诡异，才能进下一重
  • 诡异等级约为深度×5，上下浮动2级
  • 理智消耗每10重+1点
  ━━━━━━━━━━━━━
  **🚪 操作**
  【进入 1层诡域】 进入指定深度
  【诡域】 探索进度与可达深度
  【上】【下】【左】【右】 移动 | 【上一层】【下一层】 切换相邻层
  【传送 N层诡域】 跳转已解锁层，免咒抗
  【探索】 触发当前格子事件
  【返回】 回表世界，恢复满状态
  ━━━━━━━━━━━━━
  **🎯 收益**
  • 材料分层：深度越深掉落品质越高
  • 每10层一个宝箱：【探索宝箱】 待领清单 | 【领取宝箱】 一键领取
  • 200级后诡异带暴击、连击、反击、抗暴
  ━━━━━━━━━━━━━
  **🔍 其他**
  【俯瞰 N层诡域】 完整小地图
  【使用 扫荡令】 扫荡当前诡域，得经验和材料
  ━━━━━━━━━━━━━
  > 【帮助】 返回
