body: |
  ✨ 背包系统 ✨
  管理物品，使用道具，查看图鉴
  ━━━━━━━━━━━━━
  🎒 背包管理：
  【背包】 查看所有物品
  【背包 类别】 查看指定类别物品
    可选类别：消耗品、材料、商品、丹药、装备、宝石、礼物、调味品、菜肴、食谱
  【整理背包】 自动整理背包空间
  ━━━━━━━━━━━━━
  💊 物品使用：
  【使用 物品名 数量】 使用消耗品/丹药
    示例：使用 回春散 1
  【一键嗑药】 自动使用治疗药品至满血满蓝
  【耐药性】 查看丹药每日使用限制
  ━━━━━━━━━━━━━
  🎭 材料转换（欺骗系统）：
  【欺骗 源材料 目标材料 数量】 用3倍同品质材料转换
    机制：消耗源材料×3，支付目标材料价值×10手续费
    限制：只能转换同品质材料
  【欺骗帮助】 查看欺骗系统详细说明
  ━━━━━━━━━━━━━
  📖 图鉴系统：
  【图鉴】 查看已收集的物品图鉴
  【图鉴 物品名】 查看物品详细信息
  【提交物品图片 物品名 图片URL】 提交物品图片（需等级>50）
    • 玩家可以为物品提供图片，共同完善图鉴
  ━━━━━━━━━━━━━
  📦 背包容量：
    • 基础容量：100格
    • 基础月卡：+5格
    • 高级月卡：+20格
    • 永久扩容：每次+5格（可重复购买）
  ━━━━━━━━━━━━━
  💡 装备不占用背包容量
  💡 鱼类存入专属鱼栏，不占背包
  💡 商品类物品仅用于跑商交易
  💡 部分丹药有耐药性限制，请注意
