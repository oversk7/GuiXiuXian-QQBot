body: |
  ━━━━━━━━━━━━━
  **🎒 背包**
  【背包】 全部物品 | 【背包 类别】 按类别筛选
  • 类别：消耗品/材料/商品/丹药/装备/宝石/礼物/调味品/菜肴/食谱
  【背包模式】 充实/精简两种展示 | 【整理背包】 自动整理
  ━━━━━━━━━━━━━
  **💊 使用**
  【使用 物品名 数量】 如：使用 回春散 1
  【一键嗑药】 自动嗑回春散/凝神草至满血满蓝
  【耐药性】 丹药每日使用上限
  【丢弃 物品名 数量】 丢弃物品
  ━━━━━━━━━━━━━
  **🎭 材料转换**
  【欺骗 源材料 目标材料 数量】 限同品质
  • 消耗源材料×3，另付目标材料价值×10手续费
  【欺骗帮助】 详细规则
  ━━━━━━━━━━━━━
  **📖 图鉴**
  【图鉴 物品名】 物品详情（需带名称，全量百科无需拥有）
  【提交物品图片 物品名 图片URL】 补充图鉴配图，需51级起
  ━━━━━━━━━━━━━
  **📦 容量**
  • 基础80格；基础月卡+5，高级月卡+20；【背包扩容 N】永久扩容10诡烛/格，上限1000格
  • 每格堆叠上限100个，超出自动拆格；【背包 类别 页码】翻页
  • 【扫荡设置 蓝 橙】只留蓝、橙扫荡材料；【扫荡设置 蓝以上】保留蓝、紫、橙；【扫荡设置 无】不保留任何材料
  • 设置长期保存，【扫荡设置 全部】恢复全部；不保留材料时经验与扫荡消耗照常计算
  • 扫荡新掉落按品质从高到低入包，不会自动清理已有物品；背包已满时仍需先腾空间
  • 装备与铭文不占格；鱼入专属鱼栏；商品类仅用于跑商
  ━━━━━━━━━━━━━
  > 【帮助】 返回
