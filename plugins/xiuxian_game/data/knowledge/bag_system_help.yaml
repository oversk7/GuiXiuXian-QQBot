body: |
  ━━━━━━━━━━━━━
  **🎒 背包**
  【背包】 全部物品 | 【背包 类别】 按类别筛选
  • 类别：消耗品/材料/商品/丹药/装备/宝石/礼物/调味品/菜肴/食谱
  【背包模式】 充实/精简两种展示 | 【整理背包】 自动整理
  ━━━━━━━━━━━━━
  **💊 使用**
  【使用 物品名 数量】 如：使用 回春散 1
  【一键嗑药】 自动嗑治疗药至满血满蓝
  【耐药性】 丹药每日使用上限
  ━━━━━━━━━━━━━
  **🎭 材料转换**
  【欺骗 源材料 目标材料 数量】 限同品质
  • 消耗源材料×3，另付目标材料价值×10手续费
  【欺骗帮助】 详细规则
  ━━━━━━━━━━━━━
  **📖 图鉴**
  【图鉴】 已收集图鉴 | 【图鉴 物品名】 物品详情
  【提交物品图片 物品名 图片URL】 补充图鉴配图，需50级以上
  ━━━━━━━━━━━━━
  **📦 容量**
  • 基础100格；基础月卡+5，高级月卡+20，永久扩容每次+5可叠加
  • 装备不占格；鱼入专属鱼栏；商品类仅用于跑商
  ━━━━━━━━━━━━━
  > 【帮助】 返回
