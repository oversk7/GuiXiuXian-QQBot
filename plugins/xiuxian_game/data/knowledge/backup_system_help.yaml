body: |
  ✨ 数据库备份系统帮助 ✨
  自动备份游戏数据，确保数据安全（仅限超级用户）
  ━━━━━━━━━━━━━
  🔄 自动备份：每小时自动执行一次
  📦 保留策略：只保留最近3个备份文件
  📁 备份位置：项目根目录

  🛠️ 管理命令（超级用户专用）：
  【手动备份】 立即创建数据库备份
  【备份状态】 查看备份文件列表和状态
  【恢复备份 <文件名>】 从指定备份恢复数据库
  ━━━━━━━━━━━━━
  ⚠️ 恢复操作具有破坏性，请谨慎使用！
  💡 备份文件命名格式：game_backup_YYYYMMDD_HHMMSS.db
