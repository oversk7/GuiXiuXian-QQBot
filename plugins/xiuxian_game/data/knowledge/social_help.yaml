body: |
  社交公会：送礼、结婚、师徒、公会
  ━━━━━━━━━━━━━
  🎁 送礼：
  【礼物商店】 → 【买礼物 礼物名 数量】 → 【赠礼 UID 礼物名 数量】
  【好感度 UID】 好感度进度
  ━━━━━━━━━━━━━
  💒 结婚 · 结义 · 师徒：
  月老在临安，结义使者在长安，师徒使者在金陵，或找各集群社交代理
  【交互 月老 求婚 UID】 | 【交互 结义使者 结义 UID】 | 【交互 师徒使者 拜师 UID】
  好感度满5000可结婚、结义
  ━━━━━━━━━━━━━
  🕯️ 香火商店：
  【香火商店】 兑换列表 | 【买食谱 食谱名】 香火换食谱
  ━━━━━━━━━━━━━
  🏰 公会：
  【公会列表】 | 【加入公会 ID】 申请 | 【我的公会】
  【公会建筑】 建筑加成 | 【捐献金币 金额】 换积分
  ━━━━━━━━━━━━━
  💬 消息：
  【发消息 内容】 世界频道 | 【发消息 公会 内容】
  【私信 UID 内容】 | 【消息】 世界 | 【消息 私信/系统/公会】
  ━━━━━━━━━━━━━
  🧧 红包：
  【发红包 金额 份数】 | 【抢红包】 | 【红包记录】
  ━━━━━━━━━━━━━
  详细帮助见【社交系统】【公会系统】
