body: |
  👥 社交公会 👥
  结伴江湖，建立羁绊
  ━━━━━━━━━━━━━
  🎁 送礼系统：
  【礼物商店】 查看礼物列表
  【买礼物 礼物名 数量】 购买礼物
  【赠礼 UID 礼物名 数量】 送礼
  【好感度 UID】 查看好感度
  ━━━━━━━━━━━━━
  💒 结婚/结义/师徒：
    月老在临安，结义使者在长安，师徒使者在金陵，或找各集群社交代理
  【交互 月老 求婚 UID】 求婚
  【交互 结义使者 结义 UID】 结义
  【交互 师徒使者 拜师 UID】 拜师
  ━━━━━━━━━━━━━
  🕯️ 香火商店：
  【香火商店】 查看香火兑换列表
  【买食谱 食谱名】 用香火购买烹饪食谱
  ━━━━━━━━━━━━━
  🏰 公会：
  【公会列表】 查看所有公会
  【加入公会 ID】 申请加入
  【我的公会】 查看公会信息
  【公会建筑】 查看建筑加成
  【捐献金币 金额】 捐献获积分
  ━━━━━━━━━━━━━
  💬 消息：
  【发消息 内容】 发送到世界频道
  【发消息 公会 内容】 发送到公会频道
  【私信 UID 内容】 私信玩家
  【消息】 查看世界频道
  【消息 私信/系统/公会】 查看对应频道
  ━━━━━━━━━━━━━
  🧧 红包：
  【发红包 金额 份数】 发红包
  【抢红包】 抢当前群红包
  【红包记录】 查看红包记录
  ━━━━━━━━━━━━━
  💡 好感度5000可结婚/结义
  💡 发送【社交系统】【公会系统】看详细帮助
