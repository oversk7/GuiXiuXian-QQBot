id: "equip_detail"
title: "装备强化机制细节（AI客服专用）"
keywords:
  - 升阶消耗
  - 升阶失败
  - 升阶降级
  - 装备损毁
  - 镶嵌费用
  - 拆卸风险
  - 铭文掉落率
  - 洗炼消耗
  - 修理费用
  - 词缀规则
body: |
  装备强化机制细节（供AI客服解答，均为当前实现的准确数值）
  **升阶**
  • 消耗：普通装备每次需2件同名同阶装备合成，稀有（无配方）装备只需自身1件；金币1.5万（1阶）~约3亿（10阶），公会折扣上限20%
  • 材料：低/中/高/极品升阶石对应1-3/4-6/7-9/10阶；稀有装备按稀有度追加魂魄结晶/恶魔之心/时光尘埃等
  • 失败后果：1-3阶无损，4-8阶降1阶，9-10阶降2阶；7/8/9/10阶另有2%/3%/5%/8%概率装备直接损毁
  • 稳定水晶+20%成功率；幸运最高再+20%；淬灵台等公会加成上限+15%
  • 已穿戴、锁定、挂牌/拍卖中的装备不能升阶
  **镶嵌与拆卸**
  • 镶嵌 = 镶嵌锤×1+1000金；拆卸 = 拆卸凿×1+500金，15%概率镶嵌物损坏、5%装备损伤，可加稳定水晶保护
  • 镶嵌物合成2合1，成功率同升阶表，失败可能降阶或丢失；稳定水晶+20%且失败保底返还
  **铭文**
  • 只有精英怪掉铭文：怪≤60级不掉，61-100级3%、101-200级4%、200级以上5%（受幸运加成）；碎片另8%
  • 高级铭文占40%（其中紫80/橙20，橙需150级以上怪）；≥3000级精英怪掉铭文时1%为仙品
  **词缀与洗炼**
  • T2词缀只出现在蓝色及以上装备；橙装必4条词缀
  • 洗炼每次消耗洗词石×1，类型不变只重随数值
  **修理**
  • 费用 = 每点耐久修理价×缺失耐久；【一键修理】月卡免手续费、非月卡+20%（单件修理无手续费差异）
  **穿戴**
  • 基础最多5件；VIP装备玄墟双衍玉可+2件至7件
