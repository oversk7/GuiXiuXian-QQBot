body: |
  【战力】 查看15项战斗属性的原始值、开战生效值与硬上限溢出。
  原始值经硬上限限制后得到生效值；超出硬上限的部分才是这里的溢出。生效值不等于对特定对手的触发概率。
  ━━━━━━━━━━━━━
  【属性分解】 查看基础（初始、加点及历史未归类部分）、丹药/奖励（含洗髓及本轮烹饪幸运）、VIP成长、装备含宝石、伙伴、临时增益，并补充词缀与套装。
  加点、永久丹药、VIP基底可被存量比例装备放大；各件比例按同一基数相加。升阶倍率为1+0.2×阶数，+10为3倍；装备固定值、宠物等分层计算，不能把整张面板一起乘倍数。
  战斗中触发的铭文、体质、装备效果不折算进面板。
  ━━━━━━━━━━━━━
  硬上限：连击60、反击80、灵爆70、穿透100；暴击率、命中、闪避、抗暴、抗连、抗反均为500。
  暴击力无面板硬上限，基础暴击伤害1.5倍，每点有效暴击力再加0.1倍。
  有效暴击率=max(0,暴击率−对手抗暴)，最终概率不超过100%；有效暴击力=max(0,暴击力−对手抗暴)。
  命中概率=命中−敌方闪避，限制在10%～100%。暴击率、命中超过100但未超硬上限的部分，仍可抵消对手抗暴、闪避。
  连击触发共2～4击，追加击以基础攻击的85%计算，并非所有攻击效果都会重复。
  吸血率按伤害回血；回复率每回合按最大生命回血；真伤率、定身率是触发概率；穿透是减少防御的比例。
  ━━━━━━━━━━━━━
  【换装预览 穿上编号 [卸下编号]】 编号见【装备栏】，满槽须指定卸下编号；只预览，不穿脱。比较基础属性、战斗生效值与溢出、套装变化，不将触发机制折成统一战力分。
  【冥返信息】（别名：冥返预览）查看当前时点面板前后、永久/VIP保留与本轮成长重置，保留规则见【修炼系统】。
