body: |
  世界BOSS机制细节（供AI客服解答，均为当前实现的准确数值）
  • 每周三、周六20:00刷新与结算；讨伐次数每日0点重置，每天3次
  • BOSS血量近乎无限，不存在"击杀"——比的是结算周期内的累计伤害
  • 按转数分6个段位（0转凡尘→9转以上无上），各段位独立排名、同等奖励，新人老玩家互不挤占
  • 奖励为6档深渊宝箱，凡造成伤害都有参与奖宝箱，段内排名越高档次越高
  • 讨伐消耗的是理智（MP）而非生命；理智被侵蚀归零则重伤
  • 闪避可完全躲开BOSS侵蚀；防御对侵蚀只有15%效益——防侵蚀优先堆闪避
  • 每期BOSS有随机弱点（暴击/穿透/连击之一），触发弱点伤害×1.5；存活满30回合总伤害×1.2
