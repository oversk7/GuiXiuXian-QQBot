body: |
  自由定价，即买即走，你的地盘你做主
  ━━━━━━━━━━━━━
  **🏪 开摊/收摊**
  【摆摊】 在当前城镇开摊（消耗摊位令，持续24h）
  【收摊】 手动收摊，未售物品退回背包
  【我的摊位】 查看摊位状态和商品
  ━━━━━━━━━━━━━
  **📦 上架/下架**
  【上摊 物品名 单价 数量】 上架物品（自由定价）
  【下摊 序号】 下架商品
  ━━━━━━━━━━━━━
  **🛍️ 查看/购买**
  到城镇【观察】可查看当地所有摊位
  【摊位 UID】 查看某人摊位（需同城镇）
  【买摊 摊主UID 序号 数量】 购买（需同城镇）
  ━━━━━━━━━━━━━
  **✏️ 摊位装饰**
  【摊位名 名字】 自定义摊位名（最多16字）
  【吆喝 一句话】 设置吆喝语（最多32字）
  ━━━━━━━━━━━━━
  **💰 税率说明**
  基础税率：成交额x3%
  溢价附加税（防洗金）：超系统估价5倍部分+15%，超20倍部分+30%
  ━━━━━━━━━━━━━
  **📋 规则**
  • 必须在城镇安全区开摊
  • 消耗1张摊位令（商店购买/打工掉落），持续24小时
  • 基础5格 | 基础月卡+2格 | 高级月卡+5格
  • 跑商商品不可上摊
  • 到期自动收摊，物品退回背包
  • 装备以实例交易（含升阶、宝石、词缀）
  ━━━━━━━━━━━━━
  **💡 与其他交易方式的区别**
  • 挂牌市场：系统定价（底价~8倍限制），自动撮合
  • 拍卖行：竞价模式，需等待出价
  • 个人摊位：完全自由定价，即买即走，需到城镇现场
  ━━━━━━━━━━━━━
  > 【经济市场】 更多交易方式 | 【帮助】 返回
