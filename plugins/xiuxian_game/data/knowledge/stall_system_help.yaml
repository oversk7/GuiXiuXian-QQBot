body: |
  🏪 个人摊位系统帮助 🏪
  自由定价、即买即走的玩家交易渠道
  ━━━━━━━━━━━━━
  📋 基本命令：
  【摆摊】 在当前城镇开摊（消耗1张摊位令，持续24小时）
  【收摊】 手动收摊，未售物品退回背包
  【上摊 物品名 单价 [数量]】 上架物品（完全自由定价）
  【下摊 序号】 下架指定商品
  【我的摊位】 查看摊位状态和商品列表
  【摊位名 名称】 自定义摊位名（最多16字）
  【吆喝 内容】 设置吆喝语（最多32字）
  ━━━━━━━━━━━━━
  🛍️ 逛摊和购买：
  【逛摊】 浏览当前城镇所有摊位
  【逛摊 城镇名】 浏览指定城镇的摊位
  【搜摊 物品名】 全服搜索物品（按价格升序）
  【摊位 UID】 查看指定玩家的摊位
  【买摊 摊主UID 序号 [数量]】 直接购买
  ━━━━━━━━━━━━━
  💰 税率说明：
  基础税率：成交额的3%（固定）
  溢价附加税（防洗金）：
  • 单价超过系统估价5倍的部分：额外15%
  • 单价超过系统估价20倍的部分：额外30%
  ━━━━━━━━━━━━━
  📋 摊位规则：
  • 必须在城镇安全区才能开摊
  • 每次开摊消耗1张摊位令
  • 摊位持续24小时，到期自动收摊
  • 基础5格位，基础月卡+2格，高级月卡+5格
  • 跑商商品不可上摊
  • 装备以实例交易（含升阶、宝石、词缀）
  ━━━━━━━━━━━━━
  🎮 快速上手：
  1️⃣ 获得摊位令（商店购买/打工掉落）
  2️⃣ 前往城镇，发送【摆摊】
  3️⃣ 【上摊 物品名 价格】上架
  4️⃣ 等待买家购买，自动到账
  ━━━━━━━━━━━━━
  💡 与其他交易方式的区别：
  • 挂牌市场：系统定价（底价~8倍限制），自动撮合
  • 拍卖行：竞价模式，需等待出价
  • 个人摊位：完全自由定价，即买即走
  ━━━━━━━━━━━━━
  💡 发送【经济市场】查看所有交易方式
