body: |
  🎒 资源获取 🎒
  钱和材料从哪来？统统在这里
  ━━━━━━━━━━━━━
  💼 稳定收入 - 打工：
  【打工】 在工作地点查看可用工作
  【打工 工作名】 开始工作
  【收工】 完成工作领钱（60-180金/次）
  【工作地点】 查看所有工作地点
  ━━━━━━━━━━━━━
  📋 任务奖励 - 委托：
  【每日委托】 查看今日委托
  【接取委托 编号】 接取任务
  【完成委托】 到达目标位置后完成
  ━━━━━━━━━━━━━
  🌀 副本掉落 - 诡域：
  【进入 N层诡域】 进入副本
  【探索】 探索当前格子
  【领取宝箱】 领取层级宝箱奖励
  【返回】 回到现实世界
  ━━━━━━━━━━━━━
  🗺️ 地图探索：
  【地图】 查看重要地点
  【导航 地点名】 自动导航
  【观察】 查看当前位置信息
  【交互 NPC名】 与NPC交互
  ━━━━━━━━━━━━━
  🎣 钓鱼获取食材：
  【钓鱼】 钓鱼（5分钟冷却）
  【鱼栏】 查看鱼类存量
  ━━━━━━━━━━━━━
  🍳 餐厅经营：
  【创建餐厅】 开一家餐厅自动赚钱
  ━━━━━━━━━━━━━
  🌱 灵田种植：
  【开辟灵田】 创建灵田
  【灵田】 查看灵田状态
  【收菜】 收获成熟作物
  【菜市场】 查看灵蔬/诡药收购价（每小时变化）
  【卖菜 作物名 数量】 按市场价出售作物
  ━━━━━━━━━━━━━
  💡 缺钱→打工/跑商  缺材料→副本/委托  缺药→炼丹/买
  💡 发送【打工系统】【副本系统】【钓鱼系统】【餐厅系统】【灵田系统】看详细帮助
