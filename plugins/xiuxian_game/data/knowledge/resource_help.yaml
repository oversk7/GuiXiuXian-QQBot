body: |
  资源获取：金币和材料的来源
  ━━━━━━━━━━━━━
  💼 打工：
  【打工】 当前地点可选工作 → 【打工 工作名】 上工 → 【收工】 领钱
  【工作地点】 全部地点
  ━━━━━━━━━━━━━
  📋 委托：
  【每日委托】 → 【接取委托 编号】 → 【完成委托】 需到目标位置
  ━━━━━━━━━━━━━
  🌀 诡域副本：
  【进入 N层诡域】 → 【探索】 → 【领取宝箱】 → 【返回】
  ━━━━━━━━━━━━━
  🗺️ 地图：
  【地图】 重要地点 | 【导航 地点名】 前往
  【观察】 当前位置 | 【交互 NPC名】
  ━━━━━━━━━━━━━
  🎣 钓鱼：【钓鱼】 5分钟冷却 | 【鱼栏】 存量
  🍳 餐厅：【创建餐厅】 开店自动经营
  🌱 灵田：【开辟灵田】 | 【灵田】 | 【收菜】
  【菜市场】 收购价每小时变动 | 【卖菜 作物名 数量】
  ━━━━━━━━━━━━━
  缺钱打工跑商，缺材料下副本接委托，缺药炼丹或市场买
  详细帮助见【打工系统】【副本系统】【钓鱼系统】【餐厅系统】【灵田系统】
