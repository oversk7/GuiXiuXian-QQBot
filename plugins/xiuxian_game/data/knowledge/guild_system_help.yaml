body: |
  加入公会可以获得公会建筑福利
  ━━━━━━━━━━━━━
  **🏰 基础功能**
  【创建公会 公会名】 创建公会（消耗会长委任书）
  【我的公会】 查看公会信息
  【公会列表 页码】 查看所有公会及其会长信息
  【公会成员 页码】 查看成员列表
  【加入公会 公会ID】 加入公会
  【退会】 退出公会（清空积分和贡献）
  ━━━━━━━━━━━━━
  **👑 管理功能**
  【申请列表】 查看待处理申请
  【同意入会 UID】 审核入会（拒绝用【拒绝入会 UID】）
  【设置职位 UID 职位名】 设置成员职位
  【踢出公会 UID】 踢出成员
  【设置基地】 设立公会基地（会长，2级+）
  【转让会长 UID】 转让会长职位
  【解散公会】 解散公会（会长）
  ━━━━━━━━━━━━━
  **💰 经济系统**
  【捐献金币 金额】 捐献获得积分
  【公会升级】 升级公会（会长）
  ━━━━━━━━━━━━━
  **🏗️ 建筑系统**
  【公会建筑】 查看建筑列表和加成
  【建造 建筑名】 建造或升级建筑（会长，可附x y布局，优先消耗公会仓库材料）
  【移动建筑 建筑名 x y】 调整3x3基地布局
  💡 流程：设置基地→建造建筑→移动成相邻→查看公会加成
  💡 坐标是x y（1-3），只算上下左右相邻，斜角不算
  【公会传送】 传送到公会基地
  【公会传送 x y】 在基地时传送到势力范围内坐标
  常用建筑：
  • 训练场：全员修炼/闭关加成
  • 丹房：每日产丹，用积分兑换
  • 公会仓库：在基地存取材料
  • 铸器坊/淬灵台：在基地锻造/升阶装备
  • 聚灵阵：只强化相邻建筑，本身不直接给修为
  推荐相邻：
  • 聚灵阵+训练场：修为加成 +2%
  • 聚灵阵+丹房：日产 +1
  • 聚灵阵+铸器坊：锻造金币折扣 +2%
  • 聚灵阵+淬灵台：升阶成功率 +1%
  • 铸器坊+淬灵台：锻造折扣 +3%，升阶成功率 +1%
  • 铸器坊+公会仓库：锻造金币折扣 +2%
  ━━━━━━━━━━━━━
  **🧪 丹房系统**
  【公会丹房】 查看丹房产出
  【兑换丹药 丹药名称 数量】 用积分兑换丹药
  💡 存储上限=日产量x3，请及时兑换
  ━━━━━━━━━━━━━
  **📦 公会仓库**
  【宗门仓库】 查看仓库物品
  【存入仓库 物品名 数量】 存入诡异道具
  【取出仓库 物品名 数量】 取出物品
  【仓库记录】 查看存取流水（最近20条）
  💡 需在公会基地操作，仅可存入材料类道具
  ━━━━━━━━━━━━━
  **📋 任务系统**
  【公会任务】 查看任务列表和进度
  【完成公会任务】 领取任务奖励
  【公会任务统计】 查看任务统计
  ━━━━━━━━━━━━━
  💡 职位体系：会长>副会长>核心成员>普通成员
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
