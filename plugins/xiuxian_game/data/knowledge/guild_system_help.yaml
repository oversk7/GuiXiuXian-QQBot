body: |
  ━━━━━━━━━━━━━
  **🏰 基础**
  【创建公会 公会名】 消耗会长委任书
  【我的公会】 | 【公会列表 页码】 | 【公会成员 页码】
  【加入公会 公会ID】 | 【退会】 积分和贡献清零
  • 职位：会长 > 副会长 > 核心成员 > 普通成员
  ━━━━━━━━━━━━━
  **👑 管理**
  【申请列表】 | 【同意入会 UID】 | 【拒绝入会 UID】
  【设置职位 UID 职位名】 | 【踢出公会 UID】
  【设置基地】 会长，公会2级起 | 【转让会长 UID】 | 【解散公会】
  ━━━━━━━━━━━━━
  **💰 经济**
  【捐献金币 金额】 换积分 | 【公会升级】 会长操作
  ━━━━━━━━━━━━━
  **🏗️ 建筑**
  【公会建筑】 列表与加成
  【建造 建筑名】 会长；可附x y指定位置，优先耗公会仓库材料
  【移动建筑 建筑名 x y】 调整3x3布局；坐标1-3，只算上下左右相邻
  【公会传送】 回基地 | 【公会传送 x y】 基地内传送到势力范围坐标
  • 训练场：全员修炼闭关加成 | 丹房：每日产丹
  • 公会仓库：基地存取材料 | 铸器坊/淬灵台：基地锻造/升阶
  • 聚灵阵：只强化相邻建筑，本身无加成
  相邻搭配：
  • 聚灵阵+训练场 修为+2% | 聚灵阵+丹房 日产+1
  • 聚灵阵+铸器坊 锻造折扣+2% | 聚灵阵+淬灵台 升阶成功率+1%
  • 铸器坊+淬灵台 折扣+3%成功率+1% | 铸器坊+公会仓库 折扣+2%
  ━━━━━━━━━━━━━
  **🧪 丹房**
  【公会丹房】 产出 | 【兑换丹药 丹药名称 数量】 积分兑换
  • 存储上限为日产量×3，及时兑换
  ━━━━━━━━━━━━━
  **📦 仓库**
  【宗门仓库】 | 【存入仓库 物品名 数量】 | 【取出仓库 物品名 数量】
  【仓库记录】 最近20条流水
  • 需在基地操作，仅收材料类道具
  ━━━━━━━━━━━━━
  **📋 任务**
  【公会任务】 列表与进度 | 【完成公会任务】 领奖 | 【公会任务统计】
  ━━━━━━━━━━━━━
  **👁 镇诡**
  【开坛引诡】 会长耗资金引诡入阵 | 【镇诡】 全会合力讨伐
  • 详见【镇诡帮助】
  ━━━━━━━━━━━━━
  > 【帮助】 返回
