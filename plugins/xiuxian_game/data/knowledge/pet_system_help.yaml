body: |
  ✨ 宠物伴侣系统 ✨
  驯化诡兽为宠物伴侣，聊天、养成、打扮、战斗!
  ━━━━━━━━━━━━━
  🐾 获取与管理：
  【驯化诡兽 名称 昵称】 驯化背包中的诡兽
  【宠物】 查看当前伴侣状态
  【伴侣列表】 查看所有伴侣
  【切换伴侣 宠物ID】 切换当前伴侣
  ━━━━━━━━━━━━━
  💬 互动与对话：
  【摸摸】/【摸头】/【玩耍】/【抱抱】 互动（+好感/心情）
  【对话 内容】 与宠物AI对话
  ━━━━━━━━━━━━━
  🍖 喂食：
  【喂食】 用怨念喂食（基础）
  【喂食 菜肴名】 用烹饪菜肴喂食（更好效果）
    • 菜肴品质越高，经验和心情加成越多
  ━━━━━━━━━━━━━
  👗 装扮：
  【宠物装扮】 查看饰品商店
  【买饰品 名称】 购买饰品
  【宠物装扮 名称】 给宠物装备饰品
    • 饰品提供属性加成+外观描述
    • 槽位：头饰/颈饰/服饰
  ━━━━━━━━━━━━━
  ⚔️ 战斗加成：
    宠物自动为主人提供被动属性加成
    等级越高、心情越好，加成越强
  ━━━━━━━━━━━━━
  ✨ 化形：
  【化形】 宠物化形为人形态
    • 需要等级50 + 好感度500
    • 化形后解锁新的AI对话人设
  ━━━━━━━━━━━━━
  🌾 守田：
  【派遣守田】 派宠物守灵田（拦截偷菜）
  【召回宠物】 召回守田中的宠物
  ━━━━━━━━━━━━━
  📊 诡兽种族：
    ⚪冥犬 🟢诡猫 🔵鬼隼 🟣噩梦狼 🟠虚空蟒
    稀有度越高，属性成长越强
