body: |
  驯化诡兽为宠物伙伴，聊天、养成、打扮、战斗!
  ━━━━━━━━━━━━━
  **🐾 获取与管理**
  【驯化诡兽 名称 昵称】 驯化背包中的诡兽
  【宠物】 查看当前伙伴状态
  【宠物列表】 查看所有宠物
  【切换伙伴 宠物ID】 切换当前伙伴
  【放生 宠物ID或昵称】 永久放生宠物（不可撤销，需二次确认）
  ━━━━━━━━━━━━━
  **💬 互动与对话**
  【摸摸】 偏好感 · 【摸头】 偏心情
  【玩耍】 偏经验（耗饱食） · 【抱抱】 偏亲密（化形后有专属反应）
  • 4种互动共享5分钟CD；心情/饱食/好感不同会触发不同反应
  • 饱食<20 收益减半；心情<30 可能拒绝互动
  • 低概率惊喜：宠物会给你叼来金币/怨念/小药材
  【对话 内容】 与宠物AI对话
  【定制人设 描述】 花费50诡烛定制人设（需已化形，AI优化为完整人设）
  【重置人设】 免费恢复宠物默认人设
  ━━━━━━━━━━━━━
  **🍖 喂食**
  【喂食 怨念】 消耗怨念喂养（每次50-200怨念，可加次数）
  【喂食 菜肴名】 用菜肴喂养（更好效果，品质越高加成越多）
  • 每日递减收益：前99次正常 -> 100-300次减半 -> 300次后最低
  ━━━━━━━━━━━━━
  **👗 装扮**
  【宠物装扮】 查看饰品商店
  【买饰品 名称】 购买饰品
  【宠物装扮 名称】 给宠物装备饰品
  • 饰品提供属性加成+外观描述
  • 槽位：头饰/颈饰/服饰
  ━━━━━━━━━━━━━
  **⚔️ 战斗加成**
  宠物自动为主人提供被动属性加成
  等级越高、心情越好，加成越强
  ━━━━━━━━━━━━━
  **🔮 进化**
  【进化宠物】 查看进化条件和属性变化（等级+精魄+怨念）
  【进化宠物 确认】 消耗材料执行进化，提升稀有度
  • 进化路径：⚪普通→🟢优秀→🔵稀有→🟣史诗→🟠传说
  • 材料「诡兽精魄」从诡域宝箱中低概率获取
  ━━━━━━━━━━━━━
  **✨ 化形**
  【化形 男】 化形时选择性别（男/女）
  • 需要等级50 + 好感度100
  • 化形后解锁AI对话
  • 性别一经选择无法更改，请慎重
  ━━━━━━━━━━━━━
  **🌾 守田**
  【派遣守田】 派宠物守灵田（拦截偷菜）
  【召回宠物】 召回守田中的宠物
  ━━━━━━━━━━━━━
  **📊 诡兽种族**
  ⚪冥犬 🟢诡猫 🔵鬼隼 🟣噩梦狼 🟠虚空蟒
  稀有度越高，属性成长越强
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
