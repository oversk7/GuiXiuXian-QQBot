body: |
  ━━━━━━━━━━━━━
  **🐾 获取与管理**
  【驯化诡兽 名称 昵称】 驯化背包中的诡兽
  【宠物】 当前伙伴状态 | 【宠物列表】 | 【切换伙伴 宠物ID】
  【放生 宠物ID或昵称】 永久放生，需二次确认
  • 种族：⚪冥犬 🟢诡猫 🔵鬼隼 🟣噩梦狼 🟠虚空蟒，稀有度越高成长越强
  ━━━━━━━━━━━━━
  **💬 互动**
  【摸摸】 偏好感 | 【摸头】 偏心情
  【玩耍】 偏经验，耗饱食 | 【抱抱】 偏亲密，化形后有专属反应
  • 四种互动共享5分钟冷却；饱食<20收益减半，心情<30可能拒绝
  • 偶尔会叼来金币、怨念或小药材
  【对话 内容】 与宠物AI聊天
  【定制人设 描述】 50诡烛，需已化形 | 【重置人设】 免费恢复默认
  ━━━━━━━━━━━━━
  **🍖 喂食**
  【喂食 怨念】 每次50-200怨念，可加次数
  【喂食 菜肴名】 效果更好，品质越高加成越多
  • 收益每日递减：99次内正常，100-300次减半，之后最低
  ━━━━━━━━━━━━━
  **👗 装扮**
  【宠物装扮】 饰品商店 | 【买饰品 名称】 | 【宠物装扮 名称】 穿戴
  • 槽位头饰/颈饰/服饰，饰品带属性加成与外观描述
  ━━━━━━━━━━━━━
  **⚔️ 加成**
  宠物为主人提供被动属性加成，等级越高、心情越好越强
  ━━━━━━━━━━━━━
  **🔮 进化**
  【进化宠物】 条件与属性变化 | 【进化宠物 确认】 执行
  • 普通→优秀→稀有→史诗→传说；需等级+诡兽精魄+怨念
  • 诡兽精魄出自诡域宝箱，低概率
  ━━━━━━━━━━━━━
  **✨ 化形**
  【化形 男】 或 【化形 女】 需等级50、好感度100
  • 化形后解锁AI对话；性别选定不可更改
  ━━━━━━━━━━━━━
  **🌾 守田**
  【派遣守田】 守灵田拦截偷菜 | 【召回宠物】
  ━━━━━━━━━━━━━
  > 【帮助】 返回
