body: |
  ✨ 宠物伙伴系统 ✨
  驯化诡兽为宠物伙伴，聊天、养成、打扮、战斗!
  ━━━━━━━━━━━━━
  🐾 获取与管理：
  【驯化诡兽 名称 昵称】 驯化背包中的诡兽
  【宠物】 查看当前伙伴状态
  【宠物列表】 查看所有宠物
  【切换伙伴 宠物ID】 切换当前伙伴
  ━━━━━━━━━━━━━
  💬 互动与对话：
  【摸摸】/【摸头】/【玩耍】/【抱抱】 互动（+好感/心情）
  【对话 内容】 与宠物AI对话
  ━━━━━━━━━━━━━
  🍖 喂食：
  【喂食 怨念 [数量]】 消耗怨念喂养（每次50-200怨念）
  【喂食 菜肴名 [数量]】 用菜肴喂养（更好效果）
    • 菜肴品质越高，经验和心情加成越多
  ━━━━━━━━━━━━━
  👗 装扮：
  【宠物装扮】 查看饰品商店
  【买饰品 名称】 购买饰品
  【宠物装扮 名称】 给宠物装备饰品
    • 饰品提供属性加成+外观描述
    • 槽位：头饰/颈饰/服饰
  ━━━━━━━━━━━━━
  ⚔️ 战斗加成：
    宠物自动为主人提供被动属性加成
    等级越高、心情越好，加成越强
  ━━━━━━━━━━━━━
  🔮 进化：
  【进化宠物】 查看进化条件（等级+精魄+怨念）
  【进化宠物 确认】 消耗材料提升稀有度
    • 进化后属性按新稀有度重算并补齐
    • 进化路径：⚪普通→🟢优秀→🔵稀有→🟣史诗→🟠传说
    • 材料「诡兽精魄」从诡域宝箱中低概率获取
  ━━━━━━━━━━━━━
  ✨ 化形：
  【化形 男/女】 化形时选择性别（可切换）
    • 需要等级50 + 好感度500
    • 化形后解锁新的AI对话人设
    • 已化形后再次使用可切换性别
  ━━━━━━━━━━━━━
  🌾 守田：
  【派遣守田】 派宠物守灵田（拦截偷菜）
  【召回宠物】 召回守田中的宠物
  ━━━━━━━━━━━━━
  📊 诡兽种族：
    ⚪冥犬 🟢诡猫 🔵鬼隼 🟣噩梦狼 🟠虚空蟒
    稀有度越高，属性成长越强
