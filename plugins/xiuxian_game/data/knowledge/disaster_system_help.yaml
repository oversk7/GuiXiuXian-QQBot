body: |
  大都会杀不掉的诡异，经由你排入下位世界。坐镇山寨，击退来犯英雄
  ━━━━━━━━━━━━━
  **🏰 基础**
  【降临】 首次免费建立山寨，之后显示山寨状态
  【镇守】 波次、天灾点、封印状态与下一波时间
  ━━━━━━━━━━━━━
  **⚔️ 战斗**
  【迎战】 与当前波次英雄1v1，模拟战斗不耗真实HP
  【侦查】 10天灾点，看英雄HP/攻防/特殊效果
  • 英雄每2小时来一波，强度随波次递增；4小时不迎战自动撤退，无奖励
  • 胜：得天灾点 | 败：封印12小时，波次-3（最低第1波）
  ━━━━━━━━━━━━━
  **💰 天灾商店**
  【天灾商店】 修炼加速、战意加持、专属称号等
  【兑换 商品名】 如：兑换 修炼加速（2小时）
  • 解封令40天灾点，立即解除封印
  ━━━━━━━━━━━━━
  > 【帮助】 返回
