body: |
  ✨ 下位世界·第四天灾 ✨
  降临下位世界，成为山寨之主，击退来犯英雄
  ━━━━━━━━━━━━━
  🏰 基础命令：
  【降临】 降临下位世界，成为第四天灾。首次使用会建立山寨并开始玩法，已建立则显示山寨状态。
  【镇守】 查看天灾山寨状态：当前波次、天灾点余额、封印状态、下一波英雄到来时间。
  ━━━━━━━━━━━━━
  ⚔️ 战斗系统：
  【迎战】 与当前波次的英雄战斗（1v1）。英雄每2小时来一波，4小时内不迎战则自动撤退。战斗不消耗玩家真实HP。
  【侦查】 消耗10天灾点，查看当前/下一波英雄详细属性（HP/攻击/防御/特殊效果）。提前做好战斗准备。
    • 击败英雄：获得天灾点奖励
    • 被英雄击败：封印12小时 + 波次降低3波（最低回到第1波）
    • 超时未战：英雄自动撤退，无奖励
  ━━━━━━━━━━━━━
  💰 天灾商店：
  【天灾商店】 查看可用天灾点兑换的专属福利，包括修炼加速、战意加持、专属称号等。
  【兑换 商品名】 花费天灾点购买天灾商店中的商品。
    示例：兑换 修炼加速（2小时）
    示例：兑换 称号「第四天灾」
  ━━━━━━━━━━━━━
  📊 玩法机制：
  • 英雄波次：每2小时刷新一波英雄
  • 应战时限：4小时内不迎战则英雄撤退
  • 天灾点获取：击败英雄获得，用于兑换福利
  • 战斗规则：不消耗真实HP，模拟战斗
  • 失败降波：战败后波次-3（最低回到第1波），降低难度重新挑战
  • 解封令：在天灾商店花40天灾点立即解除封印
  ━━━━━━━━━━━━━
  💡 提示：
  • 英雄强度随波次递增，准备充分再迎战
  • 天灾商店福利可大幅提升修炼效率
  • 首次降临免费建立山寨
