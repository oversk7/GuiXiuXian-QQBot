title: "气运投资机制细节（AI客服专用）"
keywords:
  - 投资细节
  - 气运价格刷新
  - 涨跌幅限制
  - 健康度机制
  - 保管费扣法
  - 持仓上限
  - 重新上市
body: |
  气运投资机制细节（供AI客服解答，均为当前实现的准确数值）
  • 价格刷新：查看行情时被动触发，最短1小时一次；另有每日9点例行更新
  • 单次涨跌幅上限±15%，价格下限为基础价的30%
  • 健康度机制：跌1%扣约1点健康度，涨1%只回约0.5点——长期阴跌必然退市
  • 黑天鹅：每周一凌晨检查，12种事件各自独立判定（单事件周概率5-7%），跌幅38-52%，同类事件14天冷却，同时扣健康度48-62点，常直接导致退市
  • 保管费每日凌晨3点按市值0.1%扣现金；现金不足会被系统强制卖出持仓抵扣
  • 每种气运持仓上限100万份；手续费买卖各0.5%，单笔下限1金上限100万
  • 退市气运3天后以基础价满血重新上市；系统会保底维持在售气运数量
