body: |
  经济市场：银行、跑商、投资、交易、拍卖
  ━━━━━━━━━━━━━
  🏦 银行：
  【存 金额】 | 【取 金额】 | 【余额】
  【转账 UID 金额】 手续费3%
  ━━━━━━━━━━━━━
  🏪 跑商：
  【市集】 本地行情 | 【市价 物品名】 各市集比价 | 【市集详情】
  【购买 物品 数量】 | 【出售 物品 数量】
  【跑商推荐】 盈利路线 | 【跑商记录】 我的交易
  【市集记录】 全场动态 | 【交易限制】 冷却状态
  ━━━━━━━━━━━━━
  📈 气运投资（高风险）：
  【投资行情】 | 【投资气运 代码 数量】 买入
  【出售气运 代码 数量】 卖出 | 【我的投资】 持仓
  ━━━━━━━━━━━━━
  💎 理财：
  【定期理财】 七日定存，周利率5% | 【购买定期 金额】 锁定7天
  【我的定期】 持仓 | 【赎回定期 编号】 到期赎回
  ━━━━━━━━━━━━━
  🔄 玩家挂牌：
  【交易清单】 在售 | 【挂牌 出售/收购 物品 单价 数量】
  【我的挂牌】 | 【撤牌 ID】
  【挂牌详情 订单ID】 挂牌人及装备词缀、铭文、宝石详情
  ━━━━━━━━━━━━━
  🏛️ 拍卖行：
  【拍卖行 [页码]】 在拍物品
  【上架拍卖 物品名 起拍价 时长 [一口价]】
  【出价 拍卖ID 金额】 竞价
  ━━━━━━━━━━━━━
  赚钱由稳到险：打工 → 跑商 → 投资
  详细帮助见【经济系统】【投资系统】【交易系统】【拍卖行系统】【烹饪系统】
