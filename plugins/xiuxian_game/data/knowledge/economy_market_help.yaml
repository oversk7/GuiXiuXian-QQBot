body: |
  💰 经济市场 💰
  所有跟钱有关的，都在这里
  ━━━━━━━━━━━━━
  🏦 银行：
  【存 金额】 存入银行
  【取 金额】 取出存款
  【余额】 查询存款
  【转账 UID 金额】 转账（3%手续费）
  ━━━━━━━━━━━━━
  🏪 跑商：
  【市集】 查看当前市场商品价格
  【市价 物品名】 查看物品各市集价格
  【市集详情】 查看市集详细报价
  【购买 物品 数量】 低价买入
  【出售 物品 数量】 高价卖出
  【跑商推荐】 盈利路线推荐
  【跑商记录】 查看交易历史
  【交易限制】 查看交易冷却
  ━━━━━━━━━━━━━
  📈 气运投资（高风险）：
  【投资行情】 查看气运价格
  【投资气运 代码 数量】 买入
  【出售气运 代码 数量】 卖出
  【我的投资】 查看持仓
  ━━━━━━━━━━━━━
  💎 银行理财：
  【定期理财】 七日定存（5%周利率，到期取回）
  【购买定期 金额】 买入定存（锁定7天）
  【我的定期】 查看定存持仓
  【赎回定期 编号】 到期赎回
  ━━━━━━━━━━━━━
  🔄 玩家交易（挂牌市场）：
  【交易清单】 查看在售物品
  【挂牌 出售/收购 物品 单价 数量】 挂牌
  【我的挂牌】 查看自己的挂牌
  【撤牌 ID】 撤回挂牌
  【查牌主 订单ID】 查看挂牌人
  ━━━━━━━━━━━━━
  🏛️ 拍卖行（稀有物品竞价）：
  【拍卖行 [页码]】 查看当前拍卖
  【上架拍卖 物品名 起拍价 时长 [一口价]】 发起拍卖
  【出价 拍卖ID 金额】 参与竞价
  ━━━━━━━━━━━━━
  💡 新手赚钱推荐：打工(稳)→跑商(中)→投资(险)
  💡 发送【经济系统】【投资系统】【交易系统】【拍卖行系统】看详细帮助
  💡 发送【烹饪系统】查看餐厅经营玩法
