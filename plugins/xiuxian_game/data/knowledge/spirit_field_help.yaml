body: |
  作物分两类：灵蔬入菜（碧冥芹、玉骨萝等），诡药入丹（鬼草、阴莓等）
  ━━━━━━━━━━━━━
  **🌱 灵田**
  【开辟灵田】 免费，每人一块
  【灵田】 地块、作物与诡兽状态
  【灵田升级】 解锁更多地块和高级灵种；1级4块起，9级20块
  ━━━━━━━━━━━━━
  **🌿 种植**
  【种植 作物名 地块号】 | 【一键种植 作物名】 种满空地
  【浇水 地块号】 成长时间-15%，每地块每日3次，冷却30分钟
  【一键浇水】 | 【收菜】 收获全部成熟作物，10%概率返1颗种子
  ━━━━━━━━━━━━━
  **🛒 买种卖菜**
  【种子商店】 可购种子，末尾附诡兽列表 | 【买种子 名称 数量】
  【菜市场】 收购价每小时变动，晚市18-22点最高
  【卖菜 作物名 数量】 按市价出售
  ━━━━━━━━━━━━━
  **🥷 偷菜**
  【拜访灵田 UID】 看他人灵田 | 【偷菜】 可偷目标
  【偷菜 UID】 偷成熟作物 | 【偷菜记录 页码】
  • 每日5次，同人每日1次，单次至多20%，冷却15分钟
  ━━━━━━━━━━━━━
  **🐾 守田**
  【买诡兽 诡兽名 数量】 → 【放置诡兽 诡兽名】 拦截偷菜者并扣罚金
  【收回诡兽】 | 【喂养诡兽】 消耗怨念；24小时不喂拦截率减半
  【派遣守田】 宠物守田 | 【召回宠物】 详见 【宠物系统】
  ━━━━━━━━━━━━━
  **🏠 阴宅加成**
  阴宅等级越高灵田加成越强，种植时自动生效
  • 成长加速：1级5% → 10级40% → 30级70%封顶
  • 产量加成：10级25% → 30级55%封顶
  • 详情见 【阴宅系统】
  ━━━━━━━━━━━━━
  **🍳 烹饪联动**
  种植 → 收菜 → 补货到餐厅 → 烹饪出售
  ━━━━━━━━━━━━━
  > 【帮助】 返回
