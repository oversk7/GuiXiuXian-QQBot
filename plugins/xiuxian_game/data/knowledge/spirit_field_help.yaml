body: |
  作物分两类：灵蔬入菜（碧冥芹、玉骨萝等），诡药入丹（鬼草、阴莓等）
  ━━━━━━━━━━━━━
  **🌱 灵田**
  【开辟灵田】 需1,000金币，每人一块
  【灵田】 地块、作物与守田状态
  【灵田升级】 解锁更多灵壤和高级灵种；1级4块起，9级20块
  ━━━━━━━━━━━━━
  **🌿 种植**
  【种植 作物名 地块号】 | 【一键种植 作物名】 种满空地
  【浇水 地块号】 剩余成长时间-15%，每地块每日3次，冷却30分钟
  【一键浇水】 | 【收菜】 收获全部成熟作物，10%概率返1颗种子
  背包装不下产物或返还种子时，本次收获不结算，作物仍留在田里；整理背包后再【收菜】
  ━━━━━━━━━━━━━
  **🛒 买种卖菜**
  【种子商店】 灵种与守田诡兽 | 【买种子 名称 数量】
  【菜市场】 收购价每小时变动，晚市18-22点最高
  【卖菜 作物名 数量】 按市价出售
  ━━━━━━━━━━━━━
  **🥷 偷菜**
  【拜访灵田 UID】 看他人灵田 | 【偷菜】 可偷目标
  【偷菜 UID】 偷成熟作物 | 【偷菜记录 页码】
  • 每日最多偷5个不同玩家、同人每日1次，冷却15分钟（被诡兽拦截不耗次数但触发冷却）
  • 单块最多偷余量30%，主人保底70%；只能偷48小时内活跃的玩家
  ━━━━━━━━━━━━━
  **🐾 守田**
  【买诡兽 诡兽名】 → 【驯化诡兽 名称 昵称】 → 【派遣守田】 拦截偷菜者并罚金
  【召回宠物】 撤回守田；喂食与好感详见 【宠物系统】，饥饿时拦截率减半
  ━━━━━━━━━━━━━
  **🏠 阴宅加成**
  阴宅等级越高灵田加成越强，种植时自动生效
  • 成长加速：1级5% → 10级40% → 30级70%封顶
  • 产量加成：10级25% → 30级55%封顶
  • 详情见 【阴宅系统】
  ━━━━━━━━━━━━━
  **🍳 烹饪联动**
  种植 → 收菜 → 补货到餐厅 → 烹饪出售
  ━━━━━━━━━━━━━
  > 【帮助】 返回
