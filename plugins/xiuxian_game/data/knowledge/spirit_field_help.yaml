body: |
  开辟灵田种植灵蔬诡药，收获食材与炼丹材料
  ━━━━━━━━━━━━━
  **🌱 灵田管理**
  【开辟灵田】 创建灵田（免费，每人一块）
  【灵田】 查看灵田状态（地块/作物/诡兽）
  【灵田升级】 升级灵田（解锁更多地块）
  ━━━━━━━━━━━━━
  **🌿 种植操作**
  【种植 作物名 地块号】 在指定地块种植
  【一键种植 作物名】 所有空地块种植
  【浇水 地块号】 浇水指定地块（减15%成长时间）
  【一键浇水】 浇水所有已种地块
  【收菜】 收获所有成熟作物
  ━━━━━━━━━━━━━
  **🛒 种子商店**
  【种子商店】 查看可购买种子（末尾附诡兽列表）
  【买种子 名称 数量】 购买种子
  ━━━━━━━━━━━━━
  **💰 灵蔬市场**
  【菜市场】 查看当前灵蔬/诡药收购价（每小时变化）
  【卖菜 作物名 数量】 按市场价出售作物
  价格每小时动态变化，晚市18-22点价格最高
  ━━━━━━━━━━━━━
  **🥷 偷菜**
  【拜访灵田 UID】 查看他人灵田状态
  【偷菜】 查看可偷目标列表
  【偷菜 UID】 偷指定玩家的成熟作物
  【偷菜记录 页码】 查看偷菜日志（每页5条）
  • 每日5次，同人每日1次，每次最多偷20%，15分钟冷却
  ━━━━━━━━━━━━━
  **🐾 诡兽守田**
  【买诡兽 诡兽名 数量】 购买诡兽
  【放置诡兽 诡兽名】 放置诡兽守田
  【收回诡兽】 收回诡兽到背包
  【喂养诡兽】 喂食诡兽（消耗怨念，防止饥饿）
  • 诡兽可拦截偷菜者并扣罚金
  • 24小时未喂食→饥饿→拦截率减半
  【派遣守田】 派遣宠物伙伴守田 | 【召回宠物】 召回守田中的宠物
  • 详细功能见 【宠物系统】
  ━━━━━━━━━━━━━
  **📊 灵田等级**
  1级4块 -> 2级6块 -> ... -> 9级20块
  升级解锁更多地块和高级灵种
  ━━━━━━━━━━━━━
  **🏠 阴宅联动**
  阴宅等级越高，灵田加成越强（种植时自动生效）
  • 成长加速：1级5% -> 5级25% -> 10级40% -> 20级60% -> 30级70%（上限）
  • 产量加成：10级25% -> 20级45% -> 30级55%（上限）
  💡 发送【阴宅系统】查看完整阴宅加成详情
  ━━━━━━━━━━━━━
  **🍳 烹饪联动**
  灵蔬可作为烹饪食材，搭配新食谱
  种植 -> 收菜 -> 补货到餐厅 -> 烹饪出售
  ━━━━━━━━━━━━━
  💡 作物分两类：灵蔬联动烹饪（碧冥芹、玉骨萝等），诡药联动炼丹（鬼草、阴莓等）
  💡 浇水每地块每日3次，冷却30分钟
  💡 收菜有10%概率额外获得1颗同种种子
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
