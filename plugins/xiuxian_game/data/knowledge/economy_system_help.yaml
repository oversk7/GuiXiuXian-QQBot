body: |
  管理金币、跑商赚钱、银行理财
  ━━━━━━━━━━━━━
  **🏦 银行系统**
  【存 金额】 存入冥行（不产生利息）
  【取 金额】 取出存款
  【余额】 查询存款余额
  【转账 UID 金额】 银行转账（手续费3%）
  ━━━━━━━━━━━━━
  **🏪 跑商系统**
  【市集】 查看当前市场商品和价格
  【市价 物品名】 查看物品在各市集的买卖价格
  【市集详情】 查看指定市集的详细商品价格
  【购买 物品名 数量】 购买商品
  【出售 物品名 数量】 出售商品
  【自动出售】 一键卖出所有可售商品
  【跑商推荐】 查看盈利路线推荐
  【跑商记录】 查看最近交易历史
  【市集记录】 查看当前市集的交易动态（所有玩家）
  【交易限制】 查看当前交易冷却状态
  【市集列表】 查看所有市集坐标
  【黑市】 查看黑市特殊商品
  【食材铺】 购买烹饪基础调料（盐/酱油/醋/糖）
  ━━━━━━━━━━━━━
  **⚙️ 跑商机制**
  同一地点买的商品4小时内不能原地卖
  市集每6小时自动补货
  同商品买越多越贵（商人50个后加价）
  跑商奖励：跨域贸易3%、远途补贴2-4%、稀缺供应2%、首单加成5%、行情红利2%、连续跑商1-3%
  累进跑商税：日收入0-30万免税，30-80万5%，80-150万10%，150万+15%
  ━━━━━━━━━━━━━
  **💎 理财产品**
  【理财产品】 查看活期理财（随存随取）
  【我的理财】 查看活期持仓
  【定期理财】 查看七日定存（固定5%周利率）
  【购买定期 金额】 买入七日定存（锁定7天）
  【我的定期】 查看定存持仓及到期时间
  【赎回定期 编号】 到期后赎回定存
  ━━━━━━━━━━━━━
  **💡 新手快速赚钱方式**
  1. 【打工系统】 稳定收入（90-270金币/次+评级翻倍）
  2. 跑商系统 - 低买高卖赚差价
  3. 副本探索 - 获得材料出售
  ━━━━━━━━━━━━━
  > 【投资系统】 气运投资 | 【帮助】 返回
