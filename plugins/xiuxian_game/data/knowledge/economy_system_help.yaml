body: |
  ━━━━━━━━━━━━━
  **🏦 银行**
  【存 金额】 存入冥行，无利息 | 【取 金额】 | 【余额】
  【转账 UID 金额】 手续费3%，扣的是银行存款，限同区玩家
  ━━━━━━━━━━━━━
  **🏪 跑商**
  【市集】 本地商品与价格 | 【市价 物品名】 各市集比价
  【市集详情】 指定市集全价目 | 【市集列表】 各市集坐标
  【购买 物品名 数量】 | 【出售 物品名 数量】 | 【自动出售】 一键卖出
  【跑商推荐】 盈利路线 | 【跑商记录】 我的交易 | 【市集记录】 全场动态
  【交易限制】 冷却状态
  【黑市】 特殊商品 | 【食材铺】 盐/酱油/醋/糖等基础调料
  ━━━━━━━━━━━━━
  **⚙️ 跑商规则**
  • 同地买入的商品4小时内不能原地卖出
  • 市集每6小时补一成库存；当日同市集同商品买超30个起商人阶梯加价
  • 奖励：跨域贸易3%、远途补贴2-4%、稀缺供应2%、首单5%、行情红利2%、连续跑商1-3%
  • 跑商税仅对跨市场出售征收，按当日累计收入定档对整笔计税：30万内免税，30-80万5%，80-150万10%，150万以上15%
  ━━━━━━━━━━━━━
  **💎 理财**
  【理财产品】 活期，随存随取 | 【我的理财】 持仓
  【定期理财】 七日定存，周利率5%（扣息10%管理费后净约4.5%） | 【购买定期 金额】 锁定7天
  【我的定期】 持仓与到期时间 | 【赎回定期 编号】 到期赎回
  ━━━━━━━━━━━━━
  > 赚钱路径：【打工系统】 稳定 → 跑商赚差价 → 副本材料出售
  > 【投资系统】 气运投资 | 【帮助】 返回
