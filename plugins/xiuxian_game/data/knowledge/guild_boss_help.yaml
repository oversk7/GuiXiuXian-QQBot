body: |
  开坛设饵引诡入阵，全会合力把它镇回去
  ━━━━━━━━━━━━━
  **🕯 开坛**
  【开坛引诡】 会长/副会长主持，限时48小时
  • 消耗公会资金 5000+凶戾度×2000，每日1次（零点重置）
  • 血量按开坛时近7天活跃成员的战力生成（不活跃成员不撑血量但仍可参战）
  ━━━━━━━━━━━━━
  **🩸 血祭开坛**
  【献怨 数量/全部】 成员将个人怨念注入公会怨念池（不可取回）
  【开坛引诡 中坛/大坛/邪坛】 消耗怨念池 10万/50万/200万
  • 血量×1.5/×2/×3，积分与公会经验同档放大
  • 邪坛引来邪神血裔：镇压后参战者获称号「封邪人」，伤害前三得【邪神遗骸】
  • 超时未镇压怨念不退，专属奖励不发——量力开坛
  ━━━━━━━━━━━━━
  **⚔️ 讨伐**
  【镇诡】 每人每场3次，战斗削减理智（同世界BOSS）
  【公会Boss】 血条进度、剩余时间、我的余次
  【镇诡战报】 会内伤害榜与未出手名单
  ━━━━━━━━━━━━━
  **💰 结算**
  • 镇压成功：全员积分（满勤加成、伤害前三加成）+ 公会经验，凶戾度+1
  • 超时未镇压：积分与公会经验均按削减血量比例折算，经验再减半
  • 凶戾度越高它越强、开坛越贵——它记得你们的手段
  ━━━━━━━━━━━━━
  > 【公会系统】 | 【帮助】 返回
