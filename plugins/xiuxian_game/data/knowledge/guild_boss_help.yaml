body: |
  开坛设饵引诡入阵，全会合力把它镇回去
  ━━━━━━━━━━━━━
  **🕯 开坛**
  【开坛引诡】 会长/副会长主持，限时48小时
  • 消耗公会资金 5000+凶戾度×2000，每周2次（周一重置）
  • 血量按开坛时全会战力生成，需六成人出力才镇得住
  ━━━━━━━━━━━━━
  **⚔️ 讨伐**
  【镇诡】 每人每场3次，战斗削减理智（同世界BOSS）
  【公会Boss】 血条进度、剩余时间、我的余次
  【镇诡战报】 会内伤害榜与未出手名单
  ━━━━━━━━━━━━━
  **💰 结算**
  • 镇压成功：全员积分（满勤加成、伤害前三加成）+ 公会经验，凶戾度+1
  • 超时未镇压：按削减血量比例折算积分，公会经验减半
  • 凶戾度越高它越强、开坛越贵——它记得你们的手段
  ━━━━━━━━━━━━━
  > 【公会系统】 | 【帮助】 返回
