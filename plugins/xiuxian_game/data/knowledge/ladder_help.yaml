body: |
  残魂相搏，肉身不损，唯以凶名论高下
  ━━━━━━━━━━━━━
  **🎯 玩法**
  残魂投影入场，自动匹配凶名相当的对手
  胜则凶名大涨得魂晶，负亦有参与奖；物品血量零损失
  ━━━━━━━━━━━━━
  **📋 指令**
  【斗法天梯】 主页：段位/凶名/战绩
  【斗法天梯 匹配】 入场一次
  【斗法天梯 排行】 本赛季凶名榜
  【斗法天梯 历史】 最近20场
  【斗法天梯 开启】 / 【斗法天梯 关闭】 残魂显隐
  【斗法商店】 魂晶商店 | 【斗法兑换 物品名】
  ━━━━━━━━━━━━━
  **📊 段位 · 诡道九品**
  散修(<1000) → 九品(1000) → 八品(1150) → 七品(1300) → 六品(1450)
  → 五品(1600) → 四品(1750) → 三品(1900) → 二品(2050) → 一品(2200) → **道君**(≥2350)
  ━━━━━━━━━━━━━
  **⚙️ 规则**
  • 境界30以上可入场；每日5场，高级月卡+3
  • 同一对手6小时冷却；守方每日至多被锁定10次
  • 连胜10场后凶名收益减半；每场间隔60秒
  • 隐匿残魂后仍可主动出击；守方上线会收到受袭通知
  ━━━━━━━━━━━━━
  **💎 单场奖励**
  胜：涨凶名+100魂晶 | 负：扣凶名+30魂晶 | 每日首胜另+200魂晶
  ━━━━━━━━━━━━━
  **🏆 赛季结算（每月底）**
  第1名：称号「诡道煞君」+1000香火+5稳定水晶
  第2-3名：「斗煞尊」+500香火+3稳定水晶
  第4-10名：「煞道名宿」+300香火+2稳定水晶
  第11-50名：「斗煞新秀」+100香火+1稳定水晶
  第51-100名：50香火 | 之后参与奖20香火
  软重置：凶名超出1500的部分压缩70%
  ━━━━━━━━━━━━━
  **🛒 魂晶商店**
  斗法令 50 · 今日+1场 | 灵气补给 200 · 得50香火
  稳定水晶 800 | 洗词石 300 | 改名卡 1500 · 每日限购1
  ━━━━━━━━━━━━━
  > 【战斗系统】 | 【斗法天梯】 主页 | 【帮助】 返回
