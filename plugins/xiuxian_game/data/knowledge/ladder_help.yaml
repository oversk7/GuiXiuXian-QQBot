body: |
  🏆 斗法天梯帮助 🏆
  残魂相搏，肉身不损，唯以凶名论高下
  ━━━━━━━━━━━━━
  🎯 玩法核心：
  以残魂投影入斗法场，斗法场自动寻凶名相当者配对
  胜则凶名大涨 + 魂晶
  负亦有参与奖
  零物品/血量损失
  ━━━━━━━━━━━━━
  📋 命令清单：
  【斗法天梯】 主页 (段位/凶名/战绩)
  【斗法天梯 匹配】 入场斗法一次
  【斗法天梯 排行】 本赛季凶名榜
  【斗法天梯 历史】 最近 20 场战绩
  【斗法天梯 开启】/【斗法天梯 关闭】 残魂显/隐
  【斗法商店】 查看魂晶商店
  【斗法兑换 物品名 数量】 兑换商品
  ━━━━━━━━━━━━━
  📊 段位系统 (诡道九品)：
  散修(<1000) → 九品(1000) → 八品(1150) → 七品(1300)
  → 六品(1450) → 五品(1600) → 四品(1750)
  → 三品(1900) → 二品(2050) → 一品(2200)
  → 道君(≥2350)
  ━━━━━━━━━━━━━
  ⚙️ 限制与避让：
  • 境界 30+ 才能入场
  • 每日 5 场（高级月卡 +3 场）
  • 同对手 6 小时冷却
  • 守方每日被锁定 10 次上限
  • 连胜 10 场后凶名收益减半
  • 斗法间隔 60 秒（残魂凝聚时间）
  ━━━━━━━━━━━━━
  💎 单场奖励：
  胜：涨凶名 + 100 魂晶
  负：扣凶名 + 30 魂晶
  每日首胜额外 +200 魂晶
  ━━━━━━━━━━━━━
  🏆 赛季奖励 (每月底自动结算)：
  第 1 名：称号「诡道煞君」+ 1000香火 + 5稳定水晶
  第 2-3 名：「斗煞尊」+ 500香火 + 3稳定水晶
  第 4-10 名：「煞道名宿」+ 300香火 + 2稳定水晶
  第 11-50 名：「斗煞新秀」+ 100香火 + 1稳定水晶
  第 51-100 名：50香火
  100 名后参与奖：20香火
  软重置：凶名高于 1500 的部分压缩 70%
  ━━━━━━━━━━━━━
  💎 魂晶商店物品：
  斗法令 50魂晶 - 立即增加 1 次今日斗法次数
  灵气补给 200魂晶 - 立即获得 50 香火
  稳定水晶 800魂晶 - 升阶护身（蓝色品质）×1
  洗词石 300魂晶 - 装备词缀洗炼 ×1
  改名卡 1500魂晶 - 修改角色名称（每日限购 1）
  ━━━━━━━━━━━━━
  💡 守方下次上线时会收到残魂受袭通知
  💡 主动出手斗法不受"残魂已隐"状态影响
  💡 即使隐匿残魂，仍可主动发起斗法
