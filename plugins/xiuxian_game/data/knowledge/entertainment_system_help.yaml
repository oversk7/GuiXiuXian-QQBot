  ━━━━━━━━━━━━━
  **🎯 日常**
  【签到】 每日奖励 | 【签到日历】 本月记录 | 【月卡】 状态与权益
  【抽签 你的问题】 观音灵签，含签诗解签
  【起卦 你的问题】 六爻占卜，500金币
  【答案之书 你的问题】 | 【驾考题目 科目】 科目一~四，默认科目一
  【每日一言】 | 【今天吃什么】 附食材做法 | 【微博热搜】 TOP20
  【吃掉 QQ号】 生成吃头像GIF
  ━━━━━━━━━━━━━
  **🎮 小游戏**
  【恶魔轮盘帮助】 PVP博弈，税3%
  【斗兽棋】 双人棋局带押注，税3%
  • 常用：斗兽棋 创建 / 加入 / 筹码 金币数 / 开始 / 走 虎 上 / 状态
  • 【斗兽棋 规则】 图文规则 | 【斗兽棋下注 玩家名 金币数】 旁观下注
  【海龟汤帮助】 多人AI推理猜谜
  【人机轮盘 金额】 私聊人机对战
  【猜拳 石头 金额】 猜拳鬼，仅周六，1000金币起
  【试炼列表】 互动剧情 | 【已通关试炼】
  ━━━━━━━━━━━━━
  **💳 月卡权益**
  修炼闭关效率与时长提升、背包扩容、签到月卡宝箱、一键献祭修复等
  购买方式见 【赞助】
  ━━━━━━━━━━━━━
