body: |
  ✨ 娱乐系统 ✨
  签到、小游戏、互动剧情等休闲玩法
  ━━━━━━━━━━━━━
  🎯 日常活动:
  【签到】 每日签到,获取奖励
  【月卡】 查看月卡状态和权益
  【抽签 [你的问题]】 观音灵签占卜,显示签运、签诗、解签和签文图片
  【答案之书 你的问题】 向宇宙提问,获得智慧指引
  【驾考题目 [科目]】 随机驾考题目,支持科目一~四(默认科目一)
  【每日一言】 获取励志名言警句
  【今天吃什么】 获取随机食谱推荐,含食材和制作步骤
  【微博热搜】 查看实时微博热搜榜TOP20
  【吃掉 QQ号】 生成吃掉指定QQ号头像的GIF动图
  ━━━━━━━━━━━━━
  🎮 小游戏:
  【恶魔轮盘帮助】 PVP对战博弈游戏(3%税收)
  【人机轮盘 金额】 私聊对战AI版恶魔轮盘（私聊使用）
  【斗兽棋】 双人斗兽棋，支持主押注和旁观下注（3%税收）
    常用：斗兽棋 创建 / 加入 / 筹码 金币数 / 开始 / 走 虎 上 / 状态
    旁观：斗兽棋下注 玩家名 金币数 / 查看斗兽棋下注
  【猜拳 石头/剪刀/布 金额】 猜拳鬼（仅限周六，1000+金币）
  【试炼列表】 查看可用的互动剧情
  【已通关试炼】 查看已通关的试炼记录
  ━━━━━━━━━━━━━
  💳 月卡权益:
  • 修炼闭关效率提升
  • 闭关时长增加
  • 背包扩容
  • 签到获得月卡宝箱
  • 一键献祭、一键修复等便捷功能
  ━━━━━━━━━━━━━
  📱 发送【赞助】查看月卡购买方式
