body: |
  ✨ 里界系统 ✨
  现实与诡域的交界处，被诡异污染的人类聚落
  ━━━━━━━━━━━━━
  ⚠️ 系统状态：迭代开发中
  🔒 访问权限：仅管理员可用
  ━━━━━━━━━━━━━
  🌌 核心玩法：
  • 2D6骰子判定系统
  • 碎片拼图叙事
  • 多结局结算
  • 自由探索掠夺
  • 理智系统与认知篡改

  ━━━━━━━━━━━━━
  📍 基础命令：
  【里界】 查看可进入的里界列表
  【传送 里界名】 进入指定里界
  【上/下/左/右】 在地图上移动（25×25地图）
  【移动 方向】 移动（方向：上/下/左/右）
  【观察】 仔细查看当前位置和周围环境
  【里界信息】 查看当前里界统计
  【返回】 离开里界并结算结局

  ━━━━━━━━━━━━━
  🎯 事件命令：
  【搜刮】 搜索当前位置（2D6+幸运判定）
  【威吓】 威吓NPC（2D6+攻击判定）
  【处决】 静默击杀目标（2D6+敏捷判定）
  【攻击】 主动攻击NPC/BOSS（进入战斗）
  【交谈】 与NPC对话，获取信息
  【救助】 救助幸存者，恢复理智
  【查看线索】 查看已收集的线索列表

  ━━━━━━━━━━━━━
  🎲 骰子判定：
  • 投掷2个D6骰子
  • 加上属性修正（幸运/攻击/敏捷/智力）
  • 加上时间加成（白天/黄昏/深夜）
  • 结果：2-3大失败、4-6失败、7-9普通成功、10-11成功、12+大成功

  ━━━━━━━━━━━━━
  🧠 理智系统：
  • 理智值范围：0-100
  • 🟢 70+：理智稳定
  • 🟡 50-69：开始不稳（篡改概率×1.5）
  • 🔴 30-49：严重损坏（篡改概率×2.0）
  • 💀 <30：接近崩溃（极度危险篡改可能触发）

  理智损失触发：
  • 目睹死亡：-5
  • 阅读令人不安的线索：-8
  • 遭遇核心诡异：-15
  • 击杀无辜者：-3
  • 在里界停留过久：-2/小时

  理智恢复方式：
  • 救出幸存者：+5
  • 揭示真相（收集线索）：+10
  • 击败核心诡异：+15
  • 离开里界：+20

  ━━━━━━━━━━━━━
  ⚠️ 认知篡改系统：
  理智值越低，越容易触发认知篡改事件：

  • 幻影（15%）：看到不存在的NPC，攻击时发现是幻觉
  • 记忆错乱（10%）：击杀数±1-3，坐标记忆偏移
  • 感官扭曲（20%）：EMPTY显示为NPC，LOOT显示为CLUE
  • 时间错乱（8%）：时间显示错误，冷却时间感知错误

  极度危险篡改（仅在理智<30时触发）：
  • 身份混淆（5%）：「等等...我来这里是为了什么？」
    - 暂时忘记进入里界的目的
    - 看到的NPC对话变成自己的独白
  • 真相反转（3%）：也许...一切都反过来了？
    - 线索内容反转（受害者变成施暴者）
    - NPC台词含义反转

  💡 使用【里界信息】可查看当前理智值和认知异常状态

  ━━━━━━━━━━━━━
  🌍 首批里界：
  • 第三病栋（Lv.50）- 废弃医院，器官摘取实验
  • 活棺村（Lv.100）- 诡异村庄，视角反转
  • 荔湾鬼镇（Lv.150）- 废弃城镇，时间循环
  • 末班列车（Lv.200）- 永不停靠的列车
  • 红月孤儿院（Lv.250）- 儿童献祭仪式

  ━━━━━━━━━━━━━
  🏆 多结局系统：
  • 屠夫：击杀>80%居民
  • 真相：收集全部线索
  • 救世：救出>50%幸存者
  • 猎人：击败核心BOSS
  • 毁灭：杀光一切+击败BOSS（最高奖励）

  ━━━━━━━━━━━━━
  💡 提示：
  • 每日0点里界刷新（居民复活、物品刷新）
  • 玩家独立实例，互不影响
  • 结局根据行为自动判定

  ━━━━━━━━━━━━━
  ⚠️ 当前状态：Phase 2 - 完整可玩版本
  已实现：
  • ✅ 传送、移动、探索系统
  • ✅ 2D6骰子判定系统（搜刮/威吓/处决）
  • ✅ 完整战斗系统（NPC/BOSS战斗）
  • ✅ LOOT生成和奖励发放
  • ✅ 理智系统和认知篡改
  • ✅ 多结局结算系统

  后续版本：更多里界地图、更多事件类型
