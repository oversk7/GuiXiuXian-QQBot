body: |
  诡域深处的凝固时空，修炼者的试炼之地
  ━━━━━━━━━━━━━
  **🌌 核心玩法**
  • 场景节点探索（非坐标移动）
  • 2D6骰子判定系统
  • 修为被压制为凡人，靠智慧存活
  • 多结局结算
  • 死亡=空手而归
  ━━━━━━━━━━━━━
  **📍 基础命令**
  【里界】 查看可进入的里界列表
  【传送 里界名】 进入指定里界（也可用【进入里界 里界名】）
  【前往 场景名】 移动到指定场景
  【前往】 查看可前往的场景列表
  【观察】 仔细查看当前场景（发现隐藏线索，别名：环顾/查看环境）
  【里界信息】 查看当前探索状态
  【返回】 离开里界并结算结局
  ━━━━━━━━━━━━━
  **🎯 互动命令**
  【搜刮】 搜索当前场景（2D6+属性判定）
  【威吓】 威吓NPC（2D6+属性判定）
  【处决】 静默击杀NPC（2D6+属性判定）
  【交谈】 与NPC对话，获取信息
  【选择 选项名】 在特殊事件中做出选择
  【休息】 在安全场景休息恢复理智
  ━━━━━━━━━━━━━
  **🎒 道具命令**
  【道具】 查看里界内持有的道具
  【使用 道具名】 使用道具（如过期罐头恢复理智）
  【查看线索】 查看所有已收集的线索（别名：线索列表/已收集线索）
  ━━━━━━━━━━━━━
  **🎲 骰子判定**
  • 投掷2个D6骰子 + 属性修正（修为被压制，修正值较低）
  • 2-3 大失败 | 4-6 失败 | 7-9 普通成功
  • 10-11 成功 | 12+ 大成功
  ━━━━━━━━━━━━━
  **🧠 理智系统**
  • 初始理智100，归零则试炼失败
  • 搜刮失败、遭遇鬼怪会损失理智
  • 使用过期罐头可恢复10点理智
  ━━━━━━━━━━━━━
  **🏆 结局系统**
  • 黎明幸存者：存活到黎明（x1.5奖励）
  • 真相揭示者：收集全部线索（x2.5奖励）
  • 屠镇者：击杀所有凡人NPC（x2.0奖励）
  • 猎物：被杀死（清零）
  • 理智崩溃：理智归零（清零）
  ━━━━━━━━━━━━━
  **🌍 可用里界**
  • 荔湾鬼镇（Lv.50）- 凝固时空中的恐怖小镇
  ━━━━━━━━━━━━━
  **💡 提示**
  • 天黑后不能在户外停留，否则必死
  • 鬼怪无法正面对抗，只能智取或规避
  • 线索收集进度永久保存，死亡不会丢失
  • 物品和金币在死亡时清零，存活才能带走
  • 首次通关有额外奖励
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
