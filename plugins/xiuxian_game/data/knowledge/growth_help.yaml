body: |
  ⚔️ 成长核心 ⚔️
  装备、锻造、炼丹、阴宅——战力怎么涨
  ━━━━━━━━━━━━━
  🎽 装备线：
  【装备栏】 查看已有装备
  【装备 编号/名称】 穿戴装备
  【卸下 编号/名称】 卸下装备
  【修理 编号/名称】 修理装备
  【锻造列表】 查看可锻造装备
  【锻造 装备名】 在工坊附近锻造
  【升阶 编号/名称】 升阶强化装备
  ━━━━━━━━━━━━━
  💎 镶嵌系统：
  【孔位 编号/名称】 查看装备孔位
  【镶嵌 编号 孔位 镶嵌物】 镶嵌宝石
  【镶嵌物品】 查看可镶嵌物品
  ━━━━━━━━━━━━━
  🧪 炼丹线：
  【丹方】 查看可炼丹方
  【炼丹 丹方名 数量】 炼制丹药
  【收获丹药】 收获炼好的丹药
  【使用 丹药名 数量】 服用丹药
  ━━━━━━━━━━━━━
  💀 怨念系统：
  【献祭 材料名 数量】 献祭材料获取怨念
    用于【突破 镇厄】确保突破成功
  ━━━━━━━━━━━━━
  🏠 阴宅（修炼基地）：
  【阴宅】 查看阴宅状态
  【购买阴宅】 花1000万金币购买
  【升级阴宅】 提升等级加成
  【阴宅仓库】 个人存储空间（在阴宅位置使用）
  ━━━━━━━━━━━━━
  💡 卡境界→先突破  战力低→先装备
  💡 药不够→炼丹或去市场买
  💡 发送【装备系统】【炼丹系统】【阴宅系统】看详细帮助
