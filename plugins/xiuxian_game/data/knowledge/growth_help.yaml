id: "growth_help"
title: "成长核心"
keywords:
  - 成长核心
  - 装备
  - 锻造
  - 炼丹
  - 升阶
  - 阴宅
  - 镶嵌
  - 献祭
  - 怨念
  - 丹方
  - 收获丹药
  - 修理
  - 孔位
  - 宝石
body: |
  成长核心：装备、锻造、炼丹、阴宅
  ━━━━━━━━━━━━━
  🎽 装备：
  【装备栏】 已有装备
  【装备 编号/名称】 穿戴 | 【卸下 编号/名称】 | 【修理 编号/名称】
  【锻造列表】 可锻造清单 | 【锻造 装备名】 需在工坊附近
  【升阶 编号/名称】 升阶强化
  ━━━━━━━━━━━━━
  💎 镶嵌：
  【孔位 编号/名称】 孔位详情
  【镶嵌 编号 孔位 镶嵌物】 镶嵌宝石 | 【镶嵌物品】 可用镶嵌物
  ━━━━━━━━━━━━━
  🧪 炼丹：
  【丹方】 → 【炼丹 丹方名 数量】 → 【收获丹药】 → 【使用 丹药名 数量】
  ━━━━━━━━━━━━━
  💀 怨念：
  【献祭 材料名 数量】 材料换怨念，供【突破 镇厄】使用
  ━━━━━━━━━━━━━
  🏠 阴宅：
  【阴宅】 状态 | 【购买阴宅】 售价1000万金币
  【升级阴宅】 提升加成 | 【阴宅仓库】 个人仓库，须在阴宅位置
  ━━━━━━━━━━━━━
  卡境界先突破，战力低先补装备，缺药就炼丹或去市场
  详细帮助见【装备系统】【炼丹系统】【阴宅系统】
