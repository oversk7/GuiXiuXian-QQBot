body: |
  诡域机制细节（供AI客服解答，均为当前实现的准确数值）
  **理智与咒抗**
  • 同层移动、换层、传送均消耗理智；消耗 = 深度÷10（向下取整，最低1）
  • 咒抗基础上限10点，【签到】重置回满（月卡+5）；进诡域每次耗1点，扫荡令每张耗1点；导航"灵泉"事件也可少量恢复
  • 理智归零＝疯狂身亡（血量清零、连杀清零），但不掉物品、不掉装备、不掉境界；可【使用 还魂丹】原地复活或【返回】重置
  **收益数值**
  • 战斗经验 = 随机1~4 × 怪物等级（怪物等级≈深度×5±2），越深经验越高
  • 无伤连杀每满5杀返还理智 = 当层理智消耗×2；受伤、死亡、回现实都清零
  • 掉落稀有度随深度提升，大致：40重后开始出橙（1%），紫从20重后明显提升
  • 每探索到10的倍数深度可领1个深渊探索者宝箱（【探索宝箱】查看、【领取宝箱】领取，每层限一次），开出镶嵌物和材料
  **格子事件**
  • 六类：普通诡异（最常见）、精英诡异、材料、宝箱/神像（金币2000-8000×幸运，极低概率出稀有诡兽/诡兽精魄）、驿站（回满血）、卖货郎（卖稀有材料和低级宝石，每人限购一次）
  • 每重精英数量随机（低层平均约3~4个，深层更多），进层时自动报数量但不报位置
  **精英与深层怪**
  • 精英三维为普通怪1.8~2.5倍（越深越高），掉装备概率显著更高，铭文只有精英掉
  • 怪物等级≥200（约40重起）开始带暴击/连击/反击/抗暴等词条，1000级（约200重）后大幅增强
  **扫荡令**
  • 须在诡域内使用；每张耗1咒抗，扫荡格数受理智和装备耐久限制
  • 扫荡最多将已穿戴装备扣至1点耐久，不会自动卸下；耐久过低时先【一键修理】，修好后无需重新穿戴
  • 扫荡按比例分配：75%怪物格、20%材料格、5%驿站格；不含宝箱和卖货郎（需手动探索）
  • 扫荡同样扣理智和血量，理智耗尽同样疯狂身亡
  • 【扫荡设置】查看当前规则；可自由指定白/绿/蓝/紫/橙中的一个或多个品阶，例如【扫荡设置 蓝 橙】只留蓝、橙，紫色也舍弃；【扫荡设置 紫】只留紫色；【扫荡设置 蓝以上】保留蓝、紫、橙
  • 【扫荡设置 无】或【扫荡设置 不保留】不保留任何材料；不带参数仅查看当前规则，不会清空选择
  • 【扫荡设置 全部】恢复默认保留全部，设置长期保存；筛选只影响扫荡新获得的材料，不会清理背包已有物品
  • 未选中品阶的材料直接舍弃，不兑换金币或其他资源，经验与扫荡消耗照常计算
  • 本次怪物格与材料格掉落统一按橙→紫→蓝→绿→白优先入包，相同物品合并；报告分别显示实际获得、按设置舍弃和背包满溢出
  • 符合品质设置的材料仍受背包容量限制，能放多少装多少，放不下的部分提示溢出丢失；扫荡前建议先清背包
