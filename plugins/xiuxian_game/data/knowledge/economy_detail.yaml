body: |
  跑商与银行机制细节（供AI客服解答，均为当前实现的准确数值）
  **跑商**
  • 跑商商品合计携带上限500个（血契丹/阴冥草/鱼/调料不占额度）
  • 跑商奖励与跑商税都只在"跨市场"生效：本地24小时内买过该商品，卖出时既无奖励也不收税
  • 商人阶梯加价按当日同市集同商品已购量：1-30原价，31-80×1.12，81-150×1.28，150+×1.48
  • 产地集群购买85折；异地收购价按距离加成×1.08/1.18/1.30
  • 价格每日0点随机±30%，收购价=售价的72%-82%，另受供需因子0.5-2倍影响
  • 连续跑商奖励按"连续有跨市场交易的天数"判定，最多回溯7天
  • 诡域内不能买卖，只能回大都会交易
  **黑市**
  • 每日随机上架3-6种（升阶石/稳定水晶等），溢价10倍，库存10-20，每人每日限购50件
  **银行与理财**
  • 存款无利息，但绝对安全：不会被抢、不参与任何扣除；【转账】扣的是银行存款，限同区
  • 活期理财：最低1万/最高100万，每日收益±5%内随机（期望为零），管理费0.1%/天，指令【购买理财】【赎回理财】
  • 定期理财：最低5万/最高1000万，同一时间只能持有一笔，到期前不可赎回；周利率5%扣息10%管理费，净约4.5%
