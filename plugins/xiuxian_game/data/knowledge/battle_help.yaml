body: |
  战斗挑战：PVE、PVP、世界BOSS
  ━━━━━━━━━━━━━
  ⚔️ PVE：
  【攻击 NPC名】 攻击怪物或NPC
  荒野与诡域为真实战斗，死亡掉落；城镇是安全区，只能切磋
  ━━━━━━━━━━━━━
  🤝 PVP：
  【切磋 UID】 友好切磋，无损失
  【攻击 UID】 真实死斗，限荒野/诡域（城镇内自动按切磋处理）
  目标在自己公会势力范围内时无法被发起死斗
  ━━━━━━━━━━━━━
  🌟 世界BOSS：
  【世界BOSS】 信息 | 【讨伐BOSS】 每日3次 | 【BOSS排行】 伤害榜
  ━━━━━━━━━━━━━
  📋 战斗日志：
  【日志模式】 当前模式
  【日志模式 详细】 含减伤、吸血、buff等全细节，默认
  【日志模式 简洁】 仅攻击与结果
  ━━━━━━━━━━━━━
  📊 战力：
  【战力】 完整属性 | 【战力说明】 属性作用 | 【死斗日志】 战斗记录
  ━━━━━━━━━━━━━
  战力大头在装备与丹药；属性详解见【战斗系统】
