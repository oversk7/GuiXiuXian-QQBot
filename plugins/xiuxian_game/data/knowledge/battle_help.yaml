body: |
  🗡️ 战斗挑战 🗡️
  打谁、掉什么、风险是什么
  ━━━━━━━━━━━━━
  ⚔️ PVE - 打怪：
  【攻击 NPC名】 攻击怪物/NPC
    荒野/诡域：真实战斗，死亡掉落
    城镇安全区：只能友好切磋
  ━━━━━━━━━━━━━
  🤝 PVP - 对战：
  【切磋 UID】 友好切磋（无损失）
  【攻击 UID】 真实战斗（荒野/诡域）
  ━━━━━━━━━━━━━
  🌟 世界BOSS：
  【世界BOSS】 查看BOSS信息
  【讨伐BOSS】 攻击BOSS（每日3次）
  【BOSS排行】 查看伤害排行
  ━━━━━━━━━━━━━
  📋 日志设置：
  【日志模式】 查看当前战斗日志模式
  【日志模式 详细】 显示完整战斗细节（含防御减伤、吸血、buff等）
  【日志模式 简洁】 仅显示攻击和结果（默认）
  ━━━━━━━━━━━━━
  📊 查看战力：
  【战力】 查看完整战斗属性
  【战力说明】 各项属性作用
  【死斗日志】 战斗记录
  ━━━━━━━━━━━━━
  💡 战斗核心：攻击/防御/暴击/连击/闪避/反击
  💡 装备和丹药是提升战力的关键
  💡 发送【战斗系统】看详细属性说明
