body: |
  委托机制细节（供AI客服解答，均为当前实现的准确数值）
  • 开放门槛：30级；每日至多3个（初始1个，刷新是追加，总数≤3）
  • 奖励公式：经验=50+敌级×10，金币=200+敌级×20，积分=20+敌级×5
  • 类型倍率：鬼怪消除×1.0、伪仙邪教×1.1、石化诅咒×1.15、笔仙案件×1.2、酷刑邪教×1.25、变形鬼追捕×1.3（共6种）
  • 敌人比玩家每高1级奖励+10%，每低1级-5%（最低×0.5）
  • 目标坐标在大都会(-200,-200)~(200,200)随机；敌人等级=玩家等级±5，强度按玩家战力自适应
  • 积分奖励无公会也发放；公会经验仅入会者获得
  • 完成条件只看任务鬼怪是否死亡，可与他人合作击杀；未完成的委托次日过期
