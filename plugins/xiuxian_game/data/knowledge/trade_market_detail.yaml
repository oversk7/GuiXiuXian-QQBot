body: |
  挂牌市场与拍卖行机制细节（供AI客服解答，均为当前实现的准确数值）
  **挂牌市场**
  • 卖单低于系统建议底价会被自动抬到底价；挂牌价上限为底价8倍，超过直接拒绝；单价最低10金
  • 跑商商品（GOODS）禁止挂牌；VIP定制装备禁止交易；市集买入8小时内的物品不能挂牌
  • 装备/铭文只能单件挂出售；已装备、已锁定、已在交易中的实例不可挂
  • 收购单会冻结金币（单价×数量），卖单冻结物品，撤牌退回
  • 交易税只从卖家收入扣（销毁回收）：5000内免税，5001-2万部分5%，2万-5万10%，5万-10万15%，10万以上20%
  • 买单撮合价低于挂价时自动退差价；撮合时买家背包满会中断
  • 底价与全服财富水平联动（Top100金币中位数），还参考近7日成交均价
  **拍卖行**
  • 普通物品每单固定1件，不支持数量参数；装备需未装备、未锁定、不在挂牌市场
  • 首次出价只需≥起拍价，此后每次≥当前价×105%；已是最高出价人不能连续加价
  • 不能参与其他区服的拍卖
  • 到期由每5分钟的定时任务结算，成交/流拍双方都会收到通知
