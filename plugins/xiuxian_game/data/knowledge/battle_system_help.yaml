body: |
  玩家对战、NPC战斗、世界BOSS挑战
  ━━━━━━━━━━━━━
  **⚔️ 玩家对战**
  【切磋 UID】 友好切磋，无损失
  【攻击 UID】 攻击目标（可攻击NPC）
  城镇安全区: 只能友好切磋
  荒野/诡域: 真实死斗，死亡掉落
  公会保护: 目标处于自己公会势力范围内时无法被发起死斗
  ━━━━━━━━━━━━━
  **🏆 斗法天梯（残魂对决）**
  【斗法天梯】 主页 | 【斗法天梯 匹配】 入场斗法（肉身不损）
  【斗法天梯帮助】 详细规则
  ━━━━━━━━━━━━━
  **🌟 世界BOSS**
  【世界BOSS】 查看BOSS信息和血量
  【讨伐BOSS】 攻击BOSS（每日3次）
  【BOSS排行】 查看伤害排行榜
  每日重置次数 | 击杀全服奖励 | 排名额外奖励
  ━━━━━━━━━━━━━
  **📋 日志设置**
  【日志模式】 查看当前模式
  【日志模式 详细】 完整战斗细节（含防御减伤、吸血、buff等）
  【日志模式 简洁】 仅攻击和结果（默认）
  ━━━━━━━━━━━━━
  **📊 战力相关**
  【战力】 查看完整属性 | 【战力说明】 属性作用
  【死斗日志】 真实战斗记录 | 【加点帮助】 加点指南
  ━━━━━━━━━━━━━
  **💡 战斗属性说明**
  攻击/防御: 基础伤害和减伤
  暴击率/暴击力: 暴击概率和伤害倍率
  连击率: 触发连击（2-4次）的概率
  反击率: 受攻击时反击概率
  闪避率: 躲避攻击概率 | 命中率: 命中敌人概率
  敏捷: 影响先手顺序，敏捷高更容易先手
  💡 装备效果和战斗丹药可大幅提升战力
  ━━━━━━━━━━━━━
  > 【炼丹系统】 战斗丹药 | 【装备系统】 装备强化 | 【帮助】 返回
