body: |
  ━━━━━━━━━━━━━
  **⚔️ 对战**
  【切磋 UID】 友好切磋，无损失
  【攻击 UID】 攻击玩家或NPC
  • 城镇为安全区，只能切磋；荒野与诡域是真实死斗，死亡掉落
  • 目标在自己公会势力范围内时，无法被发起死斗
  ━━━━━━━━━━━━━
  **🏆 斗法天梯**
  残魂对决，肉身不损
  【斗法天梯】 主页 | 【斗法天梯 匹配】 入场 | 【斗法天梯帮助】 规则
  ━━━━━━━━━━━━━
  **🌟 世界BOSS**
  【世界BOSS】 信息与血量 | 【讨伐BOSS】 每日3次 | 【BOSS排行】 伤害榜
  • 击杀有全服奖励，排名另有加成
  ━━━━━━━━━━━━━
  **📋 战斗日志**
  【日志模式】 当前模式
  【日志模式 详细】 含减伤、吸血、buff等全细节
  【日志模式 简洁】 仅攻击与结果，默认
  ━━━━━━━━━━━━━
  **📊 战力**
  【战力】 完整属性 | 【战力说明】 属性作用
  【死斗日志】 战斗记录 | 【加点帮助】
  ━━━━━━━━━━━━━
  **📖 属性一览**
  攻击/防御：基础伤害与减伤
  暴击率/暴击力：暴击概率与伤害倍率
  连击率：触发2-4连击的概率 | 反击率：受击反击概率
  闪避率：躲避概率 | 命中率：命中概率
  敏捷：决定先手顺序
  ━━━━━━━━━━━━━
  > 战力大头在装备与战斗丹药
  > 【炼丹系统】 | 【装备系统】 | 【帮助】 返回
