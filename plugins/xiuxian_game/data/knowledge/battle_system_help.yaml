body: |
  ✨ 战斗系统 ✨
  玩家对战、NPC战斗、世界BOSS挑战
  ━━━━━━━━━━━━━
  ⚔️ 玩家对战：
  【切磋 UID】 友好切磋，无损失
  【攻击 UID/NPC】 攻击目标
    • 城镇安全区：只能友好切磋
    • 荒野/诡域：真实死斗，死亡掉落
    • 公会保护：目标处于自己公会势力范围内时无法被发起死斗
  ━━━━━━━━━━━━━
  🏆 斗法天梯（残魂对决·肉身不损）：
  【斗法天梯】 主页 - 查看段位/凶名/战绩
  【斗法天梯 匹配】 入场斗法一次
  【斗法天梯帮助】 详细规则说明
  ━━━━━━━━━━━━━
  🌟 世界BOSS：
  【世界BOSS】 查看BOSS信息和血量
  【讨伐BOSS】 攻击BOSS（每日3次）
  【BOSS排行】 查看伤害排行榜
    • 每日重置挑战次数
    • 击杀BOSS全服玩家获得奖励
    • 根据伤害排名获得额外奖励
  ━━━━━━━━━━━━━
  📊 战力相关：
  【战力】 查看自身完整属性
  【战力说明】 查看各项战斗属性的作用
  【死斗日志】 查看真实战斗记录
  【加点帮助】 查看基本属性加点指南
  ━━━━━━━━━━━━━
  💡 战斗属性说明：
    • 攻击/防御：基础伤害和减伤
    • 暴击率/暴击力：暴击概率和伤害倍率
    • 连击率：触发连击（2-4次）的概率
    • 反击率：受到攻击时反击的概率
    • 闪避率：躲避攻击的概率
    • 命中率：命中敌人的概率
    • 敏捷：影响先手顺序
  ━━━━━━━━━━━━━
  💡 敏捷高的玩家更容易先手
  💡 装备效果和战斗丹药可大幅提升战力
