body: |
  ✨ 气运投资系统 ✨
  修仙界的气运交易，高风险高收益
  ━━━━━━━━━━━━━
  📋 基本命令：
  【投资行情】 查看所有可投资的气运及灵力指数
  【投资刷新时间】 查看气运价格刷新时间
  【投资气运 <代码> <数量> [银行]】 投资气运
  【出售气运 <代码> <数量> [银行]】 出售气运
  【我的投资】 查看投资情况和灵力预警
  【投资记录】 查看投资记录
  【气运事件】 查看市场黑天鹅事件（重大崩盘）
  ━━━━━━━━━━━━━
  🎮 新手快速入门（3步）：
  1️⃣ 【投资行情】 看看哪个气运有绿光🟢（灵力充沛）
  2️⃣ 【投资气运 代码 10】 买10份试试水（建议100金币以内）
  3️⃣ 等1小时后价格涨了，就【出售气运 代码 10】卖掉赚钱
     如果跌了也别慌，可以等等看会不会涨回来
  ━━━━━━━━━━━━━
  ⚠️ 重要风险（必看！）：
  • ⚡ 灵力指数系统：气运消耗过度会"灵力枯竭"
    - 🟢 绿光（70-100）= 灵力充沛，可投资
    - 🟡 黄光（30-69）= 灵力不稳，需谨慎
    - 🔴 红光（0-29）= 濒临枯竭，快出手！再跌就完蛋了
    - 💀 灵力归零 = 气运消散，你的钱全没了！

  • 💸 每天要交保管费：每天扣0.1%（1000金币扣1金币）
    持有时间越长，扣的钱越多，所以别放太久

  • 💰 买卖要手续费：买+卖总共1%（100金币扣1金币）

  • 🌪 黑天鹅事件：每周有15%概率发生突发崩盘
    会导致气运暴跌40-50%，健康度-60，无法预测！
    发送【气运事件】查看最近发生的重大事件

  • 🎲 气运变化完全随机：涨跌全看天意，没有"必赚"的方法
    就像抛硬币，涨和跌的概率差不多
  ━━━━━━━━━━━━━
  💡 新手防坑指南：
  • ❌ 别把所有钱投进去！只用你愿意输掉的钱
  • ❌ 别all in一种气运！多买几种分散风险
  • ✅ 看到红光🔴（灵力<30）赶紧出手，别心疼
  • ✅ 赚了就跑，别贪心想赚更多
  • ✅ 短期玩玩（1-2周）比长期拿着好，避免保管费
  • ⚠️ 这是高风险玩法，可能血本无归！新手建议先打工赚钱
  ━━━━━━━━━━━━━
  📖 举个例子：
  小明有1000金币，投资了10份甲气运（每份10金币）
  • 情况1：涨到15金币/份，卖掉赚50金币（150-100-手续费）✅
  • 情况2：跌到5金币/份，灵力变红🔴，赶紧止损
    如果不卖继续跌，灵力归零，气运消散，100金币全没了💀
  ━━━━━━━━━━━━━
  💡 想了解银行存款和跑商赚钱？发送【经济系统】查看
