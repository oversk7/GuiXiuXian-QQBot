body: |
  气运交易，高风险高波动，可能血本无归
  ━━━━━━━━━━━━━
  **📋 指令**
  【投资行情】 全部气运及灵力指数 | 【投资刷新时间】 价格刷新时间
  【投资气运 代码 数量】 买入，可加 银行 走存款
  【出售气运 代码 数量】 卖出，可加 银行
  【我的投资】 持仓与健康度预警 | 【投资记录】
  【气运事件】 黑天鹅事件记录
  ━━━━━━━━━━━━━
  **🎮 入门三步**
  【投资行情】 挑健康度高的绿光气运 → 【投资气运 代码 10】 小仓试水
  → 涨了 【出售气运 代码 10】 落袋
  ━━━━━━━━━━━━━
  **⚠️ 风险**
  • 健康度：🟢 70-100健康 | 🟡 30-69偏低 | 🔴 0-29危险
  • 健康度归零气运消散（退市），投资清零
  • 每日保管费0.1%，买卖手续费共1%
  • 黑天鹅：每周一凌晨检查，多种崩盘事件各约5-7%概率，暴跌38-52%，无法预测
  • 涨跌完全随机，不存在必赚方法
  ━━━━━━━━━━━━━
  • 只投输得起的钱，多品种分散
  • 红光尽快出手，获利落袋别贪
  • 持有1-2周为宜，久持保管费吃利润
  ━━━━━━━━━━━━━
  > 【经济系统】 银行/跑商 | 【帮助】 返回
