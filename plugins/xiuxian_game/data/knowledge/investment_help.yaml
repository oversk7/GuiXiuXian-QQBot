body: |
  修仙界的气运交易，高风险高收益
  ━━━━━━━━━━━━━
  **📋 基本命令**
  【投资行情】 查看所有可投资的气运及灵力指数
  【投资刷新时间】 查看气运价格刷新时间
  【投资气运 代码 数量】 投资气运（可加 银行）
  【出售气运 代码 数量】 出售气运（可加 银行）
  【我的投资】 查看投资情况和灵力预警
  【投资记录】 查看投资记录
  【气运事件】 查看市场黑天鹅事件（重大崩盘）
  ━━━━━━━━━━━━━
  **🎮 新手快速入门（3步）**
  1. 【投资行情】 看哪个气运灵力充沛（绿光）
  2. 【投资气运 代码 10】 买10份试试水
  3. 涨了就 【出售气运 代码 10】 卖掉赚钱
  ━━━━━━━━━━━━━
  **⚠️ 重要风险（必看）**
  灵力指数系统：气运消耗过度会灵力枯竭
  🟢 绿光（70-100）=充沛 | 🟡 黄光（30-69）=谨慎 | 🔴 红光（0-29）=快跑
  💀 灵力归零=气运消散，投资全没
  每天保管费0.1% | 买卖手续费共1%
  黑天鹅事件：每周15%概率突发崩盘，暴跌40-50%，健康度-60，无法预测
  气运涨跌完全随机，没有"必赚"的方法
  ━━━━━━━━━━━━━
  **💡 防坑指南**
  别All in！只用愿意输掉的钱，多种分散风险
  红光（灵力<30）赶紧出手 | 赚了就跑别贪
  短期（1-2周）比长期好，避免保管费
  高风险玩法，可能血本无归，新手建议先打工赚钱
  ━━━━━━━━━━━━━
  > 【经济系统】 银行/跑商 | 【帮助】 返回
