body: |
  在阴宅位置修炼闭关享受效率加成，可开放给他人付费使用
  ━━━━━━━━━━━━━
  **🏠 基础**
  【阴宅】 状态与位置
  【购买阴宅】 在当前位置购入1级阴宅，1000万金币；距城镇市集须20格以上
  【升级阴宅】 需在阴宅位置
  【迁移阴宅】 迁到当前位置，费用为当前等级升级费的50%
  【设置阴宅费用 金币数】 他人使用价，按等级有下限
  【切换阴宅权限】 是否开放他人使用
  【切换阴宅付费意愿】 是否自动付费用别人的阴宅；关闭则不扣费也不享加成
  ━━━━━━━━━━━━━
  **🗃️ 仓库**
  【阴宅仓库】 内容与容量 | 【存入阴宅 物品名 数量】 | 【取出阴宅 序号 数量】
  • 须在自己阴宅位置操作；可存材料、消耗品、宝石
  • 容量随等级：1级50格，10级95格，20级245格，30级545格
  ━━━━━━━━━━━━━
  **⚡ 修炼加成**
  每级+9%，上限30级
  1级+20% | 5级+56% | 10级+101% | 20级+191% | 30级+281%
  ━━━━━━━━━━━━━
  **🌱 灵田加成（种植自动生效）**
  成长加速：1级5% → 10级40% → 20级60% → 30级70%封顶
  产量加成：10级25% → 20级45% → 30级55%封顶（6级起生效）
  ━━━━━━━━━━━━━
  > 【观察】 可查看当前位置的阴宅信息
  > 【帮助】 返回
