body: |
  拥有阴宅可大幅提升修炼效率，支持其他玩家付费使用
  ━━━━━━━━━━━━━
  **🏠 基础操作**
  【阴宅】 查看阴宅状态和位置信息
  【购买阴宅】 在当前位置花费1000万金币购买1级阴宅
  【升级阴宅】 在阴宅位置消耗金币升级等级
  【迁移阴宅】 将阴宅迁移到当前位置
  【设置阴宅费用 金币数】 设置他人使用费用（按阴宅等级有最低要求）
  【切换阴宅权限】 允许/禁止他人使用
  【切换阴宅付费意愿】 设置是否愿意付费使用他人阴宅
  ━━━━━━━━━━━━━
  **🗃️ 阴宅仓库（个人存储空间）**
  【阴宅仓库】 查看仓库内容和剩余容量
  【存入阴宅 物品名 数量】 将背包物品存入仓库
  【取出阴宅 序号 数量】 从仓库取出物品到背包
  ⚠️ 必须在自己的阴宅位置才能存取
  💡 可存入：材料、消耗品、宝石
  💡 容量随等级递增：1级=50格，10级=95格，20级=245格，30级=545格
  ━━━━━━━━━━━━━
  **💡 阴宅等级效率加成（修炼/闭关）**
  每级+9%效率，最高30级
  1级：+20% | 5级：+56% | 10级：+101%
  20级：+191% | 30级：+281%
  💡 在阴宅位置修炼/闭关可享受加成效果，他人阴宅可付费使用
  ━━━━━━━━━━━━━
  **🌱 阴宅灵田加成（种植时自动生效）**
  成长加速（缩短种植时间）：
  1级：5% | 5级：25% | 10级：40% | 20级：60% | 30级：70%（上限）
  规则：1-5级每级+5%，6-10级每级+3%，11-20级每级+2%，21+级每级+1%
  产量加成（增加收获数量）：
  1-5级：0% | 10级：+25% | 20级：+45% | 30级：+55%（上限）
  规则：6-10级每级+5%，11-20级每级+2%，21+级每级+1%
  ━━━━━━━━━━━━━
  **⚙️ 阴宅付费意愿设置**
  • 默认愿意：在他人阴宅修炼会自动支付费用
  • 设为不愿意：不会扣费，但无法享受加成
  ━━━━━━━━━━━━━
  **🚚 阴宅迁移功能**
  • 迁移费用：当前等级升级费用的50%
  • 移动到目标位置后使用【迁移阴宅】命令
  ━━━━━━━━━━━━━
  ⚠️ 不能在城镇市集20格半径范围内建造
  💡 使用【观察】命令可查看当前位置的阴宅信息
  💡 升级阴宅必须在阴宅位置进行
  ━━━━━━━━━━━━━
  > 【帮助】 返回主菜单
