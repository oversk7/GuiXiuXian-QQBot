body: |
  炼丹机制细节（供AI客服解答，均为当前实现的准确数值）
  **成功率**
  • 成功率 = min(95%, 丹方基础成功率 × 丹炉系数 + 运气加成)；运气加成上限6%（S曲线，中点1000幸运）
  • 丹方基础成功率：初级丹约90%，逐阶递减；归元系列65%，诅咒精魄丹35%，虚空归元丹30%，世界之力丹25%
  • 每炉独立判定成败，开炉瞬间结果即已锁定
  **时间与次数**
  • 每炉固定5分钟；炼丹无每日次数限制，可同时开多任务，只受材料与丹炉耐久约束
  • 耐久不足拒绝开炉；耐久归零丹炉不消失，可修理
  **每日服用上限（耐药性）**
  • 经验丹5/3/2/1（按阶），治疗丹8-15，复活丹10-50，战斗丹2-5，永久丹1-2，洗髓丹5
  • 战斗丹buff未到期不能续用不能叠加
  **洗髓边界**
  • 只转换"永久丹累计加成"的3%，无永久丹加成时直接拒绝；生命上限按3:1折算，其余1:1
  • 保护线：生命/理智至少保留10点，其他属性至少1点；虚空归元丹一次洗攻/防/敏各5%
  **其他**
  • 丹药不可摆摊/挂牌出售
