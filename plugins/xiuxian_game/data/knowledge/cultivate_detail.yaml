body: |
  修炼机制细节（供AI客服解答，均为当前实现的准确数值）
  **突破成功率**
  • 一区：30级前必成，30级起80%每级-0.5%，最低10%；失败保留70%修为（基础月卡75%、高级月卡80%）
  • 二区：25级前必成，25级起75%每级-0.6%，最低12%；失败保留80%修为
  • 保底：每失败1次下次成功率+1%（成功率上限95%），连续失败10次后下次必定成功
  • 达到冥返等级（0转300级）后无法再突破，会提示冥返
  **镇厄消耗**
  • 一区 50+15×当前等级 怨念；二区 60+18×等级
  **修炼与闭关收益**
  • 修炼单次 = 基础值×(1+等级/系数)×随机0.8~1.2；一区基础50，二区35
  • 闭关 = 闭关时长/5分钟×同公式×0.5（效率减半）；上限：无月卡7小时/基础月卡9/高级月卡12，赞助特权可无限时长
  • 背包持有棺材钉可提升闭关效率：每根+0.5%，最多100根+50%，不消耗
  • 效率加成来源可叠加：焚金炉、阴宅、月卡、公会建筑、转数
  **幸运暗加成**
  • 修炼收益、闭关收益、突破成功率均吃幸运S曲线加成，各上限+10%（中点800幸运）
  **加点收益（每点）**
  • 体+3生命上限 | 智+1理智上限 | 力+1攻击 | 防+1防御 | 敏+1敏捷 | 运+1幸运
  • 洗点：30级以下【免费洗点】耗5咒抗；30级以上需重启符
  **冥返（转生）**
  • 门槛：首次300级、第2次500级、第3次1000级、此后每次+500级；怨念消耗=当前等级镇厄消耗×10
  • 每转修炼/闭关效率各+50%；升级属性点=(转数×0.5+1)×10（0转10点/1转15/2转20）
  • 冥返重置等级/经验/初始属性；丹药与VIP永久加成保留，装备加成自动重算
  **焚金炉**
  • 最低投入1000金，单次上限500万；每1%充能价格=2500×(1+当前充能/50)，从0充满约50万
  • 任意充值即把衰减档重置回最优档
  **其他**
  • 【连续突破】（别名连突）支持"连续突破 镇厄"；一键献祭为月卡专属
