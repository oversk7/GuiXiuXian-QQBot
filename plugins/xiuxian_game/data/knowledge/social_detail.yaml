id: "social_detail"
title: "社交机制细节（AI客服专用）"
keywords:
  - 礼物日限
  - 礼物好感
  - 散财税
  - 红包税
  - 香火公式
  - 叛师惩罚
  - 拜师条件
  - 魅力怎么来
body: |
  社交机制细节（供AI客服解答，均为当前实现的准确数值）
  **礼物**
  • 各档日限：白20/绿10/蓝5/紫3/橙2/红1；单件好感3~50（小野花3→永恒玫瑰50）
  • 收礼好感1:1转魅力——魅力榜本质是收礼榜
  **红包散财税（超额累进，1万内免税）**
  • 超出部分：1-10万3%、10-100万5%、100-1000万8%、1000万以上12%
  • 份数1-500、每份最低1金、单个最多1000万亿；限同区抢；最后一人拿走全部剩余；抢到的金币稍后到账
  **师徒**
  • 拜师条件：自己注册满24小时，对方比你高50级或转数更高；被拒24小时内不能再申请同一师父
  • 香火：徒弟一转前升级，师父得 升级所需经验÷5000（向上取整）香火；一转后每级固定15
  • 初始徒弟位3个，500香火加1位；每个徒弟使师父修炼效率-1%
  • 叛师惩罚：徒弟随机损失10%-20%属性；师父扣该徒弟累计贡献香火的50%
  **消息**
  • 世界/公会/私信均限120字、需10级
