body: |
  突破境界获得属性点，献祭材料获取怨念保驾护航
  ━━━━━━━━━━━━━
  **🧘 修炼相关**
  【修炼】 获取经验，冷却5分钟
  【闭关】 挂机升级，效率减半
  • 基础闭关：9小时 | 高级月卡：12小时
  【出关】 出关后可继续修炼
  ━━━━━━━━━━━━━
  **⚡ 突破系统**
  【突破】 突破境界，提升等级上限
  • 30级前：100%成功
  • 30级后：成功率递减（最低10%）
  • 失败保留70-80%修为
  【突破 镇厄】 消耗怨念确保成功
  【突破 棺材钉】 使用棺材钉确保成功
  ━━━━━━━━━━━━━
  **📊 属性加点**
  【加点 属性 点数】 分配属性点
  可选属性：力量、体质、敏捷、智力、幸运
  【加点帮助】 查看详细加点指南
  ━━━━━━━━━━━━━
  **💀 怨念系统**
  【献祭 材料名 数量】 献祭材料获取怨念值
  • 不同材料怨念值不同，品质越高怨念值越多，详见【图鉴 材料名】
  ━━━━━━━━━━━━━
  **🔥 焚金炉（充能系统）**
  【焚金】 查看充能状态和炉火状态
  【焚金 金额】 投入金币为焚金炉充能
  • 充能越高修炼/闭关效率越高，满充+100%
  • 非线性成本：充能越高每1%越贵，充满约50万金币
  • 三档衰减（按距上次充值时间）：
    0~6小时 2%/时（炉火旺盛） | 6~12小时 5%/时（炉火渐弱） | 12小时+ 10%/时（炉火熄灭）
  • 勤续费=慢衰减，长期不充=快速归零
  ━━━━━━━━━━━━━
  **🌟 冥返系统**
  【冥返】 轮回转生，重置等级获得永久加成
  • 第1次冥返：需300级 | 第2次：需500级
  • 第3次：需1000级，之后每次+500级
  • 消耗怨念 = 当前等级突破镇厄消耗 x 10
  【冥返信息】 查看转数加成和冥返要求
  ━━━━━━━━━━━━━
  **📈 查询相关**
  【面板】 查看角色面板 | 【战力】 查看战斗属性
  ━━━━━━━━━━━━━
  💡 突破失败会损失部分修为，使用怨念或棺材钉可确保成功
  💡 冥返需要大量怨念，提前准备
  💡 焚金炉、阴宅、月卡、公会建筑可提升修炼效率
  ━━━━━━━━━━━━━
  > 【加点帮助】 详细指南 | 【帮助】 返回主菜单
