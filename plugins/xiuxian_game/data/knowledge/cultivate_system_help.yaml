body: |
  ✨ 修炼系统 ✨
  突破境界获得属性点，献祭材料获取怨念保驾护航
  ━━━━━━━━━━━━━
  🧘 修炼相关：
  【修炼】 获取经验，冷却5分钟
  【闭关】 挂机升级，效率减半
    • 基础闭关：9小时
    • 高级月卡：12小时
  【出关】 出关后可继续修炼
  ━━━━━━━━━━━━━
  ⚡ 突破系统：
  【突破】 突破境界，提升等级上限
    • 30级前：100%成功
    • 30级后：成功率递减（最低10%）
    • 失败保留70-80%修为
  【突破 镇厄】 消耗怨念确保突破成功
  【突破 棺材钉】 使用棺材钉确保成功
  ━━━━━━━━━━━━━
  📊 属性加点：
  【加点 属性 点数】 分配属性点
    可选属性：力量、体质、敏捷、智力、幸运
  【加点帮助】 查看详细加点指南
  ━━━━━━━━━━━━━
  💀 怨念系统：
  【献祭 材料名 数量】 献祭材料获取怨念值
    • 不同材料怨念值不同，详见【图鉴 材料名】
    • 品质越高怨念值越多
  ━━━━━━━━━━━━━
  🔥 焚金（黄金炼化）：
  【焚金 金额】 焚烧黄金，释放封印之力
    • 黄金可隔绝灵异，焚烧时封印破碎化为修为
    • 边际递减：投入越多，每金所得越少
    • 等级联动：境界越高，转化效率越强
    • 无每日限制，最低消耗1000金币
  ━━━━━━━━━━━━━
  📈 查询相关：
  【面板】 查看角色面板信息
  【战力】 查看完整战斗属性
  ━━━━━━━━━━━━━
  💡 提示：
    • 突破失败会损失部分修为
    • 使用怨念或棺材钉可确保成功
    • 阴宅、月卡、公会建筑可提升修炼效率
    • 发送【加点帮助】查看详细指南
