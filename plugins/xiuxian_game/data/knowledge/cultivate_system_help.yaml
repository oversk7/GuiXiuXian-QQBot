body: |
  ━━━━━━━━━━━━━
  **🧘 修炼**
  【修炼】 获取经验，冷却5分钟
  【闭关】 挂机修炼，效率减半；上限9小时，高级月卡12小时
  【出关】 结算收益，之后可继续修炼
  ━━━━━━━━━━━━━
  **⚡ 突破**
  【突破】 提升境界与等级上限
  • 30级前必定成功，此后成功率递减，最低10%
  • 失败保留70-80%修为
  【突破 镇厄】 消耗怨念确保成功 | 【突破 棺材钉】 消耗棺材钉确保成功
  ━━━━━━━━━━━━━
  **📊 加点**
  【加点 属性 点数】 力量/体质/敏捷/智力/幸运
  【加点帮助】 加点推荐
  ━━━━━━━━━━━━━
  **💀 怨念**
  【献祭 材料名 数量】 材料换怨念
  • 品质越高怨念越多，数值见【图鉴 材料名】
  ━━━━━━━━━━━━━
  **🔥 焚金炉**
  【焚金】 充能与炉火状态 | 【焚金 金额】 投金充能
  • 充能越高修炼闭关效率越高，满充+100%
  • 越往上每1%越贵，充满约50万金币
  • 衰减按距上次充值时间分档：6小时内2%/时，6~12小时5%/时，12小时后10%/时
  ━━━━━━━━━━━━━
  **🌟 冥返**
  【冥返】 转生重修，重置等级换永久加成
  • 首次需300级，第2次500级，第3次1000级，此后每次+500级
  • 消耗怨念为当前等级镇厄消耗的10倍，需提前囤积
  【冥返信息】 转数加成与冥返条件
  ━━━━━━━━━━━━━
  【面板】 角色面板 | 【战力】 战斗属性
  ━━━━━━━━━━━━━
  > 修炼效率加成来源：焚金炉、阴宅、月卡、公会建筑
  > 【加点帮助】 | 【帮助】 返回
