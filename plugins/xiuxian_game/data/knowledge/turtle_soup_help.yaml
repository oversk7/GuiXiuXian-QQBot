id: "turtle_soup_help"
title: "海龟汤"
help_command: "海龟汤帮助"
help_aliases:
  - 海龟汤规则
keywords:
  - 海龟汤
  - 加入海龟汤
  - 开始海龟汤
  - 提问
  - 猜汤底
  - 情境猜谜
  - 推理游戏
body: |
  ━━━━━━━━━━━━━
  **🐢 玩法**
  多人推理猜谜：AI 出一道「汤面」（诡异谜面），大家用是非题逼近隐藏的「汤底」（真相）
  ━━━━━━━━━━━━━
  **🎮 流程**
  【海龟汤】 创建房间（每群同时只有一局）
  【加入海龟汤】 加入当前房间
  【开始海龟汤】 开局，15 秒内发送空格分隔的类型关键词（如「猎奇 悬疑 恐怖」），随后 AI 生成谜题
  ━━━━━━━━━━━━━
  **🔍 推理**
  #提问 你的问题 → 主持人只回答 是 / 不是 / 无关
  #猜汤底 你的答案 → 按说中的关键要点加分，每个要点 1 分
  还原核心真相：额外 +3 分并立即揭晓汤底
  限时 20 分钟，结束前 30 秒预警，超时自动揭晓
  ━━━━━━━━━━━━━
  > 【娱乐系统】 返回
