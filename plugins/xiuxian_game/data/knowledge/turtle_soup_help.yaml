body: |
  ━━━━━━━━━━━━━
  **🐢 玩法**
  多人推理猜谜：AI 出一道「汤面」（诡异谜面），大家用是非题逼近隐藏的「汤底」（真相）
  ━━━━━━━━━━━━━
  **🎮 流程**
  【海龟汤】 玩法介绍｜查看本群当前局
  【创建海龟汤】 创建房间（每群同时只有一局）
  【加入海龟汤】 加入当前房间
  【海龟汤限时 15/20/30】 房主设定本局限时（开局前）
  【开始海龟汤】 开局进入类型投票：30 秒内点预设类型按钮（可多选），或发 `类型 关键词1 关键词2`（2~10 个词）自定义类型，获票类型按票数组合出题，无人投票随机
  • 每群每日 5 局；未入局玩家直接 #提问 会自动入局
  ━━━━━━━━━━━━━
  **🔍 推理**
  #提问 你的问题 → 主持人只回答 是 / 不是 / 无关
  #猜汤底 你的答案 → 按说中的关键要点加分，每个要点 1 分
  还原核心真相：额外 +3 分并立即揭晓汤底
  限时 15/20/30 分钟由房主设定（默认 15），结束前 30 秒预警，超时自动揭晓
  • 得分仅当局排名荣誉，纯娱乐不发奖励
  ━━━━━━━━━━━━━
  > 【娱乐系统】 返回
