body: |
  公会镇诡机制细节（供AI客服解答，均为当前实现的准确数值）
  **血量与强度**
  • Boss血量 = 参战基数×54×凶戾度倍率×血祭倍率（下限1000）
  • 参战基数 = 近7天活跃且近7天在本会镇诡出过手的成员攻击合计；近7天无人出手（如新公会）则按全体近7天活跃成员计
  • 凶戾度倍率 = 1+0.08×(凶戾度-1)，同时放大血量、Boss防御、理智侵蚀和开坛费用
  • 镇压成功凶戾度+1；超时未镇压凶戾度-1（下限1）
  • 凶戾度10解锁"邪神眷属"级诡异进入普通开坛池
  • Boss对每个参战者的强度按其自身转数段位锚定，会内强弱成员各自公平
  **参战与伤害**
  • 参战需生命>0且理智>0；理智被打到0会直接重伤
  • 伤害溢出钳制：超出剩余血量的伤害不计入伤害榜，榜单合计=总血量
  **积分与经验**
  • 个人积分 = 参战100 + 满勤(3次)50 + 伤害前三50/30/20，再乘血祭倍率与伤害比例
  • 公会经验基数2000×凶戾度倍率×血祭倍率，吃公会经验神龛加成；超时场按伤害比例折算再减半
  • 超时血祭场：怨念不退、邪坛专属奖励不发，但积分/经验的血祭放大倍率仍生效
  **其他**
  • 有进行中的场次时不能再开坛；结算为懒结算（超时后下次查看或开坛时触发）
