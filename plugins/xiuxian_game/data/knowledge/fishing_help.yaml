body: |
  ━━━━━━━━━━━━━
  **🎣 钓鱼**
  【钓鱼】 冷却5分钟，每日50次，不限地点
  • 鱼竿特权（赞助180诡烛/月）：每次多钓2条不占次数，钓满50次保底送1条橙鱼
  【钓鱼状态】 状态与统计 | 【钓鱼记录】 个人记录
  【钓鱼概率】 我的各品阶概率 | 【钓鱼排行】 | 【钓鱼图鉴】
  【鱼栏 页码】 存量与估值，专属空间不占背包
  【吃鱼 鱼名 数量】 仅娱乐（限现实鱼类） | 【丢弃 鱼名 数量】 放生（"功德"仅为趣味文案，无实际数值）
  ━━━━━━━━━━━━━
  **🐟 稀有度**
  ⚪ 普通 55% · 鲤鱼、鲫鱼、草鱼
  🟢 优良 28% · 鲈鱼、桂鱼、黄花鱼
  🔵 精品 14% · 三文鱼、金枪鱼、石斑鱼
  🟣 稀有 2.5% · 中华鲟、龙鱼
  🟠 传说 0.5% · 金龙鱼、凤凰鱼、虚空鱼
  • 运气值影响稀有鱼概率和数量
  ━━━━━━━━━━━━━
  **🗺️ 坐标联动**
  沿海六城为特色钓点：稀有鱼概率提升
  钓点钓出🔵精品时有概率是该城专属鱼（六城各一种）
  诡域中垂钓上钩的是诡鱼谱系，10层及更深处钓鱼有成就
  偶尔打捞起杂物，部分杂物可【献祭】换怨念值
  ━━━━━━━━━━━━━
  **💰 出售**
  沿海城市卖给商人：舟山/海门/鹭岛/荔湾镇/鹏城/琼崖
  稀有度越高越值钱
  ━━━━━━━━━━━━━
  **📖 图鉴**
  【图鉴 物品名称】 详情
  【提交物品图片 物品名 图片URL】 补充配图，需51级起
  ━━━━━━━━━━━━━
  > 【烹饪系统】 鱼类入菜 | 【帮助】 返回
