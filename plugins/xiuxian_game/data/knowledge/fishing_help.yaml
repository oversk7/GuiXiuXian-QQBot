body: |
  随时随地享受钓鱼乐趣，获得各种珍贵鱼类
  ━━━━━━━━━━━━━
  **🎣 钓鱼操作**
  【钓鱼】 开始钓鱼（冷却5分钟）
  【钓鱼状态】 查看当前钓鱼状态和统计
  【钓鱼记录】 查看个人钓鱼记录
  【钓鱼概率】 查看各品阶鱼类的钓到概率
  【钓鱼排行】 查看钓鱼排行榜
  【钓鱼图鉴】 查看详细钓鱼说明
  【鱼栏 页码】 查看鱼类存量（不占背包）
  【吃鱼 鱼名 数量】 品尝鱼类美味（仅娱乐）
  【丢弃 鱼名 数量】 放生鱼类，获得功德
  ━━━━━━━━━━━━━
  **🐟 鱼类稀有度**
  ⚪ 普通（55%）- 鲤鱼、鲫鱼、草鱼等
  🟢 优良（28%）- 鲈鱼、桂鱼、黄花鱼等
  🔵 精品（14%）- 三文鱼、金枪鱼、石斑鱼等
  🟣 稀有（2.5%）- 中华鲟、龙鱼等
  🟠 传说（0.5%）- 金龙鱼、凤凰鱼等
  ━━━━━━━━━━━━━
  **📖 图鉴功能**
  【图鉴 物品名称】 查看物品详细信息
  【提交物品图片 物品名 图片URL】 为物品提供图片（等级>50）
  • 玩家可以为没有图片的物品提供图片，共同完善图鉴
  ━━━━━━━━━━━━━
  **💰 鱼类交易**
  • 可在沿海城市出售给商人（舟山/海门/鹭岛/荔湾镇/鹏城/琼崖）
  • 稀有鱼类价值更高，传说鱼类价值连城
  • 运气值影响稀有鱼概率和数量
  • 使用【钓鱼概率】查看你的实际钓到概率
  ━━━━━━━━━━━━━
  **🎒 鱼栏系统**
  • 鱼类存入专属鱼栏，不占背包空间，容量无限制
  • 使用【鱼栏】查看所有鱼类存量和总估值
  ━━━━━━━━━━━━━
  ⏰ 冷却5分钟 | 每日限制50次 | 💡 不受地点限制，新手友好
  ━━━━━━━━━━━━━
