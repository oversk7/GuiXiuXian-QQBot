body: |
  ━━━━━━━━━━━━━
  **🎣 钓鱼**
  【钓鱼】 冷却5分钟，每日50次，不限地点
  【钓鱼状态】 状态与统计 | 【钓鱼记录】 个人记录
  【钓鱼概率】 我的各品阶概率 | 【钓鱼排行】 | 【钓鱼图鉴】
  【鱼栏 页码】 存量与估值，专属空间不占背包
  【吃鱼 鱼名 数量】 仅娱乐 | 【丢弃 鱼名 数量】 放生得功德
  ━━━━━━━━━━━━━
  **🐟 稀有度**
  ⚪ 普通 55% · 鲤鱼、鲫鱼、草鱼
  🟢 优良 28% · 鲈鱼、桂鱼、黄花鱼
  🔵 精品 14% · 三文鱼、金枪鱼、石斑鱼
  🟣 稀有 2.5% · 中华鲟、龙鱼
  🟠 传说 0.5% · 金龙鱼、凤凰鱼
  • 运气值影响稀有鱼概率和数量
  ━━━━━━━━━━━━━
  **💰 出售**
  沿海城市卖给商人：舟山/海门/鹭岛/荔湾镇/鹏城/琼崖
  稀有度越高越值钱
  ━━━━━━━━━━━━━
  **📖 图鉴**
  【图鉴 物品名称】 详情
  【提交物品图片 物品名 图片URL】 补充配图，需50级以上
  ━━━━━━━━━━━━━
  > 【烹饪系统】 鱼类入菜 | 【帮助】 返回
