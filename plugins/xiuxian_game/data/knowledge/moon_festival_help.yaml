body: |
  > 活动7天，结束后仅保留兑换2天。
  ━━━━━━━━━━━━━
  **采月** · 每日两种不同行动，各得20月华
  【签到】·【修炼】·【探索】·【烹饪】
  成功完成才计入，同日重复不计。
  ━━━━━━━━━━━━━
  **守月** · 累计40 / 80 / 120月华，逐关【守月】
  兑换不影响累计；战败不扣月华、不丢进度，可恢复后重试。
  三关通关得称号「守月人」与月轮残片。
  ━━━━━━━━━━━━━
  **兑换** · 【月华商店】查看效果与限购
  【月华商店 兑换 <物品名> [数量]】
  例：【月华商店 兑换 团圆月饼 2】
  ━━━━━━━━━━━━━
  【月蚀祭】·【月华商店】
