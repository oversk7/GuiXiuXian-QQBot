body: |
  > 活动7天，结束后仅保留兑换2天。
  ━━━━━━━━━━━━━
  **采月** · 每日两种不同行动，各得20月华
  【签到】·【修炼】·【探索】·【烹饪】
  成功完成才计入，同日重复不计。
  ━━━━━━━━━━━━━
  **守月** · 累计40 / 80 / 120月华，逐关【守月】
  兑换不影响累计；战败不扣月华、不丢进度，可恢复后重试。
  三关通关得称号「守月人」与月轮残片。
  ━━━━━━━━━━━━━
  **兑换** · 【月华商店】查看效果与限购
  【月华商店 兑换 <物品名> [数量]】
  例：【月华商店 兑换 团圆月饼 2】
  **仙品铭文抽奖** · 商店顶部「月下赌桌」，每次40月华，本期每人限抽5次，兑换后立即开奖。
  可点击【揭一签】或【连揭】；连揭次数与花费按剩余月华、签位显示。
  【月华商店 兑换 仙品铭文抽奖 [次数]】
  每抽独立：40%获得随机仙品铭文×1；铭文碎片×3、团圆月饼×1、桂月露×1各20%。
  仙品从全部基础与高级铭文中等概率抽取，随机属性位于各自区间的95%～100%。
  每抽必得一项奖励，小奖也消耗月华和抽奖次数，不占普通商品的限购次数。
  ━━━━━━━━━━━━━
  【月蚀祭】·【月华商店】
