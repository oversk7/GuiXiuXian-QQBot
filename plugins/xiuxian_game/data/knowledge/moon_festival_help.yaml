  - 月华商店
  - 团圆月饼
  - 桂月露
  - 望月符
body: |
  月蚀祭开放7天，活动结束后可继续兑换2天。
  ━━━━━━━━━━━━━
  【月蚀祭】 查看活动时间、月华和个人关卡
  每天从【签到】【修炼】【探索】【烹饪】任选两种不同的成功行动，
  每种获得20月华；同一天重复行动不再获得月华。无需公会或组队。
  ━━━━━━━━━━━━━
  月华累计达到40/80/120时，使用【守月】挑战对应的三关。
  战败可恢复状态后重试，不扣月华，也不会丢失关卡进度。
  通关奖励为团圆月饼、桂月露，以及最终的称号「守月人」和纪念物。
  【切换称号 守月人】佩戴称号。
  ━━━━━━━━━━━━━
  【月华商店】 查看个人限购及剩余月华
  【月华商店 兑换 团圆月饼】 兑换月饼；也可兑换桂月露、望月符
  桂月露每份恢复30%生命和理智，20月华，本期限兑2份。
  望月符提供30分钟命中率+10、暴击率+5，15月华，本期限兑2份。
  例如：【月华商店 兑换 团圆月饼 2】
  未完成任务无需补签；活动期间任意3天完成两项即可挑战全部关卡。
