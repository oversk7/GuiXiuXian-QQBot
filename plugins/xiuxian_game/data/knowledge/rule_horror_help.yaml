body: |
  AI 实时生成的规则怪谈冒险：每一局都是全新的场景、规则与隐藏真相。用自然语言描述行动，AI 判定后果；违反规则会付出代价，推理出真相才能活着离开。
  ━━━━━━━━━━━━━
  **🎲 开始游戏**
  【rg 开始 单人】 生成全新剧本（门票金币×500，生成约需两分钟）
  【rg 剧本列表】 查看剧本库
  【rg 开始 单人 剧本 编号】 用库存剧本开局（门票仅×100，半分钟开局）
  【rg 开始 多人】 创建多人大厅，队友用【rg 加入】
  【rg 开始 多人 开始】 人齐后房主正式开局
  【rg 强制开始 单人】 覆盖当前进度重新开始
  • 你玩过的新剧本会自动入库，供所有群复用
  • 玩过的剧本谜底已揭晓，重玩没意思——剧透与否靠自觉
  • 每群每日限 3 局
  ━━━━━━━━━━━━━
  **🎭 进行游戏**
  【rg 行动 行动描述】 用自然语言描述你要做什么
  【rg 状态】 查看体力/理智/心理状态
  【rg 剧情】 回看剧情导入 | 【rg 场景】 场景印象
  【rg 规则】 查看你记录的规则笔记
  【rg 记录规则 内容】 记录你推理出的规则
  【rg 推理 内容】 记录推理 | 【rg 提示 规则/线索】 获取提示
  【rg 道具】 道具列表 | 【rg 线索】 线索列表
  【rg 身份】 多人模式查看身份（发到私信，用【消息】查看）
  ━━━━━━━━━━━━━
  **🏁 结束与结算**
  【rg 结束】 判定结局（多人仅房主）
  【rg 继续】 通关后继续探索 | 【rg 离开】 中途退出
  • 结局奖励：完美 5000 / 成功 3000 / 通关 2000 金币，全体参与者各得
  • 死亡无额外惩罚，只是拿不到奖励
  ━━━━━━━━━━━━━
  **💾 存档**
  【rg 恢复】 恢复中断的游戏 | 【rg 保存 名称】 手动存档
  【rg 读取 名称】 读档 | 【rg 存档列表】 查看存档
  ━━━━━━━━━━━━━
  **⚠️ 玩法提示**
  • 理智值影响你看到的世界：低于 40 时描述开始扭曲失真
  • 规则有真有假，即死规则极少但存在，谨慎「故意违规」
  • 多人模式身份信息互相保密，配合与猜疑并存
  ━━━━━━━━━━━━━
  > 【福利娱乐】 返回娱乐菜单 | 【帮助】 返回主菜单
