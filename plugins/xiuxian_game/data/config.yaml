# 游戏基础配置
game:
  max_level: 200  # 最大等级
  base_exp: 100   # 基础经验值（1级到2级所需经验）
  points_per_level: 5  # 每次升级获得的属性点数
  exp_curve:
    early_multiplier: 100
    late_multiplier: 80
    curve_change_level: 15
  attributes_base:
    max_hp: 10    # 体 (max_hp) 基础增量
    max_mp: 10    # 智 (max_mp) 基础增量
    attack: 10     # 力 (attack) 基础增量
    defense: 8    # 防 (defense) 基础增量
    agility: 2    # 敏 (agility) 基础增量