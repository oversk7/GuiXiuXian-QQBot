# 游戏基础配置
game:
  max_level: 300  # 最大等级
  base_exp: 10   # 基础经验值（1级到2级所需经验）
  points_per_level: 10  # 每次升级获得的属性点数
  exp_curve:
    early_multiplier: 10
    late_multiplier: 6
    curve_change_level: 10
  inventory_page_size: 10  # 背包每页显示物品数量

  # 冥返机制配置
  reincarnation:
    cultivation_efficiency_bonus: 0.5  # 每转修炼效率加成（50%*转数）
    seclusion_efficiency_bonus: 0.5   # 每转闭关效率 加成（50%*转数）

# 资源控制配置
resource_control:
  # 材料掉落基础概率（会根据等级和稀有度调整）
  base_drop_rates:
    white: 0.30    # 白色材料基础掉落率
    green: 0.15    # 绿色材料基础掉落率
    blue: 0.08     # 蓝色材料基础掉落率
    purple: 0.03   # 紫色材料基础掉落率
    orange: 0.01   # 橙色材料基础掉落率

  # 不同等级段的资源获取倍率
  level_multipliers:
    1-20: 1.0      # 新手期：正常获取
    21-60: 0.9     # 成长期：略微减少，鼓励探索高级区域
    61-100: 0.8    # 进阶期：进一步减少低级材料获取
    101+: 0.7      # 高手期：大幅减少低级材料，专注高级材料

  # 商人价格倍率（相对于基础价格）
  merchant_price_range: [1.2, 1.5]  # 商人价格为基础价格的1.2-1.5倍


# 修炼基础配置
cultivate:
    cool_down: 300  # 冷却时间（秒）
    base_exp: 50   # 基础经验值
    breakthrough:
        change_level: 30  # 多高等级之后才可能失败
        fail_keep_ratio: 0.7  # 失败保留经验比例
        guardian_cost: 50  # 怨念值护航消耗
        guardian_cost_base: 50  # 护航基础怨念值消耗
        guardian_cost_per_level: 15  # 每级额外消耗
        base_success_rate: 0.8  # change_level 时的基础成功率
        decay_per_level: 0.005   # 每提高一级成功率递减值
        min_success_rate: 0.1    # 最低成功率下限
        # 失败累加机制
        fail_bonus_enabled: true  # 是否启用失败累加机制
        fail_bonus_rate: 0.01     # 每次失败增加的成功率(1%)
        fail_bonus_max_rate: 0.95 # 成功率上限(95%)
        # 保底机制
        pity_threshold: 10        # 连续失败次数达到此值后必定成功
    attributes_base:
        max_hp: 3    # 体 (max_hp) 基础增量
        max_mp: 1    # 智 (max_mp) 基础增量
        attack: 1     # 力 (attack) 基础增量
        defense: 1    # 防 (defense) 基础增量
        agility: 1    # 敏 (agility) 基础增量
        luck: 1       # 运 (luck) 基础增量

# 月卡配置
monthly_card:
  basic:
    name: "基础月卡"
    cultivation_efficiency: 0.2      # 修炼效率+20%
    seclusion_time_limit: 9          # 闭关时长上限9小时
    seclusion_efficiency: 0.2        # 闭关效率+20%
    inventory_bonus: 5               # 背包格子+5
    auto_collect: false              # 不自动采集
    sign_stamina_bonus: 5            # 签到咒抗上限增加+5
    sign_monthly_card_boxes: 1       # 签到获得月卡宝箱数量
    breakthrough_protection: 0.75     # 突破失败时修为保留比例75%
  premium:
    name: "高级月卡"
    cultivation_efficiency: 0.5      # 修炼效率+50%
    seclusion_time_limit: 12         # 闭关时长上限12小时
    seclusion_efficiency: 0.5        # 闭关效率+50%
    inventory_bonus: 20              # 背包格子+20
    auto_collect: true               # 自动采集材料
    sign_stamina_bonus: 5            # 签到咒抗上限增加+5
    sign_monthly_card_boxes: 3       # 签到获得月卡宝箱数量
    breakthrough_protection: 0.8     # 突破失败时修为保留比例80%

# 管理员配置
admin:
  # 管理员QQ号列表（加密ID）
  admin_ids: ['D6A7BB606845F1AFF40ADA517F7BF306','10828B7EC666EF1E868F52B96FE5F265']
  sub_admin_ids: ['25923E084C80C8D64AE10ADA5536D25B']

# AI对话配置
ai_dialogue:
  # LLM服务商配置
  provider: "ai302"  # zhipu | ai302 | openai | claude | local

  # 智谱AI配置（付费，备用）
  zhipu:
    api_key: "***REMOVED***"  # 智谱AI API密钥
    model: "GLM-4-Flash-250414"  # 默认模型
    max_tokens: 300  # 单次对话最大token数
    temperature: 0.1  # 温度参数（0-1）
    timeout: 30  # API调用超时时间（秒）

  # 302.ai配置（免费，主用）
  ai302:
    api_key: "***REMOVED***"  # 302.ai API密钥（需填写）
    model: "glm-z1-flash"  # 默认模型
    max_tokens: 8192  # 单次对话最大token数
    temperature: 0.6  # 温度参数（0-1）
    timeout: 30  # API调用超时时间（秒）

  # 降级策略配置
  fallback:
    enabled: true  # 是否启用降级机制
    fallback_provider: "zhipu"  # 主provider失败时的备用provider（zhipu | ai302）
    max_retries: 1  # 每个provider的最大重试次数

  # 对话历史管理
  history:
    max_rounds: 5  # 保留最近多少轮对话（用于AI上下文）
    ttl_days: 30  # 对话历史保留天数

  # 限速控制（GLM-4.5-Flash为免费模型，仅需控制调用频率）
  rate_limit:
    max_calls_per_player_per_minute: 12  # 每玩家每分钟最大调用次数
    max_calls_per_player_per_day: 500  # 每玩家每天最大调用次数
    global_max_calls_per_minute: 600  # 全局每分钟最大调用次数
    global_max_calls_per_hour: 5000  # 全局每小时最大调用次数

  # 响应缓存
  cache:
    enabled: true  # 是否启用缓存
    ttl_seconds: 3600  # 缓存有效期（秒）

  # 内容安全
  safety:
    forbidden_topics:  # 禁忌话题
      - "政治"
      - "色情"
      - "暴力"
      - "赌博"
      - "诈骗"
    max_response_length: 200  # 最大回复长度（字符）
    min_response_length: 10  # 最小回复长度（字符）


