# 游戏基础配置
game:
  max_level: 300  # 最大等级
  base_exp: 10   # 基础经验值（1级到2级所需经验）
  points_per_level: 10  # 每次升级获得的属性点数
  exp_curve:
    early_multiplier: 10
    late_multiplier: 6
    curve_change_level: 10
  inventory_page_size: 10  # 背包每页显示物品数量

  # 冥返机制配置
  reincarnation:
    cultivation_efficiency_bonus: 0.5  # 每转修炼效率加成（50%*转数）
    seclusion_efficiency_bonus: 0.5   # 每转闭关效率 加成（50%*转数）

# 区服配置
servers:
  1:
    name: "一区"
    config_profile: "legacy"
    open_registration: true
  2:
    name: "二区"
    config_profile: "new_shard"
    open_registration: true

# 区服数值配置覆盖。legacy 为空时沿用上方默认配置。
server_profiles:
  legacy: {}
  new_shard:
    game:
      base_exp: 20
      exp_curve:
        early_multiplier: 12
        late_multiplier: 8
        curve_change_level: 10
    cultivate:
      base_exp: 35
      breakthrough:
        change_level: 25
        fail_keep_ratio: 0.8
        guardian_cost: 60
        guardian_cost_base: 60
        guardian_cost_per_level: 18
        base_success_rate: 0.75
        decay_per_level: 0.006
        min_success_rate: 0.12

# 资源控制配置
resource_control:
  # 材料掉落基础概率（会根据等级和稀有度调整）
  base_drop_rates:
    white: 0.30    # 白色材料基础掉落率
    green: 0.15    # 绿色材料基础掉落率
    blue: 0.08     # 蓝色材料基础掉落率
    purple: 0.03   # 紫色材料基础掉落率
    orange: 0.01   # 橙色材料基础掉落率

  # 不同等级段的资源获取倍率
  level_multipliers:
    1-20: 1.0      # 新手期：正常获取
    21-60: 0.9     # 成长期：略微减少，鼓励探索高级区域
    61-100: 0.8    # 进阶期：进一步减少低级材料获取
    101+: 0.7      # 高手期：大幅减少低级材料，专注高级材料

  # 商人价格倍率（相对于基础价格）
  merchant_price_range: [1.2, 1.5]  # 商人价格为基础价格的1.2-1.5倍


# 修炼基础配置
cultivate:
    cool_down: 300  # 冷却时间（秒）
    base_exp: 50   # 基础经验值
    breakthrough:
        change_level: 30  # 多高等级之后才可能失败
        fail_keep_ratio: 0.7  # 失败保留经验比例
        guardian_cost: 50  # 怨念值护航消耗
        guardian_cost_base: 50  # 护航基础怨念值消耗
        guardian_cost_per_level: 15  # 每级额外消耗
        base_success_rate: 0.8  # change_level 时的基础成功率
        decay_per_level: 0.005   # 每提高一级成功率递减值
        min_success_rate: 0.1    # 最低成功率下限
        # 失败累加机制
        fail_bonus_enabled: true  # 是否启用失败累加机制
        fail_bonus_rate: 0.01     # 每次失败增加的成功率(1%)
        fail_bonus_max_rate: 0.95 # 成功率上限(95%)
        # 保底机制
        pity_threshold: 10        # 连续失败次数达到此值后必定成功
    attributes_base:
        max_hp: 3    # 体 (max_hp) 基础增量
        max_mp: 1    # 智 (max_mp) 基础增量
        attack: 1     # 力 (attack) 基础增量
        defense: 1    # 防 (defense) 基础增量
        agility: 1    # 敏 (agility) 基础增量
        luck: 1       # 运 (luck) 基础增量

# 月卡配置
monthly_card:
  basic:
    name: "基础月卡"
    cultivation_efficiency: 0.2      # 修炼效率+20%
    seclusion_time_limit: 9          # 闭关时长上限9小时
    seclusion_efficiency: 0.2        # 闭关效率+20%
    inventory_bonus: 5               # 背包格子+5
    auto_collect: false              # 不自动采集
    sign_stamina_bonus: 5            # 签到咒抗上限增加+5
    sign_monthly_card_boxes: 1       # 签到获得月卡宝箱数量
    breakthrough_protection: 0.75     # 突破失败时修为保留比例75%
  premium:
    name: "高级月卡"
    cultivation_efficiency: 0.5      # 修炼效率+50%
    seclusion_time_limit: 12         # 闭关时长上限12小时
    seclusion_efficiency: 0.5        # 闭关效率+50%
    inventory_bonus: 20              # 背包格子+20
    auto_collect: true               # 自动采集材料
    sign_stamina_bonus: 5            # 签到咒抗上限增加+5
    sign_monthly_card_boxes: 3       # 签到获得月卡宝箱数量
    breakthrough_protection: 0.8     # 突破失败时修为保留比例80%

# 管理员配置
admin:
  # 管理员QQ号列表（加密ID）
  admin_ids: ['D6A7BB606845F1AFF40ADA517F7BF306','10828B7EC666EF1E868F52B96FE5F265']
  sub_admin_ids: ['25923E084C80C8D64AE10ADA5536D25B']

# AI对话配置
ai_dialogue:
  # LLM服务商配置
  provider: "mikumiku"  # deepseek | zhipu | ai302 | scnet | volcengine | mikumiku

  # DeepSeek配置（OpenAI兼容接口）
  deepseek:
    api_key: "***REMOVED***"
    model: "deepseek-v4-flash"  # DeepSeek默认非思考对话模型
    max_tokens: 300
    temperature: 0.6
    timeout: 30

  # 智谱AI配置
  zhipu:
    api_key: "***REMOVED***"  # 智谱AI API密钥
    model: "GLM-4.7"  # 默认模型
    max_tokens: 300  # 单次对话最大token数
    temperature: 0.7  # 温度参数（0-1）
    timeout: 30  # API调用超时时间（秒）

  # 火山引擎配置（豆包，DeepSeek-V3.2）
  volcengine:
    api_key: "***REMOVED***"
    model: "ep-20260321201048-h78tm"  # endpoint ID 对应 DeepSeek-V3.2
    max_tokens: 300
    temperature: 0.6
    timeout: 30

  # scnet配置（算力网）
  scnet:
    api_key: "***REMOVED***="
    model: "DeepSeek-V3.2"
    max_tokens: 300
    temperature: 0.6
    timeout: 30

  # mikumiku中转配置（OpenAI兼容接口）
  mikumiku:
    api_key: "***REMOVED***"
    model: "gemini-3-flash-preview"  # 可用：gemini-3-flash-preview | gpt-5.6-luna
    max_tokens: 300
    temperature: 0.6
    timeout: 30

  # 302.ai配置（免费，主用）
  ai302:
    api_key: "***REMOVED***"  # 302.ai API密钥（需填写）
    model: "glm-z1-flash"  # 默认模型
    max_tokens: 500  # 单次对话最大token数
    temperature: 0.6  # 温度参数（0-1）
    timeout: 30  # API调用超时时间（秒）

  # 降级策略配置
  fallback:
    enabled: true  # 是否启用降级机制
    fallback_provider: "deepseek"  # 主provider失败时的备用provider（deepseek | volcengine | ai302 | scnet | zhipu | mikumiku）
    max_retries: 1  # 每个provider的最大重试次数

  # 对话历史管理
  history:
    max_rounds: 10  # 保留最近多少轮对话（用于AI上下文）
    ttl_days: 30  # 对话历史保留天数

  # 限速控制（GLM-4.5-Flash为免费模型，仅需控制调用频率）
  rate_limit:
    max_calls_per_player_per_minute: 12  # 每玩家每分钟最大调用次数
    max_calls_per_player_per_day: 500  # 每玩家每天最大调用次数
    global_max_calls_per_minute: 600  # 全局每分钟最大调用次数
    global_max_calls_per_hour: 5000  # 全局每小时最大调用次数

  # 响应缓存
  cache:
    enabled: true  # 是否启用缓存
    ttl_seconds: 3600  # 缓存有效期（秒）

  # 内容安全
  safety:
    forbidden_topics:  # 禁忌话题
      - "政治"
      - "色情"
      - "暴力"
      - "赌博"
      - "诈骗"
    max_response_length: 200  # 最大回复长度（字符）
    min_response_length: 10  # 最小回复长度（字符）

# 规则怪谈玩法配置（移植自 MaiBot rule_horror_plugin）
rule_horror:
  enabled: false  # 2026-07-12 暂时下线：难度高、LLM 耗费大、参与度低；恢复改回 true 并还原帮助入口
  free_games_per_player: 1      # 每人每日免费体验局数
  ticket_candles_new: 10        # 全新剧本门票（诡烛，6 次 LLM 生成）
  ticket_candles_reuse: 5       # 已有剧本/重置进度门票（诡烛，复用只有 1 次开场调用）
  daily_games_per_group: 3      # 每群每日局数上限，0 为不限
  idle_timeout_minutes: 10      # 闲置自动挂起（分钟），0 为不挂起
  rewards:                      # 结局奖励（怪谈稀有宝箱个数，全体参与者各得）
    perfect: 3
    success: 2
    cleared: 1
    failed: 0

  # 以下四段直接对应原插件 config.toml 的同名配置段
  plugin:
    enabled: true
    auto_save_interval: 30
    font_path: ""               # 长图渲染字体，留空自动探测系统字体

  llm:                          # 主流程模型（剧情生成/行动判定/结局）
    api_url: "https://api.deepseek.com/chat/completions"
    api_key: ""                 # 留空自动复用 ai_dialogue.deepseek.api_key
    model_list: ["deepseek-v4-pro"]  # 非思考模式；开思考需用 models 完整配置(延迟翻倍,注意被动回复5分钟时效)
    temperature: 1.0
    max_tokens: 8000
    max_retries: 3
    timeout: 180

  npc_sim:                      # NPC 模拟模型（token 大户，用便宜的 flash）
    enabled: true
    trigger_on_every_action: true
    api_url: "https://api.deepseek.com/chat/completions"
    api_key: ""                 # 留空回退主 llm 的 key
    model_list: ["deepseek-v4-flash"]

  save:
    batch_save_interval: 30
    max_auto_saves: 10
    compress_saves: true

# LLM 用量统计（管理员指令【AI用量】）
llm_usage:
  pricing:  # 元/百万token，按 DeepSeek 官网 USD 价格 ×7.2 换算，可自行修正
    deepseek-v4-pro:
      input_cache_hit: 0.026
      input_cache_miss: 3.13
      output: 6.26
    deepseek-v4-flash:
      input_cache_hit: 0.02
      input_cache_miss: 1.01
      output: 2.02

turtle_soup:
  enabled: true
  daily_games_per_group: 5      # 每群每日局数上限，0 为不限
  unlimited_groups:             # 不受每日局数上限约束的群（官群）
    - "A147FA35C340F858A66260FB4ADBB46D"
  theme_wait_seconds: 30        # 开局后类型投票的等待秒数
  game_duration_minutes: 15     # 新房默认限时（分钟），房主可选 15/20/30；结束前 30 秒预警
  llm:                          # 出题专用：谜题质量依赖 deepseek-v4-pro，勿随意换
    api_url: "https://api.deepseek.com/chat/completions"
    api_key: ""                 # 留空自动复用 ai_dialogue.deepseek.api_key
    model: "deepseek-v4-pro"    # 请求已强制关闭思考（见 turtle_soup._call_llm），避免思考token耗尽预算
    temperature: 1.0
    max_tokens: 6000            # 关闭思考后实际输出约 300~800 token，6000 留足余量
    timeout: 240                # 关闭思考后通常 10 秒内完成，240 秒仅作网络异常兜底
  judge_llm:                    # 提问/猜汤底判定：优先走此配置，失败回退 judge_fallback_llm
    api_url: "https://newapi.mikumiku.love/v1/chat/completions"
    api_key: ""                 # 留空自动复用 ai_dialogue.mikumiku.api_key
    model: "gpt-5.6-luna"       # 判定用高智商模型；可换 gemini-3-flash-preview（自动思考，预算勿低于1500）
    timeout: 60
  judge_fallback_llm:           # 判定备用：judge_llm 失败时用便宜的 DeepSeek Flash，避免消耗出题模型 v4-pro
    api_url: "https://api.deepseek.com/chat/completions"
    api_key: ""                 # 留空自动复用 ai_dialogue.deepseek.api_key
    model: "deepseek-v4-flash"
    temperature: 0.3            # 判定保持低温度，口径稳定
    max_tokens: 1500
    timeout: 60
