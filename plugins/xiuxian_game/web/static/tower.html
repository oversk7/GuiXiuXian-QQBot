<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诡域深渊 · 3D 塔览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06080f;color:#a0c4e8;font-family:'Courier New',monospace}

/* ======== Header ======== */
#hdr{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(6,8,15,.94);border-bottom:1px solid rgba(180,80,255,.2);display:flex;align-items:center;padding:0 16px;z-index:100;backdrop-filter:blur(8px)}
#hdr .logo{font-size:15px;color:#bb66ff;letter-spacing:2px;white-space:nowrap;text-shadow:0 0 10px rgba(180,80,255,.4)}
#hdr .logo span{color:#ff3366;margin-right:4px}
#hdr .stats{margin-left:auto;font-size:11px;color:rgba(160,196,232,.5);display:flex;gap:14px;white-space:nowrap}
#hdr .stats .val{color:#bb66ff}
#hdr .back{color:rgba(160,196,232,.5);text-decoration:none;font-size:12px;margin-right:14px;border:1px solid rgba(160,196,232,.15);border-radius:4px;padding:3px 8px;transition:all .2s}
#hdr .back:hover{color:#00f0ff;border-color:rgba(0,240,255,.3)}

/* ======== Main container ======== */
#scene{position:fixed;top:48px;left:0;right:0;bottom:32px;perspective:1200px;perspective-origin:50% 40%;overflow:hidden;cursor:grab}
#scene:active{cursor:grabbing}

#tower{transform-style:preserve-3d;position:absolute;left:50%;top:50%;transition:transform .1s linear}

/* ======== Layer (each floor) ======== */
.floor{position:absolute;transform-style:preserve-3d;left:-120px;top:0;width:240px;height:240px;cursor:pointer;transition:opacity .3s,filter .2s}
.floor:hover{filter:brightness(1.3)}
.floor.active{filter:brightness(1.4) drop-shadow(0 0 12px rgba(180,80,255,.5))}

/* Grid canvas inside floor */
.floor canvas{width:240px;height:240px;border:1px solid rgba(180,80,255,.15);border-radius:4px;background:rgba(12,8,24,.7)}

/* Floor label */
.floor .lbl{position:absolute;left:-60px;top:50%;transform:translateY(-50%);font-size:10px;color:rgba(180,80,255,.5);white-space:nowrap;text-align:right;width:52px;pointer-events:none}
.floor .lbl b{color:#bb66ff;font-size:12px}
.floor .info{position:absolute;right:-70px;top:50%;transform:translateY(-50%);font-size:9px;color:rgba(160,196,232,.35);white-space:nowrap;pointer-events:none;width:66px}
.floor .info .active-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff3366;box-shadow:0 0 4px #ff3366;vertical-align:middle;margin-right:2px}

/* ======== Detail panel ======== */
#detail{position:fixed;top:48px;right:0;width:280px;bottom:32px;background:rgba(6,8,15,.95);border-left:1px solid rgba(180,80,255,.15);z-index:90;display:none;overflow-y:auto;padding:16px;backdrop-filter:blur(6px)}
#detail.show{display:block}
#detail .title{color:#bb66ff;font-size:16px;font-weight:bold;margin-bottom:10px;text-shadow:0 0 8px rgba(180,80,255,.3)}
#detail .close{position:absolute;top:8px;right:10px;cursor:pointer;color:rgba(160,196,232,.4);font-size:18px}
#detail .close:hover{color:#ff3366}
#detail .row{font-size:11px;color:rgba(160,196,232,.6);margin-bottom:4px}
#detail .row b{color:#bb66ff}
#detail .grid-detail{margin-top:12px}
#detail .grid-detail canvas{width:100%;aspect-ratio:1;border:1px solid rgba(180,80,255,.2);border-radius:6px;background:rgba(12,8,24,.8)}
#detail .legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
#detail .legend .li{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(160,196,232,.5)}
#detail .legend .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ======== Nav controls ======== */
#nav{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:100}
#nav button{background:rgba(12,8,24,.85);border:1px solid rgba(180,80,255,.25);border-radius:6px;color:#bb66ff;padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
#nav button:hover{border-color:#bb66ff;background:rgba(180,80,255,.1)}
#nav button:disabled{opacity:.3;cursor:default}
#nav .page-info{color:rgba(160,196,232,.5);font-size:11px;align-self:center;min-width:80px;text-align:center}

/* ======== Scroll hint ======== */
#scroll-hint{position:fixed;bottom:44px;right:12px;font-size:10px;color:rgba(160,196,232,.3);z-index:100;text-align:right;line-height:1.7}
#scroll-hint kbd{background:rgba(180,80,255,.08);border:1px solid rgba(180,80,255,.15);border-radius:3px;padding:1px 4px;color:rgba(180,80,255,.5)}

/* ======== Footer ======== */
#ftr{position:fixed;bottom:0;left:0;right:0;height:32px;background:rgba(6,8,15,.94);border-top:1px solid rgba(180,80,255,.1);display:flex;align-items:center;padding:0 16px;font-size:10px;color:rgba(160,196,232,.35);z-index:100;gap:16px}
#ftr .hl{color:rgba(180,80,255,.6)}

/* ======== Loading ======== */
#loading{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,15,.97);z-index:500;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#loading .spinner{width:40px;height:40px;border:3px solid rgba(180,80,255,.15);border-top-color:#bb66ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .text{margin-top:12px;color:rgba(180,80,255,.6);font-size:13px}

/* ======== Mobile ======== */
@media(max-width:640px){
  #hdr{height:40px;padding:0 10px}
  #hdr .logo{font-size:13px}
  #hdr .stats{display:none}
  #scene{top:40px;bottom:26px}
  #detail{width:100%;top:auto;bottom:26px;max-height:50vh;border-left:none;border-top:1px solid rgba(180,80,255,.15);border-radius:10px 10px 0 0}
  #scroll-hint{display:none}
  #ftr{height:26px;font-size:9px;padding:0 8px}
  #nav{bottom:34px}
  #nav button{padding:5px 10px;font-size:11px}
}
</style>
</head>
<body>

<div id="loading"><div><div class="spinner"></div><div class="text">正在探查深渊...</div></div></div>

<!-- Header -->
<div id="hdr">
  <a class="back" href="/map">&larr; 态势图</a>
  <div class="logo"><span>&#9650;</span> 诡域深渊 · 塔览</div>
  <div class="stats">
    <span>全服最深 <span class="val" id="s-max">-</span> 层</span>
    <span>当前探索 <span class="val" id="s-active">-</span> 人</span>
  </div>
</div>

<!-- 3D Scene -->
<div id="scene">
  <div id="tower"></div>
</div>

<!-- Detail panel -->
<div id="detail">
  <span class="close" id="detail-close">&times;</span>
  <div class="title" id="d-title"></div>
  <div class="row">诡异等级: <b id="d-monster-lv"></b></div>
  <div class="row">通关人数: <b id="d-cleared"></b></div>
  <div class="row">当前探索: <b id="d-active"></b></div>
  <div class="row">已探明格: <b id="d-explored"></b> / 121</div>
  <div class="grid-detail"><canvas id="d-canvas" width="484" height="484"></canvas></div>
  <div class="legend">
    <div class="li"><div class="dot" style="background:#cc3355"></div>诡异</div>
    <div class="li"><div class="dot" style="background:#33cc66"></div>材料</div>
    <div class="li"><div class="dot" style="background:#ffaa22"></div>宝箱</div>
    <div class="li"><div class="dot" style="background:#33cccc"></div>驿站</div>
    <div class="li"><div class="dot" style="background:#ff8833"></div>商人</div>
    <div class="li"><div class="dot" style="background:#aa44ff"></div>精英</div>
    <div class="li"><div class="dot" style="background:rgba(80,100,130,.3)"></div>未知</div>
    <div class="li"><div class="dot" style="background:#ff3366;border-radius:50%"></div>玩家</div>
  </div>
</div>

<!-- Page nav -->
<div id="nav">
  <button id="nav-prev" title="上层">&uarr; 浅层</button>
  <div class="page-info" id="nav-info">-</div>
  <button id="nav-next" title="下层">&darr; 深层</button>
</div>

<!-- Hints -->
<div id="scroll-hint">
  <kbd>滚轮</kbd> 旋转 &nbsp; <kbd>拖拽</kbd> 倾斜<br>
  <kbd>&uarr;&darr;</kbd> 翻页 &nbsp; <kbd>点击</kbd> 查看层
</div>

<!-- Footer -->
<div id="ftr">
  <span>诡域塔 · <span class="hl">无限重</span></span>
  <span>格子类型：诡异 / 材料 / 宝箱 / 驿站 / 商人 / 精英</span>
  <span style="margin-left:auto">数据延迟约 1 天</span>
</div>

<script nonce="%%CSP_NONCE%%">
// ============================================================
//  CONFIG
// ============================================================
const API = '/api/tower/data';
const PAGE_SIZE = 20;
const FLOOR_GAP = 56;       // px between floors in 3D
const GRID_SIZE = 11;        // -5 to 5 = 11 cells
const CELL_PX = 20;          // cell size on mini canvas
const DETAIL_CELL = 40;      // cell size on detail canvas

// Tile colors
const TILE_COLORS = {
  EMPTY:    '#cc3355',
  MATERIAL: '#33cc66',
  TREASURE: '#ffaa22',
  REST:     '#33cccc',
  MERCHANT: '#ff8833',
  ELITE:    '#aa44ff',
};
const UNKNOWN_COLOR = 'rgba(80,100,130,0.25)';
const PLAYER_COLOR = '#ff3366';

// ============================================================
//  STATE
// ============================================================
let currentPage = 1;
let totalLayers = 1;
let globalMax = 0;
let layersData = [];
let playersData = [];
let selectedLevel = null;

// 3D rotation
let rotX = 55;    // tilt angle (degrees)
let rotZ = -30;   // spin angle (degrees)
let translateY = 0;
let dragging = false;
let dragStartX = 0, dragStartY = 0;
let dragRotX = 0, dragRotZ = 0;

const scene = document.getElementById('scene');
const tower = document.getElementById('tower');

// ============================================================
//  FETCH DATA
// ============================================================
async function fetchData(page) {
  try {
    const resp = await fetch(`${API}?page=${page}&size=${PAGE_SIZE}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    globalMax = data.global_max || 0;
    totalLayers = data.total_layers || 1;
    layersData = data.layers || [];
    playersData = data.players || [];
    currentPage = data.page || 1;
    return true;
  } catch (e) {
    console.error('Fetch error:', e);
    return false;
  }
}

// ============================================================
//  RENDER TOWER
// ============================================================
function buildTower() {
  tower.innerHTML = '';

  const totalFloors = layersData.length;
  const halfH = (totalFloors - 1) * FLOOR_GAP / 2;

  layersData.forEach((layer, i) => {
    const floor = document.createElement('div');
    floor.className = 'floor';
    if (layer.lv === selectedLevel) floor.classList.add('active');

    // Position: stack vertically in 3D (deeper layers at bottom)
    const yOff = halfH - i * FLOOR_GAP;
    floor.style.transform = `translateY(${-yOff}px) rotateX(90deg)`;

    // Mini canvas (10x10 grid)
    const cvs = document.createElement('canvas');
    cvs.width = GRID_SIZE * CELL_PX;
    cvs.height = GRID_SIZE * CELL_PX;
    drawFloorGrid(cvs, layer);
    floor.appendChild(cvs);

    // Label (left)
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.innerHTML = `<b>${layer.lv}</b>层`;
    floor.appendChild(lbl);

    // Info (right)
    const info = document.createElement('div');
    info.className = 'info';
    let infoHtml = '';
    if (layer.active > 0) infoHtml += `<span class="active-dot"></span>${layer.active}人 `;
    if (layer.cleared > 0) infoHtml += `✓${layer.cleared}`;
    info.innerHTML = infoHtml || '—';
    floor.appendChild(info);

    floor.addEventListener('click', () => selectFloor(layer.lv));
    tower.appendChild(floor);
  });

  updateTowerTransform();
}

function drawFloorGrid(canvas, layer) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Build tile map
  const tileMap = {};
  for (const t of layer.tiles) {
    tileMap[`${t.x},${t.y}`] = t.t;
  }

  // Find players on this layer
  const layerPlayers = playersData.filter(p => p.dl === layer.lv);
  const playerPositions = new Set(layerPlayers.map(p => `${p.x},${p.y}`));

  for (let gx = -5; gx <= 5; gx++) {
    for (let gy = -5; gy <= 5; gy++) {
      const px = (gx + 5) * CELL_PX;
      const py = (5 - gy) * CELL_PX;  // flip Y so positive is up
      const key = `${gx},${gy}`;
      const tileType = tileMap[key];

      // Cell background
      ctx.fillStyle = tileType ? TILE_COLORS[tileType] || UNKNOWN_COLOR : UNKNOWN_COLOR;
      ctx.globalAlpha = tileType ? 0.7 : 0.15;
      ctx.fillRect(px + 1, py + 1, CELL_PX - 2, CELL_PX - 2);

      // Player marker
      if (playerPositions.has(key)) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = PLAYER_COLOR;
        ctx.beginPath();
        ctx.arc(px + CELL_PX / 2, py + CELL_PX / 2, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  // Grid lines
  ctx.strokeStyle = 'rgba(180,80,255,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL_PX, 0);
    ctx.lineTo(i * CELL_PX, h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL_PX);
    ctx.lineTo(w, i * CELL_PX);
    ctx.stroke();
  }

  // Origin marker (0,0)
  const ox = 5 * CELL_PX + CELL_PX / 2;
  const oy = 5 * CELL_PX + CELL_PX / 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ox - 3, oy); ctx.lineTo(ox + 3, oy);
  ctx.moveTo(ox, oy - 3); ctx.lineTo(ox, oy + 3);
  ctx.stroke();
}

// ============================================================
//  3D TRANSFORM
// ============================================================
function updateTowerTransform() {
  tower.style.transform =
    `rotateX(${rotX}deg) rotateZ(${rotZ}deg) translateZ(${translateY}px)`;
}

// ============================================================
//  DETAIL PANEL
// ============================================================
function selectFloor(lv) {
  selectedLevel = lv;
  const layer = layersData.find(l => l.lv === lv);
  if (!layer) return;

  // Update active highlight
  document.querySelectorAll('.floor').forEach((f, i) => {
    f.classList.toggle('active', layersData[i]?.lv === lv);
  });

  // Panel content
  document.getElementById('d-title').textContent = `第 ${lv} 层诡域`;
  document.getElementById('d-monster-lv').textContent = `Lv.${lv * 5}`;
  document.getElementById('d-cleared').textContent = layer.cleared || 0;
  document.getElementById('d-active').textContent = layer.active || 0;
  document.getElementById('d-explored').textContent = layer.tiles.length;

  // Draw detailed grid
  drawDetailGrid(layer);

  document.getElementById('detail').classList.add('show');
}

function drawDetailGrid(layer) {
  const canvas = document.getElementById('d-canvas');
  const ctx = canvas.getContext('2d');
  const S = DETAIL_CELL;
  canvas.width = GRID_SIZE * S + 4;
  canvas.height = GRID_SIZE * S + 4;
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const tileMap = {};
  for (const t of layer.tiles) tileMap[`${t.x},${t.y}`] = t.t;

  const layerPlayers = playersData.filter(p => p.dl === layer.lv);
  const playerMap = {};
  for (const p of layerPlayers) {
    const key = `${p.x},${p.y}`;
    if (!playerMap[key]) playerMap[key] = [];
    playerMap[key].push(p);
  }

  for (let gx = -5; gx <= 5; gx++) {
    for (let gy = -5; gy <= 5; gy++) {
      const px = (gx + 5) * S + 2;
      const py = (5 - gy) * S + 2;
      const key = `${gx},${gy}`;
      const tileType = tileMap[key];

      // Cell fill
      ctx.fillStyle = tileType ? TILE_COLORS[tileType] || UNKNOWN_COLOR : UNKNOWN_COLOR;
      ctx.globalAlpha = tileType ? 0.6 : 0.1;
      ctx.fillRect(px + 1, py + 1, S - 2, S - 2);
      ctx.globalAlpha = 1;

      // Cell border
      ctx.strokeStyle = 'rgba(180,80,255,0.12)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(px + 1, py + 1, S - 2, S - 2);

      // Type icon
      if (tileType) {
        ctx.font = `${Math.floor(S * 0.4)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = TILE_COLORS[tileType];
        const icons = {
          EMPTY: '👻', MATERIAL: '💎', TREASURE: '🎁',
          REST: '🏨', MERCHANT: '🏪', ELITE: '💀'
        };
        ctx.fillText(icons[tileType] || '?', px + S / 2, py + S / 2);
      }

      // Coordinate label at edges
      if (gy === -5) {
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(160,196,232,0.25)';
        ctx.fillText(gx, px + S / 2, py + S + 10);
      }
      if (gx === -5) {
        ctx.font = '8px monospace';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(160,196,232,0.25)';
        ctx.fillText(gy, px - 4, py + S / 2 + 3);
      }

      // Player markers
      const ps = playerMap[key];
      if (ps) {
        ctx.fillStyle = PLAYER_COLOR;
        ctx.shadowBlur = 6;
        ctx.shadowColor = PLAYER_COLOR;
        ctx.beginPath();
        ctx.arc(px + S - 8, py + 8, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (ps.length > 1) {
          ctx.font = 'bold 8px monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#fff';
          ctx.fillText(ps.length, px + S - 8, py + 11);
        }
      }
    }
  }

  // Origin crosshair
  const ox = 5 * S + S / 2 + 2;
  const oy = 5 * S + S / 2 + 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(ox, 2); ctx.lineTo(ox, h - 2);
  ctx.moveTo(2, oy); ctx.lineTo(w - 2, oy);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ============================================================
//  EVENT HANDLERS
// ============================================================

// Drag to rotate
scene.addEventListener('mousedown', e => {
  if (e.target.closest('#detail')) return;
  dragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragRotX = rotX;
  dragRotZ = rotZ;
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  rotZ = dragRotZ + dx * 0.3;
  rotX = Math.max(20, Math.min(80, dragRotX - dy * 0.3));
  updateTowerTransform();
});

window.addEventListener('mouseup', () => { dragging = false; });

// Scroll to shift tower vertically
scene.addEventListener('wheel', e => {
  e.preventDefault();
  translateY += e.deltaY > 0 ? -30 : 30;
  translateY = Math.max(-800, Math.min(800, translateY));
  updateTowerTransform();
}, {passive: false});

// Touch support
let lastTouchDist = 0;
let touchDragging = false;

scene.addEventListener('touchstart', e => {
  if (e.target.closest('#detail')) return;
  if (e.touches.length === 1) {
    touchDragging = true;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    dragRotX = rotX;
    dragRotZ = rotZ;
  }
  e.preventDefault();
}, {passive: false});

scene.addEventListener('touchmove', e => {
  if (touchDragging && e.touches.length === 1) {
    const dx = e.touches[0].clientX - dragStartX;
    const dy = e.touches[0].clientY - dragStartY;
    rotZ = dragRotZ + dx * 0.3;
    rotX = Math.max(20, Math.min(80, dragRotX - dy * 0.3));
    updateTowerTransform();
  }
  e.preventDefault();
}, {passive: false});

scene.addEventListener('touchend', () => { touchDragging = false; });

// Page nav
document.getElementById('nav-prev').addEventListener('click', () => changePage(-1));
document.getElementById('nav-next').addEventListener('click', () => changePage(1));

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); changePage(-1); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); changePage(1); }
});

document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail').classList.remove('show');
  selectedLevel = null;
  document.querySelectorAll('.floor').forEach(f => f.classList.remove('active'));
});

async function changePage(delta) {
  const maxPage = Math.ceil(totalLayers / PAGE_SIZE);
  const newPage = Math.max(1, Math.min(currentPage + delta, maxPage));
  if (newPage === currentPage) return;

  await fetchData(newPage);
  translateY = 0;
  buildTower();
  updateNav();
}

function updateNav() {
  const maxPage = Math.ceil(totalLayers / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, totalLayers);
  document.getElementById('nav-info').textContent = `${start}-${end} / ${totalLayers}层`;
  document.getElementById('nav-prev').disabled = currentPage <= 1;
  document.getElementById('nav-next').disabled = currentPage >= maxPage;
}

function updateStats() {
  document.getElementById('s-max').textContent = globalMax;
  document.getElementById('s-active').textContent = playersData.length;
}

// ============================================================
//  INIT
// ============================================================
(async function init() {
  const ok = await fetchData(1);
  document.getElementById('loading').classList.add('hide');

  if (!ok) {
    tower.innerHTML = '<div style="color:#ff3366;text-align:center;margin-top:200px">数据加载失败</div>';
    return;
  }

  buildTower();
  updateNav();
  updateStats();
})();
</script>
